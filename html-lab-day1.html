<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HTML Lab — Day 1 (KS3)</title>
<style>
  :root{
    --bg:#f7f8fc; --paper:#ffffff; --ink:#111827; --muted:#64748b; --line:#dbe3ef;
    --blue:#2563eb; --blue2:#dbeafe; --green:#15803d; --green2:#dcfce7;
    --red:#b91c1c; --red2:#fee2e2; --yellow:#facc15; --code:#101827; --codeText:#f8fafc;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{font-family:"Aptos","Segoe UI",system-ui,-apple-system,sans-serif;
    background:radial-gradient(circle at top left,#fff 0,#f8fafc 45%,#eef4ff 100%);color:var(--ink);}
  button,textarea,input{font:inherit}

  /* ---- top bar ---- */
  .topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 22px;backdrop-filter:blur(12px);}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:44px;height:44px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:14px;background:#fff;font-size:24px}
  .brand h1{margin:0;font-size:19px;font-weight:900;letter-spacing:-.02em}
  .brand p{margin:2px 0 0;font-size:12px;color:var(--muted);font-weight:700}
  .progress-area{display:flex;align-items:center;gap:10px;flex:1;justify-content:flex-end;flex-wrap:wrap}
  .pill{border:1px solid var(--line);border-radius:999px;padding:7px 12px;background:var(--paper);color:var(--muted);font-weight:800;font-size:13px;white-space:nowrap}
  .bar{width:min(260px,24vw);height:13px;background:#e8eef8;border-radius:999px;overflow:hidden;border:1px solid #d5e0ef}
  .fill{height:100%;width:0%;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .25s ease}

  /* ---- WAGBA banner (top) ---- */
  .wagba{position:sticky;top:69px;z-index:15;background:#111827;color:#fff;padding:12px 22px;display:flex;gap:14px;align-items:flex-start}
  .wagba .tagb{flex:0 0 auto;background:var(--yellow);color:#111827;border-radius:999px;padding:5px 12px;font-weight:1000;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-top:1px}
  .wagba .txt{font-size:14.5px;line-height:1.45;font-weight:600}
  .wagba .txt b{font-weight:900}

  /* ---- main ---- */
  .main{max-width:1180px;margin:0 auto;padding:26px 22px 10px}
  .hero{background:var(--paper);border:2px solid var(--ink);border-radius:24px;box-shadow:0 9px 0 var(--ink);
    padding:22px 24px;margin-bottom:20px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}
  .kicker{display:inline-block;background:var(--blue2);color:#1e3a8a;border:2px solid #1e3a8a;border-radius:999px;
    padding:5px 12px;font-size:12px;font-weight:1000;text-transform:uppercase;letter-spacing:.06em}
  .hero h2{margin:12px 0 8px;font-size:clamp(26px,4vw,44px);line-height:1;letter-spacing:-.03em;font-weight:1000}
  .hero .skill{font-size:18px;line-height:1.4;font-weight:800;color:#263244;max-width:760px}
  .hero-icon{width:104px;height:104px;border:2px solid var(--ink);border-radius:26px;display:grid;place-items:center;font-size:54px;background:#f8fafc}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:22px 24px;margin-bottom:18px}
  .card h3{margin:0 0 8px;font-size:15px;font-weight:1000;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .teach{font-size:18px;line-height:1.55;color:#1f2937;margin:0 0 14px}
  .teach b{color:#111827}
  .task-text{font-size:19px;line-height:1.5;color:#1f2937;margin:0}
  .task-text b{color:#111827}
  code{background:#f1f5f9;border:1px solid #dbe3ef;border-radius:7px;padding:1px 6px;font-family:"Cascadia Code",Consolas,monospace;font-size:.9em;color:#9a3412}
  pre.example{background:var(--code);color:var(--codeText);border-radius:14px;padding:14px 16px;margin:12px 0 0;overflow:auto;
    font-family:"Cascadia Code",Consolas,monospace;font-size:15px;line-height:1.55}
  .ex-label{font-size:12px;font-weight:1000;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:14px 0 0}

  /* requirements checklist */
  .reqs{list-style:none;padding:0;margin:14px 0 0}
  .reqs li{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;margin:6px 0;border:2px solid #e6edf6;border-radius:12px;background:#fbfdff;font-size:16px}
  .reqs li .mark{flex:0 0 auto;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-weight:1000;background:#eef2f7;color:#94a3b8}
  .reqs li.pass{background:var(--green2);border-color:var(--green)} .reqs li.pass .mark{background:var(--green);color:#fff}
  .reqs li.fail{background:var(--red2);border-color:var(--red)} .reqs li.fail .mark{background:var(--red);color:#fff}

  /* editor + preview */
  .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.92fr);gap:16px}
  .panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden}
  .panel-head{height:46px;background:#f8fafc;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--muted);font-weight:900;font-size:14px}
  .dot{width:13px;height:13px;border-radius:50%}.r{background:#ef4444}.y{background:#f59e0b}.g{background:#22c55e}
  .filename{margin-left:6px}
  textarea.editor{width:100%;min-height:300px;border:0;outline:none;resize:vertical;background:var(--code);color:var(--codeText);
    padding:16px;font-family:"Cascadia Code",Consolas,monospace;font-size:16px;line-height:1.6;tab-size:2}
  iframe.preview{width:100%;min-height:300px;border:0;background:#fff;display:block}

  /* buttons */
  .btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
  .btn{border:2px solid var(--ink);border-radius:13px;padding:11px 17px;font-weight:1000;cursor:pointer;background:#fff;box-shadow:0 4px 0 var(--ink);transition:.12s ease}
  .btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 0 var(--ink)}
  .btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
  .btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
  .primary{background:var(--blue);color:#fff}
  .good{background:var(--green);color:#fff}
  .soft{background:#f8fafc;color:#334155}
  .next-cta{background:var(--green);color:#fff}
  .ghostlink{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px}

  .feedback{display:none;border-radius:16px;padding:15px 18px;margin-top:16px;font-size:17px;line-height:1.45;font-weight:800;white-space:pre-wrap}
  .feedback.show{display:block}
  .feedback.success{background:var(--green2);border:2px solid var(--green);color:#14532d}
  .feedback.error{background:var(--red2);border:2px solid var(--red);color:#7f1d1d}
  .feedback.hint{background:var(--blue2);border:2px solid var(--blue);color:#1e3a8a}

  /* inputs */
  .field{margin:12px 0}
  .field label{display:block;font-weight:900;margin-bottom:6px;font-size:15px}
  .field input,.field textarea{width:100%;max-width:520px;border:2px solid var(--line);border-radius:12px;padding:11px 13px;font-size:16px}
  .field textarea{max-width:100%;min-height:74px;resize:vertical}
  .stars{font-size:30px;cursor:pointer;user-select:none;letter-spacing:6px}

  /* flashcards */
  .fc-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:6px}
  .flashcard{width:100%;max-width:460px;height:210px;perspective:1100px;cursor:pointer}
  .fc-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
  .flashcard.flipped .fc-inner{transform:rotateY(180deg)}
  .fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;display:grid;place-items:center;text-align:center;padding:22px;border:2px solid var(--ink);box-shadow:0 7px 0 var(--ink)}
  .fc-front{background:var(--blue);color:#fff}
  .fc-back{background:#fff;transform:rotateY(180deg)}
  .fc-front .q{font-size:21px;font-weight:900;line-height:1.3}
  .fc-front .hint{margin-top:12px;font-size:13px;opacity:.9;font-weight:700}
  .fc-back .tagbig{font-family:"Cascadia Code",Consolas,monospace;font-size:30px;color:var(--blue);font-weight:1000;background:#eff6ff;padding:6px 16px;border-radius:12px;border:2px solid #bfdbfe;margin-bottom:10px}
  .fc-back .desc{font-size:16px;color:#334155;max-width:360px}
  .fc-nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  .fc-count{font-size:14px;color:var(--muted);font-weight:800;min-width:64px;text-align:center}

  /* quiz */
  .qcard{border:2px solid #e6edf6;border-radius:16px;padding:16px;margin:12px 0;background:#fbfdff}
  .qcard .qtext{font-weight:900;font-size:17px;margin-bottom:10px}
  .opt{display:block;width:100%;text-align:left;margin:7px 0;padding:11px 14px;border:2px solid var(--line);background:#fff;border-radius:11px;cursor:pointer;font-size:16px;font-weight:700}
  .opt:hover:not(:disabled){background:#f1f5f9}
  .opt.correct{background:var(--green2);border-color:var(--green)}
  .opt.wrong{background:var(--red2);border-color:var(--red)}
  .opt:disabled{cursor:default}

  /* completion */
  .completion{display:grid;place-items:center;text-align:center;padding:18px 0 30px}
  .completion-card{max-width:760px;background:#fff;border:2px solid var(--ink);box-shadow:0 12px 0 var(--ink);border-radius:30px;padding:40px}
  .completion-card h2{font-size:44px;margin:6px 0 8px;line-height:1}
  .bigscore{font-size:64px;font-weight:1000;color:var(--blue);margin:14px 0}

  /* ---- bottom course menu ---- */
  .coursemenu{max-width:1180px;margin:8px auto 36px;padding:18px 22px;background:var(--paper);border:1px solid var(--line);border-radius:22px}
  .coursemenu .cm-title{font-weight:1000;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:0 0 12px}
  .cm-section{font-size:11px;font-weight:1000;color:var(--blue);text-transform:uppercase;letter-spacing:.1em;margin:12px 4px 6px}
  .cm-row{display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:#fff;border-radius:13px;padding:8px 12px;cursor:pointer;font-size:13px;font-weight:800;color:#334155;transition:.12s}
  .chip:hover{background:#f1f5f9}
  .chip.active{border-color:var(--blue);background:#eff6ff;color:#111827}
  .chip.done{border-color:var(--green);background:var(--green2);color:#14532d}
  .chip .cnum{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:#eef2f7;font-weight:1000;font-size:12px}
  .chip.done .cnum{background:var(--green);color:#fff}
  .chip.active .cnum{background:var(--blue);color:#fff}

  @media (max-width:900px){
    .hero{grid-template-columns:1fr}.hero-icon{display:none}
    .grid{grid-template-columns:1fr}
    .wagba{top:0;position:static}.topbar{position:static}
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="logo">🌐</div><div><h1>HTML Lab — Day 1</h1><p>Year 8 · Build your first web page</p></div></div>
    <div class="progress-area">
      <span class="pill" id="scorePill">Done: 0 / 0</span>
      <div class="bar"><div class="fill" id="progressFill"></div></div>
      <span class="pill" id="stepPill">Step 1</span>
    </div>
  </header>

  <div class="wagba">
    <span class="tagb">WAGBA</span>
    <div class="txt">By the end of today you will be able to: <b>use HTML tags to build a web page</b> — headings, paragraphs, images, links and lists — and <b>check and fix your own code</b>.</div>
  </div>

  <main class="main" id="main"></main>

  <nav class="coursemenu">
    <p class="cm-title">📚 Course menu — jump to any step</p>
    <div id="menu"></div>
  </nav>

<script>
/* ===================== DATA ===================== */
const CARDS = [
  {q:'Holds the BIGGEST main title of the page', tag:'<h1>', desc:'The top heading — used once per page.'},
  {q:'A smaller section heading', tag:'<h2>', desc:'A sub-section title under the main heading.'},
  {q:'A paragraph of normal text', tag:'<p>', desc:'Wraps a block of sentences.'},
  {q:'Puts a picture on the page', tag:'<img>', desc:'Uses src (where) and alt (description). No closing tag.'},
  {q:'Makes a clickable link', tag:'<a>', desc:'Uses href for the web address.'},
  {q:'Starts a bullet-point list', tag:'<ul>', desc:'Unordered list — bullets.'},
  {q:'One item inside a list', tag:'<li>', desc:'A single list item, inside <ul> or <ol>.'},
  {q:'Wraps everything you can SEE on the page', tag:'<body>', desc:'All visible content lives in here.'}
];
const WQUIZ = [
  {q:'Which tag makes the main heading?', opts:['<p>','<h1>','<li>'], a:1},
  {q:'Which tag is for a paragraph of text?', opts:['<p>','<img>','<ul>'], a:0},
  {q:'Which tag puts an image on the page?', opts:['<a>','<img>','<h2>'], a:1},
  {q:'Which tag makes a clickable link?', opts:['<a>','<p>','<li>'], a:0},
  {q:'Which tag starts a bullet list?', opts:['<li>','<ul>','<h1>'], a:1},
  {q:'Which attribute describes an image (accessibility)?', opts:['src','alt','href'], a:1}
];

// requirement test helpers (run on parsed HTML document)
const hasAlt  = d => [...d.querySelectorAll('img')].some(i => (i.getAttribute('alt')||'').trim().length>0);
const hasHref = d => [...d.querySelectorAll('a')].some(a => (a.getAttribute('href')||'').trim().length>0);
const liCount = d => d.querySelectorAll('ul li, ol li').length;
const h1Text  = d => { const h=d.querySelector('h1'); return h && h.textContent.trim().length>0; };
const hasStyleBg = d => [...d.querySelectorAll('[style]')].some(e=>/background/i.test(e.getAttribute('style')||''));

const STEPS = [
  /* 0 */ {type:'start', section:'Start', icon:'🚀', title:'Welcome to HTML Lab', skill:'Get set up, then build a real web page step by step.'},

  /* 1 */ {type:'flash', section:'Warm-Up', icon:'🃏', title:'Tag Flashcards', skill:'Meet the tags you will use today. Flip each card and check your guess.'},
  /* 2 */ {type:'quiz', section:'Warm-Up', icon:'🎮', title:'Tag Quiz', skill:'Quick check: can you match each tag to its job?'},

  /* 3 */ {type:'task', section:'Build your page', icon:'🔤', title:'Add a heading',
    teach:'Headings label your page. <code>&lt;h1&gt;</code> is the biggest title — use it once. <code>&lt;h2&gt;</code> is a smaller section title.',
    example:'<h1>My Minecraft Page</h1>\n<h2>About</h2>',
    task:'In the editor, change the <code>&lt;h1&gt;</code> to <b>your own page title</b>, and add an <code>&lt;h2&gt;</code> underneath that says <code>About</code>.',
    starter:'<!DOCTYPE html>\n<html>\n<body>\n\n  <h1>CHANGE ME: your page title</h1>\n\n\n</body>\n</html>',
    hint:'Type a new line under the h1:  <h2>About</h2>  — remember the closing </h2>.',
    reqs:[
      {label:'A main heading <code>&lt;h1&gt;</code> with your own words in it', test:h1Text},
      {label:'A section heading <code>&lt;h2&gt;</code>', test:d=>d.querySelectorAll('h2').length>=1}
    ]},

  /* 4 */ {type:'task', section:'Build your page', icon:'📝', title:'Add two paragraphs',
    teach:'Normal sentences go inside a <code>&lt;p&gt;</code> (paragraph) tag. Each paragraph needs its own opening and closing tag.',
    example:'<p>I love building huge castles.</p>\n<p>My favourite biome is the cherry grove.</p>',
    task:'Under the <code>About</code> heading, add <b>two</b> <code>&lt;p&gt;</code> paragraphs about your topic.',
    starter:'<!DOCTYPE html>\n<html>\n<body>\n\n  <h1>My Page</h1>\n  <h2>About</h2>\n\n  <!-- add two <p> paragraphs below -->\n\n\n</body>\n</html>',
    hint:'Example: <p>Write a sentence here.</p>  then a second <p>...</p> on the next line.',
    reqs:[ {label:'At least two paragraphs <code>&lt;p&gt;</code>', test:d=>d.querySelectorAll('p').length>=2} ]},

  /* 5 */ {type:'task', section:'Build your page', icon:'🖼️', title:'Add an image',
    teach:'An image uses <code>&lt;img&gt;</code> — a "lonely" tag with no closing buddy. It needs <code>src</code> (where the picture is) and <code>alt</code> (a short description for accessibility).',
    example:'<img src="https://placehold.co/300x180" alt="A picture of my pet cat" width="300">',
    task:'Add an <code>&lt;img&gt;</code> tag. Keep the <code>src</code>, and write your own <code>alt</code> text that describes the picture.',
    starter:'<!DOCTYPE html>\n<html>\n<body>\n\n  <h1>My Page</h1>\n\n  <!-- add an <img> with src and alt below -->\n\n\n</body>\n</html>',
    hint:'Copy the example line. The alt="" part must describe the image, e.g. alt="My dog playing".',
    reqs:[ {label:'An image <code>&lt;img&gt;</code> that has <code>alt</code> text', test:hasAlt} ]},

  /* 6 */ {type:'task', section:'Build your page', icon:'🔗', title:'Add a link',
    teach:'A link uses <code>&lt;a&gt;</code> (the "anchor"). The <code>href</code> attribute is the web address it goes to. The words between the tags are what people click.',
    example:'<a href="https://www.minecraft.net">Visit the website</a>',
    task:'Add an <code>&lt;a&gt;</code> link with an <code>href</code> address. Make the clickable text your own words.',
    starter:'<!DOCTYPE html>\n<html>\n<body>\n\n  <h1>My Page</h1>\n\n  <!-- add an <a href="..."> link below -->\n\n\n</body>\n</html>',
    hint:'Remember the https:// at the start of the address, e.g. <a href="https://www.bbc.co.uk">BBC</a>.',
    reqs:[ {label:'A link <code>&lt;a&gt;</code> with an <code>href</code> address', test:hasHref} ]},

  /* 7 */ {type:'task', section:'Build your page', icon:'📋', title:'Add a list',
    teach:'A bullet list is a <code>&lt;ul&gt;</code> (unordered list). Each bullet is an <code>&lt;li&gt;</code> (list item) inside it.',
    example:'<ul>\n  <li>Diamond pickaxe</li>\n  <li>Elytra</li>\n  <li>Enchanting table</li>\n</ul>',
    task:'Make a <b>Top 3</b> list: a <code>&lt;ul&gt;</code> with <b>three</b> <code>&lt;li&gt;</code> items inside it.',
    starter:'<!DOCTYPE html>\n<html>\n<body>\n\n  <h1>My Top 3</h1>\n\n  <ul>\n\n  </ul>\n\n</body>\n</html>',
    hint:'Put three <li>...</li> lines BETWEEN the <ul> and </ul>.',
    reqs:[ {label:'A list with at least three items <code>&lt;li&gt;</code>', test:d=>liCount(d)>=3} ]},

  /* 8 */ {type:'task', section:'Build your page', icon:'🎨', title:'Add colour (stretch)', stretch:true,
    teach:'You can give a tag a "skin" using the <code>style</code> attribute. We do much more of this next unit (it is called CSS).',
    example:'<body style="background-color:#1e293b; color:white;">',
    task:'Add a <code>style</code> to the <code>&lt;body&gt;</code> tag to change the <b>background colour</b> and text colour. Try colours like <code>gold</code>, <code>tomato</code> or <code>skyblue</code>.',
    starter:'<!DOCTYPE html>\n<html>\n<body style="background-color:CHANGE; color:white;">\n\n  <h1>My colourful page</h1>\n  <p>I picked my own colours.</p>\n\n</body>\n</html>',
    hint:'Replace CHANGE with a colour name or a #hex code, e.g. background-color:skyblue;',
    reqs:[ {label:'The <code>&lt;body&gt;</code> (or a tag) has a <code>style</code> with a background colour', test:hasStyleBg} ]},

  /* 9 */ {type:'task', challenge:true, section:'Challenges', icon:'🎯', title:'Challenge A — type it yourself',
    teach:'No template this time! You type every tag from scratch. This proves you really know it.',
    example:null,
    task:'On the blank page, build: a main heading <code>&lt;h1&gt;</code> and <b>two</b> paragraphs <code>&lt;p&gt;</code> about anything you like.',
    starter:'<!DOCTYPE html>\n<html>\n<body>\n\n  <!-- Type your own h1 and two p tags here -->\n\n\n</body>\n</html>',
    hint:'Start with <h1>Title</h1>, then <p>First sentence.</p> and <p>Second sentence.</p>.',
    reqs:[
      {label:'A main heading <code>&lt;h1&gt;</code> with words in it', test:h1Text},
      {label:'Two paragraphs <code>&lt;p&gt;</code>', test:d=>d.querySelectorAll('p').length>=2}
    ]},

  /* 10 */ {type:'task', challenge:true, section:'Challenges', icon:'🎯', title:'Challenge B — type it yourself',
    teach:'Combine three different tags on one page, all typed by you.',
    example:null,
    task:'Add all three: an <b>image with alt text</b>, a <b>working link</b>, and a <b>list of 2+ items</b>.',
    starter:'<!DOCTYPE html>\n<html>\n<body>\n\n  <h1>My favourites</h1>\n\n  <!-- Add an img (with alt), an a-link, and a ul list -->\n\n\n</body>\n</html>',
    hint:'img: <img src="..." alt="describe it">  ·  link: <a href="https://...">text</a>  ·  list: <ul><li>..</li></ul>',
    reqs:[
      {label:'An image with <code>alt</code> text', test:hasAlt},
      {label:'A link with an <code>href</code>', test:hasHref},
      {label:'A list with 2+ items <code>&lt;li&gt;</code>', test:d=>liCount(d)>=2}
    ]},

  /* 11 */ {type:'task', challenge:true, section:'Challenges', icon:'👑', title:'Boss Challenge — your full page',
    teach:'The big one. Build a complete mini fan-page from a blank screen using EVERYTHING you have learned. This is the page you will submit.',
    example:null,
    task:'From the blank page, build a fan-page with: a heading <code>&lt;h1&gt;</code>, a subheading <code>&lt;h2&gt;</code>, two paragraphs, an image (with alt), a link, and a list.',
    starter:'<!DOCTYPE html>\n<html>\n<head>\n  <title>My Page</title>\n</head>\n<body>\n\n  <!-- Build your whole fan-page here -->\n\n\n</body>\n</html>',
    hint:'Work top to bottom: h1, h2, two p, img with alt, ul with li items, and an a-link.',
    reqs:[
      {label:'Main heading <code>&lt;h1&gt;</code>', test:h1Text},
      {label:'Subheading <code>&lt;h2&gt;</code>', test:d=>d.querySelectorAll('h2').length>=1},
      {label:'Two paragraphs <code>&lt;p&gt;</code>', test:d=>d.querySelectorAll('p').length>=2},
      {label:'Image with <code>alt</code> text', test:hasAlt},
      {label:'A link with <code>href</code>', test:hasHref},
      {label:'A list with 2+ items <code>&lt;li&gt;</code>', test:d=>liCount(d)>=2}
    ]},

  /* 12 */ {type:'reflect', section:'Finish', icon:'💭', title:'Reflection', skill:'Think back over today — this helps your teacher see how you got on.'},
  /* 13 */ {type:'finish', section:'Finish', icon:'🏆', title:'Submit your work', skill:'Hand your work in to your teacher.'}
];

const GRADABLE = new Set();
STEPS.forEach((s,i)=>{ if(s.type==='task'||s.type==='quiz') GRADABLE.add(i); });

/* ===================== STATE / MEMORY ===================== */
const STORE_KEY = 'htmlLabDay1_v2';
let memOK = true;
let state = {
  idx:0, name:'', cls:'',
  codes:{}, done:{}, xp:0,
  quizChoice:{},                       // qi -> chosen
  flashSeen:[],
  reflection:{r1:'',r2:'',r3:'',r4:''}, confidence:0
};
function saveState(){
  if(!memOK) return;
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){ memOK=false; }
}
function loadState(){
  try{
    const s = JSON.parse(localStorage.getItem(STORE_KEY)||'null');
    if(s && typeof s==='object'){
      state = Object.assign(state, s);
      state.codes = s.codes||{}; state.done = s.done||{};
      state.quizChoice = s.quizChoice||{}; state.flashSeen = s.flashSeen||[];
      state.reflection = s.reflection||{r1:'',r2:'',r3:'',r4:''};
    }
  }catch(e){ memOK=false; }
}

/* ===================== HELPERS ===================== */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
let previewTimer;
function codeFor(i){ return (state.codes[i]!==undefined) ? state.codes[i] : (STEPS[i].starter||''); }
function gradableDone(){ let n=0; GRADABLE.forEach(i=>{ if(state.done[i]) n++; }); return n; }

function setProgress(){
  const total = GRADABLE.size, done = gradableDone();
  document.getElementById('progressFill').style.width = Math.round(done/total*100)+'%';
  document.getElementById('scorePill').textContent = `Done: ${done} / ${total}`;
  document.getElementById('stepPill').textContent = `Step ${state.idx+1} of ${STEPS.length}`;
}

/* ===================== RENDER ===================== */
function go(i){ if(i<0||i>=STEPS.length) return; state.idx=i; saveState(); render(); window.scrollTo({top:0,behavior:'smooth'}); }
function nextStep(){ go(Math.min(state.idx+1, STEPS.length-1)); }
function prevStep(){ go(Math.max(state.idx-1, 0)); }

function render(){
  const i = state.idx, step = STEPS[i];
  const main = document.getElementById('main');
  const heroIcon = `<div class="hero-icon">${step.icon||'🌐'}</div>`;
  const kicker = `Step ${i+1} of ${STEPS.length} • ${esc(step.section)}`;
  let hero = `<section class="hero"><div>
      <span class="kicker">${kicker}</span>
      <h2>${esc(step.title)}</h2>
      ${step.skill?`<div class="skill">${step.skill}</div>`:''}
    </div>${heroIcon}</section>`;

  if(step.type==='start')      main.innerHTML = hero + viewStart();
  else if(step.type==='flash') main.innerHTML = hero + viewFlash();
  else if(step.type==='quiz')  main.innerHTML = hero + viewQuiz();
  else if(step.type==='task')  main.innerHTML = hero + viewTask(step,i);
  else if(step.type==='reflect') main.innerHTML = hero + viewReflect();
  else if(step.type==='finish')  main.innerHTML = viewFinish();

  // wire up per-type behaviour
  if(step.type==='flash') initFlash();
  if(step.type==='quiz')  initQuiz();
  if(step.type==='task')  initTask(step,i);
  if(step.type==='reflect') initReflect();
  if(step.type==='finish')  initFinish();

  renderMenu();
  setProgress();
}

/* ---------- START ---------- */
function viewStart(){
  return `<section class="card">
    <h3>Before we begin</h3>
    <p class="teach">Today you'll build your own web page <b>one small step at a time</b>. Each step tells you exactly what to type, shows an example, and lets you press <b>Check</b> to make sure it's right. Use the <b>course menu at the bottom</b> to jump around any time.</p>
    <div class="field"><label for="stuName">Your name</label><input id="stuName" placeholder="e.g. Alex Smith" value="${esc(state.name)}"></div>
    <div class="field"><label for="stuClass">Class / form</label><input id="stuClass" placeholder="e.g. 8B" value="${esc(state.cls)}"></div>
  </section>
  <div class="btnrow"><button class="btn next-cta" onclick="nextStep()">Start building →</button></div>`;
}
function initStart(){}

/* ---------- FLASHCARDS ---------- */
let fcOrder=[], fcPos=0;
function viewFlash(){
  return `<section class="card">
    <p class="teach">Read the job on the blue card, guess which tag does it, then <b>click the card to flip</b> and check. Try to get through them all before you move on.</p>
    <div class="fc-wrap">
      <div class="flashcard" id="flashcard" onclick="flipCard()">
        <div class="fc-inner">
          <div class="fc-face fc-front"><div><div class="q" id="fcQ"></div><div class="hint">🤔 Which tag? (click to flip)</div></div></div>
          <div class="fc-face fc-back"><div><div class="tagbig" id="fcTag"></div><div class="desc" id="fcDesc"></div></div></div>
        </div>
      </div>
      <div class="fc-nav">
        <button class="btn soft" onclick="fcPrev()">◀ Prev</button>
        <span class="fc-count" id="fcCount"></span>
        <button class="btn primary" onclick="fcNext()">Next ▶</button>
        <button class="btn soft" onclick="fcShuffle()">🔀 Shuffle</button>
      </div>
    </div>
  </section>
  <div class="btnrow"><button class="btn soft" onclick="prevStep()">← Back</button><button class="btn next-cta" onclick="nextStep()">I've seen the cards → Next</button></div>`;
}
function initFlash(){ if(fcOrder.length!==CARDS.length){ fcOrder=CARDS.map((_,i)=>i); fcPos=0; } drawCard(); }
function drawCard(){
  const c=CARDS[fcOrder[fcPos]];
  if(!state.flashSeen.includes(fcOrder[fcPos])){ state.flashSeen.push(fcOrder[fcPos]); saveState(); }
  const card=document.getElementById('flashcard'); if(!card) return;
  card.classList.remove('flipped');
  document.getElementById('fcQ').textContent=c.q;
  document.getElementById('fcTag').textContent=c.tag;
  document.getElementById('fcDesc').textContent=c.desc;
  document.getElementById('fcCount').textContent=(fcPos+1)+' / '+CARDS.length;
}
function flipCard(){ document.getElementById('flashcard').classList.toggle('flipped'); }
function fcNext(){ fcPos=(fcPos+1)%CARDS.length; drawCard(); }
function fcPrev(){ fcPos=(fcPos-1+CARDS.length)%CARDS.length; drawCard(); }
function fcShuffle(){ for(let i=fcOrder.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[fcOrder[i],fcOrder[j]]=[fcOrder[j],fcOrder[i]];} fcPos=0; drawCard(); }

/* ---------- QUIZ ---------- */
function viewQuiz(){
  const qs = WQUIZ.map((q,qi)=>`
    <div class="qcard" data-qi="${qi}">
      <div class="qtext">${qi+1}. ${esc(q.q)}</div>
      ${q.opts.map((o,oi)=>`<button class="opt" data-oi="${oi}">${esc(o)}</button>`).join('')}
    </div>`).join('');
  return `<section class="card">
    <p class="teach">Pick the right answer for each one. You get one go per question, so think first!</p>
    ${qs}
    <div class="feedback hint show" id="quizScore">Answered: 0 / ${WQUIZ.length}</div>
  </section>
  <div class="btnrow"><button class="btn soft" onclick="prevStep()">← Back</button><button class="btn next-cta" id="quizNext" onclick="nextStep()">Next →</button></div>`;
}
function initQuiz(){
  const i = state.idx;
  document.querySelectorAll('.qcard').forEach(card=>{
    const qi=+card.dataset.qi, opts=card.querySelectorAll('.opt');
    const prev = state.quizChoice[qi];
    if(prev!=null){
      opts.forEach(x=>x.disabled=true);
      if(+prev===WQUIZ[qi].a) opts[+prev].classList.add('correct');
      else { opts[+prev].classList.add('wrong'); opts[WQUIZ[qi].a].classList.add('correct'); }
    }
    opts.forEach(o=>{
      o.onclick=()=>{
        if(state.quizChoice[qi]!=null) return;
        const oi=+o.dataset.oi; state.quizChoice[qi]=oi;
        opts.forEach(x=>x.disabled=true);
        if(oi===WQUIZ[qi].a){ o.classList.add('correct'); state.xp+=5; }
        else { o.classList.add('wrong'); opts[WQUIZ[qi].a].classList.add('correct'); }
        const ans=Object.keys(state.quizChoice).length;
        const sc=document.getElementById('quizScore'); sc.textContent=`Answered: ${ans} / ${WQUIZ.length}`;
        if(ans>=WQUIZ.length){ state.done[i]=true; sc.className='feedback success show'; sc.textContent=`All done! You scored ${quizCorrect()} / ${WQUIZ.length}.`; }
        saveState(); renderMenu(); setProgress();
      };
    });
  });
  const ans=Object.keys(state.quizChoice).length;
  const sc=document.getElementById('quizScore');
  if(ans>=WQUIZ.length){ state.done[i]=true; sc.className='feedback success show'; sc.textContent=`All done! You scored ${quizCorrect()} / ${WQUIZ.length}.`; }
  else sc.textContent=`Answered: ${ans} / ${WQUIZ.length}`;
}
function quizCorrect(){ let n=0; Object.keys(state.quizChoice).forEach(qi=>{ if(+state.quizChoice[qi]===WQUIZ[+qi].a) n++; }); return n; }

/* ---------- TASK / CHALLENGE ---------- */
function viewTask(step,i){
  const reqs = step.reqs.map((r,idx)=>`<li data-i="${idx}"><span class="mark">?</span><span>${r.label}</span></li>`).join('');
  const example = step.example ? `<p class="ex-label">Example</p><pre class="example">${esc(step.example)}</pre>` : '';
  const teach = step.teach ? `<p class="teach">${step.teach}</p>` : '';
  return `<section class="card">
    ${teach}
    <h3>✅ Your task${step.stretch?' (stretch — optional)':''}</h3>
    <p class="task-text">${step.task}</p>
    ${example}
    <ul class="reqs" id="reqs">${reqs}</ul>
  </section>
  <section class="grid">
    <div class="panel">
      <div class="panel-head"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="filename">mypage.html</span></div>
      <textarea class="editor" id="code" spellcheck="false"></textarea>
    </div>
    <div class="panel">
      <div class="panel-head"><span class="dot g"></span><span class="filename">Live preview — what a browser shows</span></div>
      <iframe class="preview" id="preview" title="Live preview"></iframe>
    </div>
  </section>
  <div class="btnrow">
    <button class="btn soft" onclick="prevStep()">← Back</button>
    <button class="btn primary" onclick="checkTask()">✅ Check my work</button>
    <button class="btn good" onclick="nextStep()">Next →</button>
    <button class="btn soft" onclick="showHint()">💡 Hint</button>
    <button class="btn soft" onclick="resetTask()">↺ Reset</button>
  </div>
  <div class="feedback" id="feedback"></div>`;
}
function initTask(step,i){
  const ta=document.getElementById('code');
  ta.value = codeFor(i);
  runPreview();
  ta.addEventListener('input', ()=>{
    state.codes[i]=ta.value; saveState();
    clearTimeout(previewTimer); previewTimer=setTimeout(runPreview, 500);
  });
  ta.addEventListener('keydown', e=>{ if(e.key==='Tab'){ e.preventDefault(); const s=ta.selectionStart,en=ta.selectionEnd; ta.setRangeText('  ',s,en,'end'); state.codes[i]=ta.value; saveState(); }});
  if(state.done[i]) markTaskPass(true);
}
function runPreview(){ const p=document.getElementById('preview'); if(p) p.srcdoc=document.getElementById('code').value; }
function checkTask(){
  const i=state.idx, step=STEPS[i];
  const doc=new DOMParser().parseFromString(document.getElementById('code').value,'text/html');
  const items=document.querySelectorAll('#reqs li'); let pass=0;
  step.reqs.forEach((r,idx)=>{
    let ok=false; try{ ok=!!r.test(doc); }catch(e){}
    const li=items[idx]; li.classList.remove('pass','fail'); li.classList.add(ok?'pass':'fail');
    li.querySelector('.mark').textContent=ok?'✓':'✗'; if(ok) pass++;
  });
  const fb=document.getElementById('feedback');
  if(pass===step.reqs.length){
    if(!state.done[i]){ state.xp+=20; } state.done[i]=true;
    fb.className='feedback success show';
    fb.textContent = step.challenge ? '🎉 Challenge passed — every box is green. Brilliant!' : '🎉 Correct! All the boxes are green. Press Next to carry on.';
  } else {
    state.done[i]=false;
    fb.className='feedback error show';
    fb.textContent=`Almost! ${pass} of ${step.reqs.length} done. Fix the red ✗ items above, then Check again.`;
  }
  saveState(); renderMenu(); setProgress();
}
function markTaskPass(){
  const i=state.idx, step=STEPS[i];
  const doc=new DOMParser().parseFromString(document.getElementById('code').value,'text/html');
  const items=document.querySelectorAll('#reqs li');
  step.reqs.forEach((r,idx)=>{ let ok=false; try{ok=!!r.test(doc);}catch(e){} items[idx].classList.add(ok?'pass':'fail'); items[idx].querySelector('.mark').textContent=ok?'✓':'✗'; });
  const fb=document.getElementById('feedback'); fb.className='feedback success show'; fb.textContent='✅ Already completed — nice one! You can keep editing or press Next.';
}
function showHint(){ const fb=document.getElementById('feedback'); fb.className='feedback hint show'; fb.textContent='💡 '+(STEPS[state.idx].hint||'Read the example again and copy the pattern.'); }
function resetTask(){ const i=state.idx; delete state.codes[i]; state.done[i]=false; document.getElementById('code').value=STEPS[i].starter||''; runPreview(); saveState(); render(); }

/* ---------- REFLECT ---------- */
function viewReflect(){
  const r=state.reflection;
  return `<section class="card">
    <div class="field"><label>1. What is one thing you learned today?</label><textarea id="r1" placeholder="e.g. Every tag needs a closing buddy...">${esc(r.r1)}</textarea></div>
    <div class="field"><label>2. What did you find tricky, and how did you get past it?</label><textarea id="r2">${esc(r.r2)}</textarea></div>
    <div class="field"><label>3. What are you most proud of?</label><textarea id="r3">${esc(r.r3)}</textarea></div>
    <div class="field"><label>4. What would you add if you had more time?</label><textarea id="r4">${esc(r.r4)}</textarea></div>
    <div class="field"><label>5. How confident do you feel writing HTML now?</label>
      <div class="stars" id="stars">${[1,2,3,4,5].map(v=>`<span data-v="${v}">${v<=state.confidence?'★':'☆'}</span>`).join('')}</div></div>
  </section>
  <div class="btnrow"><button class="btn soft" onclick="prevStep()">← Back</button><button class="btn next-cta" onclick="nextStep()">Next → Submit</button></div>`;
}
function initReflect(){
  ['r1','r2','r3','r4'].forEach(id=>{ const e=document.getElementById(id); e.addEventListener('input',()=>{ state.reflection[id]=e.value; saveState(); }); });
  document.querySelectorAll('#stars span').forEach(s=>{ s.onclick=()=>{ state.confidence=+s.dataset.v; saveState(); document.querySelectorAll('#stars span').forEach(x=>x.textContent=(+x.dataset.v<=state.confidence)?'★':'☆'); }; });
}

/* ---------- FINISH ---------- */
function viewFinish(){
  return `<div class="completion"><div class="completion-card">
    <div style="font-size:72px">🏆</div>
    <h2>Great work${state.name?', '+esc(state.name):''}!</h2>
    <p class="task-text" style="margin:6px 0 0">You've finished Day 1 of HTML Lab.</p>
    <div class="bigscore">${gradableDone()} / ${GRADABLE.size}</div>
    <p class="teach" style="margin:0 0 18px">steps completed</p>
    <div class="btnrow" style="justify-content:center">
      <button class="btn primary" onclick="downloadSubmission()">⬇️ Download my submission</button>
      <button class="btn soft" onclick="copySubmission()">⧉ Copy as text</button>
      <button class="btn good" onclick="go(0)">↺ Review course</button>
    </div>
    <div class="feedback hint" id="subMsg" style="margin-top:18px"></div>
    <p style="font-size:13px;color:var(--muted);margin:16px 0 0">Send the downloaded file to your teacher however they ask. 💾 Your work is saved in this browser automatically.</p>
    <button class="ghostlink" style="margin-top:10px" onclick="clearAll()">Sharing this computer? Clear all my work</button>
  </div></div>`;
}
function initFinish(){ state.done[state.idx]=true; }
function buildSubmission(){
  const boss = state.codes[11] || '(Boss Challenge not attempted yet)';
  const r=state.reflection;
  const ref = id => (r[id]||'').trim()||'(left blank)';
  return `HTML LAB — DAY 1 · STUDENT SUBMISSION
=========================================
Name:  ${state.name||'(no name)'}
Class: ${state.cls||'(no class)'}
Date:  ${new Date().toLocaleString()}

--- PROGRESS ---
Steps completed:   ${gradableDone()} / ${GRADABLE.size}
Total XP:          ${state.xp}
Tag quiz score:    ${quizCorrect()} / ${WQUIZ.length}
Build tasks done:  ${[3,4,5,6,7,8].filter(i=>state.done[i]).length} / 6
Challenges passed: ${[9,10,11].filter(i=>state.done[i]).length} / 3

--- REFLECTION ---
1. Learned:        ${ref('r1')}
2. Tricky/fixed:   ${ref('r2')}
3. Proud of:       ${ref('r3')}
4. Would add:      ${ref('r4')}
5. Confidence:     ${state.confidence? state.confidence+' / 5':'not rated'}

--- MY FINAL PAGE (Boss Challenge code) ---
${boss}
=========================================`;
}
function downloadSubmission(){
  const safe=(state.name||'student').replace(/[^a-z0-9]+/gi,'_');
  const blob=new Blob([buildSubmission()],{type:'text/plain'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`HTML_Lab_${safe}.txt`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
  const m=document.getElementById('subMsg'); m.className='feedback success show'; m.textContent='✅ Downloaded! Check your Downloads folder, then send it to your teacher.';
}
function copySubmission(){
  navigator.clipboard.writeText(buildSubmission()).then(
    ()=>{ const m=document.getElementById('subMsg'); m.className='feedback success show'; m.textContent='✅ Copied! Paste it where your teacher asked.'; },
    ()=>{ const m=document.getElementById('subMsg'); m.className='feedback error show'; m.textContent='Copy not available here — use the Download button instead.'; }
  );
}
function clearAll(){ if(confirm('Clear ALL saved work on this computer and start fresh?')){ try{localStorage.removeItem(STORE_KEY);}catch(e){} location.reload(); } }

/* ---------- BOTTOM COURSE MENU ---------- */
function renderMenu(){
  const menu=document.getElementById('menu');
  let html='', sec='';
  STEPS.forEach((s,i)=>{
    if(s.section!==sec){ sec=s.section; html+=`<div class="cm-section">${esc(sec)}</div><div class="cm-row">`; }
    const cls=['chip', i===state.idx?'active':'', state.done[i]?'done':''].join(' ');
    const mark = state.done[i]?'✓':(i+1);
    html+=`<div class="${cls}" onclick="go(${i})"><span class="cnum">${mark}</span><span>${esc(s.title)}</span></div>`;
    // close row at section boundaries
    const next=STEPS[i+1];
    if(!next || next.section!==sec) html+='</div>';
  });
  menu.innerHTML=html;
}

/* ---------- save name/class (delegated) ---------- */
document.addEventListener('input', e=>{
  if(e.target && e.target.id==='stuName'){ state.name=e.target.value; saveState(); }
  if(e.target && e.target.id==='stuClass'){ state.cls=e.target.value; saveState(); }
});

/* ===================== BOOT ===================== */
loadState();
render();
</script>
</body>
</html>
