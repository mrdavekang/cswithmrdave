<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Y7 Python Unit 2 Course - Variables, Input and Output</title>
<style>
  :root {
    --bg: #f7f8fc;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #dbe3ef;
    --blue: #2563eb;
    --blue2: #dbeafe;
    --green: #15803d;
    --green2: #dcfce7;
    --red: #b91c1c;
    --red2: #fee2e2;
    --yellow: #facc15;
    --code: #101827;
    --codeText: #f8fafc;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Aptos", "Segoe UI", system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at top left, #fff 0, #f8fafc 45%, #eef4ff 100%);
    color: var(--ink);
  }
  button, textarea { font: inherit; }
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: rgba(255,255,255,0.95);
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding: 14px 24px; backdrop-filter: blur(12px);
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 280px; }
  .logo { width: 44px; height: 44px; display: grid; place-items: center; border: 2px solid var(--ink); border-radius: 14px; background: #fff; font-size: 24px; }
  .brand h1 { margin: 0; font-size: 20px; line-height: 1.05; font-weight: 900; letter-spacing: -0.02em; }
  .brand p { margin: 2px 0 0; font-size: 12px; color: var(--muted); font-weight: 700; }
  .progress-area { display: flex; align-items: center; gap: 12px; flex: 1; justify-content: flex-end; }
  .pill { border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; background: var(--paper); color: var(--muted); font-weight: 800; font-size: 13px; white-space: nowrap; }
  .bar { width: min(280px, 25vw); height: 13px; background: #e8eef8; border-radius: 999px; overflow: hidden; border: 1px solid #d5e0ef; }
  .fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--blue), var(--green)); transition: width .25s ease; }
  .layout { display: grid; grid-template-columns: 292px 1fr; min-height: calc(100vh - 73px); }
  .sidebar { background: rgba(255,255,255,0.86); border-right: 1px solid var(--line); padding: 20px 12px; overflow-y: auto; }
  .side-title { font-weight: 1000; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; margin: 0 10px 12px; }
  .topic { margin: 18px 10px 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .12em; font-weight: 1000; color: var(--blue); }
  .navitem {
    display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 8px;
    border: 1px solid transparent; padding: 9px 9px; margin: 3px 0; border-radius: 14px; cursor: pointer;
    color: #334155; font-size: 13px;
  }
  .navitem:hover { background: #f1f5f9; }
  .navitem.active { background: #eff6ff; border-color: #bfdbfe; color: #111827; font-weight: 900; }
  .num { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 9px; background: #f1f5f9; font-weight: 1000; font-size: 12px; }
  .navitem.done .num { background: var(--green2); color: var(--green); }
  .navitem.wrong .num { background: var(--red2); color: var(--red); }
  .status { font-size: 13px; }
  .main { padding: 30px; overflow-y: auto; }
  .hero {
    background: var(--paper); border: 2px solid #111827; border-radius: 28px;
    box-shadow: 0 12px 0 #111827; padding: 28px; margin-bottom: 28px;
    display: grid; grid-template-columns: 1fr auto; gap: 22px; align-items: start;
  }
  .kicker { display: inline-block; background: var(--yellow); color: var(--ink); border: 2px solid var(--ink); border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 1000; text-transform: uppercase; letter-spacing: .08em; }
  .hero h2 { margin: 14px 0 10px; font-size: clamp(34px, 5vw, 70px); line-height: .95; letter-spacing: -0.04em; font-weight: 1000; }
  .hero .skill { font-size: 20px; line-height: 1.35; font-weight: 850; color: #263244; max-width: 900px; }
  .hero-icon { width: 130px; height: 130px; border: 2px solid #111827; border-radius: 30px; display: grid; place-items: center; font-size: 64px; background: #f8fafc; }
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 24px; padding: 24px; margin-bottom: 18px; }
  .task-title { margin: 0 0 10px; font-size: 26px; font-weight: 1000; }
  .task-text { margin: 0; color: #263244; font-size: 19px; line-height: 1.5; }
  code { background: #f1f5f9; border: 1px solid #dbe3ef; border-radius: 8px; padding: 2px 6px; font-family: "Cascadia Code", Consolas, monospace; font-size: .92em; color: #9a3412; }
  .grid { display: grid; grid-template-columns: minmax(0,1.08fr) minmax(320px,.92fr); gap: 18px; }
  .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 24px; overflow: hidden; }
  .panel-head { height: 48px; background: #f8fafc; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; padding: 0 16px; color: var(--muted); font-weight: 900; }
  .dot { width: 14px; height: 14px; border-radius: 50%; } .r { background:#ef4444; } .y { background:#f59e0b; } .g { background:#22c55e; }
  .filename { margin-left: 8px; }
  textarea { width: 100%; border: 0; outline: none; resize: vertical; }
  .editor { min-height: 300px; background: var(--code); color: var(--codeText); padding: 20px; font-family: "Cascadia Code", Consolas, monospace; font-size: 18px; line-height: 1.65; tab-size: 4; }
  .runner-body { padding: 18px; }
  .input-label { display: block; font-size: 13px; color: var(--muted); font-weight: 1000; text-transform: uppercase; letter-spacing: .08em; margin: 0 0 8px; }
  .stdin { min-height: 78px; border: 1px solid var(--line); border-radius: 14px; padding: 14px; font-family: "Cascadia Code", Consolas, monospace; font-size: 15px; line-height: 1.5; background: #f8fafc; color: #111827; margin-bottom: 14px; }
  .console { min-height: 204px; background: #0b1220; color: #e2e8f0; border-radius: 16px; padding: 16px; overflow: auto; white-space: pre-wrap; font-family: "Cascadia Code", Consolas, monospace; font-size: 15px; line-height: 1.5; border: 1px solid #1e293b; }
  .console.muted { color: #94a3b8; }
  .btnrow { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; align-items: center; }
  .btn { border: 2px solid var(--ink); border-radius: 14px; padding: 11px 16px; font-weight: 1000; cursor: pointer; background: #fff; box-shadow: 0 4px 0 var(--ink); transform: translateY(0); transition: .12s ease; }
  .btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 5px 0 var(--ink); }
  .btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .btn:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
  .primary { background: var(--blue); color: #fff; }
  .good { background: var(--green); color: #fff; }
  .soft { background: #f8fafc; color: #334155; }
  .feedback { display: none; border-radius: 18px; padding: 16px 18px; margin-top: 18px; font-size: 17px; line-height: 1.45; font-weight: 800; white-space: pre-wrap; }
  .feedback.show { display: block; }
  .feedback.success { background: var(--green2); border: 2px solid var(--green); color: #14532d; }
  .feedback.error { background: var(--red2); border: 2px solid var(--red); color: #7f1d1d; }
  .feedback.hint { background: var(--blue2); border: 2px solid var(--blue); color: #1e3a8a; }
  .expected { background: #f8fafc; border: 1px dashed #94a3b8; border-radius: 18px; padding: 16px; margin-top: 12px; }
  .expected h4 { margin: 0 0 8px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .expected pre { margin: 0; white-space: pre-wrap; font-family: "Cascadia Code", Consolas, monospace; color: #166534; font-size: 15px; line-height: 1.5; }
  .completion { min-height: 70vh; display: grid; place-items: center; text-align: center; }
  .completion-card { max-width: 820px; background: #fff; border: 2px solid #111827; box-shadow: 0 12px 0 #111827; border-radius: 32px; padding: 44px; }
  .completion-card h2 { font-size: 58px; margin: 0 0 12px; line-height: .95; }
  .bigscore { font-size: 72px; font-weight: 1000; color: var(--blue); margin: 20px 0; }
  @media (max-width: 980px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .grid { grid-template-columns: 1fr; }
    .hero { grid-template-columns: 1fr; }
    .hero-icon { display: none; }
    .topbar { align-items: flex-start; flex-direction: column; }
    .progress-area { width: 100%; justify-content: flex-start; }
    .bar { width: 100%; }
  }
</style>
</head>

  <header class="topbar">
    <div class="brand"><div class="logo">🐍</div><div><h1>Y7 Python Unit 2</h1><p>Variables • Input • Output</p></div></div>
    <div class="progress-area">
      <span class="pill" id="scorePill">Score: 0 / 20</span>
      <div class="bar"><div class="fill" id="progressFill"></div></div>
      <span class="pill" id="progressPill">0 / 20 complete</span>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main"></main>

<script>
const EXERCISES = [{"id": 1, "topic": "Variables", "title": "Store a name", "skill": "Create a variable and print it.", "task": "Create a variable called <code>name</code> that stores <code>\"Ava\"</code>. Then print the variable.", "starter": "# Question 1\n# Create the variable, then print it\n\n", "hint": "Use: name = \"Ava\" then print(name).", "runCases": [{"inputs": [], "expected": "Ava"}], "requirements": [{"type": "pattern", "pattern": "\\bname\\s*=\\s*[\\\"']Ava[\\\"']", "msg": "Create a variable called name that stores \"Ava\"."}, {"type": "pattern", "pattern": "\\bprint\\s*\\(\\s*name\\s*\\)", "msg": "Print the variable name, not the word in quotes."}]}, {"id": 2, "topic": "Variables", "title": "Store a subject", "skill": "Create a text variable and print it.", "task": "Create a variable called <code>subject</code> that stores <code>\"Computing\"</code>. Then print the variable <code>subject</code>.", "starter": "# Question 2\n# Store a subject, then print it\n\n", "hint": "Use: subject = \"Computing\" then print(subject).", "runCases": [{"inputs": [], "expected": "Computing"}], "requirements": [{"type": "pattern", "pattern": "\\bsubject\\s*=\\s*[\\\"']Computing[\\\"']", "msg": "Create a variable called subject that stores \"Computing\"."}, {"type": "pattern", "pattern": "\\bprint\\s*\\(\\s*subject\\s*\\)", "msg": "Print the variable subject."}]}, {"id": 3, "topic": "Variables", "title": "Fix the quotes", "skill": "Use quotes for strings.", "task": "Store the text <code>\"Tenby\"</code> in a variable called <code>school</code>. Then print it.", "starter": "# Question 3\n# Text needs quotation marks\n\n", "hint": "Text values need quotes, like this: school = \"Tenby\".", "runCases": [{"inputs": [], "expected": "Tenby"}], "requirements": [{"type": "pattern", "pattern": "\\bschool\\s*=\\s*[\\\"']Tenby[\\\"']", "msg": "Store \"Tenby\" as text using quotation marks."}, {"type": "pattern", "pattern": "\\bprint\\s*\\(\\s*school\\s*\\)", "msg": "Print the variable school."}]}, {"id": 4, "topic": "Variables", "title": "Store a number", "skill": "Store and print a number.", "task": "Create a variable called <code>score</code> that stores the number <code>10</code>. Then print it.", "starter": "# Question 4\n# Numbers do not need quotation marks\n\n", "hint": "Use score = 10. Numbers do not need quotes.", "runCases": [{"inputs": [], "expected": "10"}], "requirements": [{"type": "pattern", "pattern": "\\bscore\\s*=\\s*10\\b", "msg": "Create score = 10 without quotation marks."}, {"type": "pattern", "pattern": "\\bprint\\s*\\(\\s*score\\s*\\)", "msg": "Print the variable score."}]}, {"id": 5, "topic": "Variables", "title": "Change a variable", "skill": "Understand reassignment.", "task": "Create <code>level = \"Beginner\"</code>. Then change <code>level</code> to <code>\"Improving\"</code>. Print <code>level</code> at the end.", "starter": "# Question 5\n# A variable can be changed\n\n", "hint": "Assign level twice. Python uses the newest value.", "runCases": [{"inputs": [], "expected": "Improving"}], "requirements": [{"type": "countPattern", "pattern": "\\blevel\\s*=", "min": 2, "msg": "Assign a value to level twice."}, {"type": "pattern", "pattern": "\\blevel\\s*=\\s*[\\\"']Improving[\\\"']", "msg": "Change level to \"Improving\"."}, {"type": "pattern", "pattern": "\\bprint\\s*\\(\\s*level\\s*\\)", "msg": "Print level at the end."}]}, {"id": 6, "topic": "Output", "title": "Say hello with a variable", "skill": "Print text and a variable together.", "task": "Create <code>name = \"Zara\"</code>. Then print <code>Hello Zara</code> using a comma and the variable.", "starter": "# Question 6\n# Print text and a variable together\n\n", "hint": "Use print(\"Hello\", name).", "runCases": [{"inputs": [], "expected": "Hello Zara"}], "requirements": [{"type": "pattern", "pattern": "\\bname\\s*=\\s*[\\\"']Zara[\\\"']", "msg": "Create name = \"Zara\"."}, {"type": "pattern", "pattern": "\\bprint\\s*\\(\\s*[\\\"']Hello[\\\"']\\s*,\\s*name\\s*\\)", "msg": "Use a comma to print the text and the variable."}]}, {"id": 7, "topic": "Output", "title": "Print two variables", "skill": "Print more than one variable.", "task": "Create <code>first_name = \"Ali\"</code> and <code>form = \"7N\"</code>. Print them on the same line.", "starter": "# Question 7\n# Print two variables on the same line\n\n", "hint": "Use print(first_name, form).", "runCases": [{"inputs": [], "expected": "Ali 7N"}], "requirements": [{"type": "pattern", "pattern": "\\bfirst_name\\s*=\\s*[\\\"']Ali[\\\"']", "msg": "Create first_name = \"Ali\"."}, {"type": "pattern", "pattern": "\\bform\\s*=\\s*[\\\"']7N[\\\"']", "msg": "Create form = \"7N\"."}, {"type": "pattern", "pattern": "\\bprint\\s*\\(\\s*first_name\\s*,\\s*form\\s*\\)", "msg": "Print first_name and form together."}]}, {"id": 8, "topic": "Input", "title": "Ask for a name", "skill": "Use input() and store the answer.", "task": "Ask <code>What is your name? </code> and store it in <code>name</code>. Then print <code>Hello</code> followed by the name.", "starter": "# Question 8\n# Ask for the user's name\n\n", "hint": "Use name = input(\"What is your name? \") then print(\"Hello\", name).", "runCases": [{"inputs": ["Maya"], "expected": "What is your name? Maya\nHello Maya"}], "requirements": [{"type": "pattern", "pattern": "\\bname\\s*=\\s*input\\s*\\(\\s*[\\\"']What is your name\\?\\s*[\\\"']\\s*\\)", "msg": "Use the exact prompt: input(\"What is your name? \" )."}, {"type": "pattern", "pattern": "\\bprint\\s*\\(\\s*[\\\"']Hello[\\\"']\\s*,\\s*name\\s*\\)", "msg": "Print Hello followed by the variable name."}]}, {"id": 9, "topic": "Input", "title": "Favourite colour", "skill": "Use input() in a sentence.", "task": "Ask <code>What is your favourite colour? </code> and store it in <code>colour</code>. Print <code>Your favourite colour is blue</code> when the input is blue.", "starter": "# Question 9\n# Ask for a favourite colour\n\n", "hint": "Use colour = input(...), then print(\"Your favourite colour is\", colour).", "runCases": [{"inputs": ["blue"], "expected": "What is your favourite colour? blue\nYour favourite colour is blue"}], "requirements": [{"type": "pattern", "pattern": "\\bcolour\\s*=\\s*input\\s*\\(\\s*[\\\"']What is your favourite colour\\?\\s*[\\\"']\\s*\\)", "msg": "Store the input in a variable called colour."}, {"type": "pattern", "pattern": "\\bprint\\s*\\(\\s*[\\\"']Your favourite colour is[\\\"']\\s*,\\s*colour\\s*\\)", "msg": "Print the message followed by the colour variable."}]}, {"id": 10, "topic": "Input", "title": "Favourite hobby", "skill": "Store input and reuse it.", "task": "Ask <code>What is your hobby? </code> and store it in <code>hobby</code>. Then print <code>Cool! You like drawing</code> when the input is drawing.", "starter": "# Question 10\n# Ask for a hobby\n\n", "hint": "Use print(\"Cool! You like\", hobby).", "runCases": [{"inputs": ["drawing"], "expected": "What is your hobby? drawing\nCool! You like drawing"}], "requirements": [{"type": "pattern", "pattern": "\\bhobby\\s*=\\s*input\\s*\\(\\s*[\\\"']What is your hobby\\?\\s*[\\\"']\\s*\\)", "msg": "Store the answer in hobby."}, {"type": "pattern", "pattern": "\\bprint\\s*\\(\\s*[\\\"']Cool! You like[\\\"']\\s*,\\s*hobby\\s*\\)", "msg": "Print the sentence using the hobby variable."}]}, {"id": 11, "topic": "Input", "title": "Two questions", "skill": "Use two inputs.", "task": "Ask for a name and favourite food. Use these exact prompts: <code>Enter your name: </code> and <code>Enter your favourite food: </code>. Print <code>Ben likes pizza</code> when the inputs are Ben and pizza.", "starter": "# Question 11\n# Ask two questions\n\n", "hint": "You need two variables, then print(name, \"likes\", food).", "runCases": [{"inputs": ["Ben", "pizza"], "expected": "Enter your name: Ben\nEnter your favourite food: pizza\nBen likes pizza"}], "requirements": [{"type": "pattern", "pattern": "\\bname\\s*=\\s*input\\s*\\(\\s*[\\\"']Enter your name:\\s*[\\\"']\\s*\\)", "msg": "Ask for the name using the exact prompt."}, {"type": "pattern", "pattern": "\\bfood\\s*=\\s*input\\s*\\(\\s*[\\\"']Enter your favourite food:\\s*[\\\"']\\s*\\)", "msg": "Ask for the food using the exact prompt."}, {"type": "pattern", "pattern": "\\bprint\\s*\\(\\s*name\\s*,\\s*[\\\"']likes[\\\"']\\s*,\\s*food\\s*\\)", "msg": "Print name, \"likes\", food."}]}, {"id": 12, "topic": "Comments", "title": "Add a comment", "skill": "Use comments to explain code.", "task": "Add at least one comment using <code>#</code>. Then create <code>school = \"TTA\"</code> and print it.", "starter": "# Question 12\n# Add your own comment below\n\n", "hint": "A comment starts with #. Example: # This stores my school name", "runCases": [{"inputs": [], "expected": "TTA"}], "requirements": [{"type": "comment", "msg": "Add at least one comment using #."}, {"type": "pattern", "pattern": "\\bschool\\s*=\\s*[\\\"']TTA[\\\"']", "msg": "Create school = \"TTA\"."}, {"type": "pattern", "pattern": "\\bprint\\s*\\(\\s*school\\s*\\)", "msg": "Print the variable school."}]}, {"id": 13, "topic": "Comments", "title": "Comment out one line", "skill": "Use # to stop one line from running.", "task": "Use <code>#</code> to stop the first print line from running. The output should only show <code>This should appear</code>.", "starter": "# Question 13\n# Put # before the first print line below\nprint(\"This should not appear\")\nprint(\"This should appear\")\n", "hint": "Put # at the start of the line you do not want Python to run. #print(...) is accepted.", "runCases": [{"inputs": [], "expected": "This should appear"}], "requirements": [{"type": "lineCommentContains", "text": "This should not appear", "msg": "Use # to comment out the first print line."}, {"type": "pattern", "pattern": "\\bprint\\s*\\(\\s*[\\\"']This should appear[\\\"']\\s*\\)", "msg": "Keep the second print line running."}]}, {"id": 14, "topic": "Debugging", "title": "Fix the variable name", "skill": "Use the same variable name correctly.", "task": "Fix the code so it prints <code>Mia</code>. The variable name must match exactly.", "starter": "# Question 14\n# Fix the variable name error\nstudent_name = \"Mia\"\nprint(studentname)\n", "hint": "The variable is called student_name, not studentname.", "runCases": [{"inputs": [], "expected": "Mia"}], "requirements": [{"type": "pattern", "pattern": "\\bstudent_name\\s*=\\s*[\\\"']Mia[\\\"']", "msg": "Keep the variable student_name = \"Mia\"."}, {"type": "pattern", "pattern": "\\bprint\\s*\\(\\s*student_name\\s*\\)", "msg": "Print student_name with the underscore."}]}, {"id": 15, "topic": "Variables", "title": "Points update", "skill": "Update a variable value.", "task": "Create <code>points = 0</code>, then change it to <code>5</code>. Print <code>Points: 5</code> using a comma and the variable.", "starter": "# Question 15\n# Update the points variable\n\n", "hint": "Use points = 0, then points = 5, then print(\"Points:\", points).", "runCases": [{"inputs": [], "expected": "Points: 5"}], "requirements": [{"type": "countPattern", "pattern": "\\bpoints\\s*=", "min": 2, "msg": "Assign points twice."}, {"type": "pattern", "pattern": "\\bpoints\\s*=\\s*5\\b", "msg": "Change points to 5."}, {"type": "pattern", "pattern": "\\bprint\\s*\\(\\s*[\\\"']Points:[\\\"']\\s*,\\s*points\\s*\\)", "msg": "Print \"Points:\" followed by points."}]}, {"id": 16, "topic": "Input", "title": "Choose an animal", "skill": "Input with a prompt.", "task": "Ask <code>Choose an animal: </code> and store it in <code>animal</code>. Print <code>You chose dog</code> when the input is dog.", "starter": "# Question 16\n# Ask the user to choose an animal\n\n", "hint": "Use animal = input(\"Choose an animal: \"), then print(\"You chose\", animal).", "runCases": [{"inputs": ["dog"], "expected": "Choose an animal: dog\nYou chose dog"}], "requirements": [{"type": "pattern", "pattern": "\\banimal\\s*=\\s*input\\s*\\(\\s*[\\\"']Choose an animal:\\s*[\\\"']\\s*\\)", "msg": "Store the input in animal."}, {"type": "pattern", "pattern": "\\bprint\\s*\\(\\s*[\\\"']You chose[\\\"']\\s*,\\s*animal\\s*\\)", "msg": "Print the message using animal."}]}, {"id": 17, "topic": "Input", "title": "Digital name badge", "skill": "Use two inputs and labelled output.", "task": "Ask <code>Enter name: </code> and <code>Enter form: </code>. Store them in <code>name</code> and <code>form</code>. Print two labelled lines: <code>Name: Jay</code> and <code>Form: 7A</code>.", "starter": "# Question 17\n# Create a digital name badge\n\n", "hint": "Use two input lines with Enter name: and Enter form:, then two print lines.", "runCases": [{"inputs": ["Jay", "7A"], "expected": "Enter name: Jay\nEnter form: 7A\nName: Jay\nForm: 7A"}], "requirements": [{"type": "pattern", "pattern": "\\bname\\s*=\\s*input\\s*\\(\\s*[\\\"']Enter name:\\s*[\\\"']\\s*\\)", "msg": "Ask for Enter name: and store it in name."}, {"type": "pattern", "pattern": "\\bform\\s*=\\s*input\\s*\\(\\s*[\\\"']Enter form:\\s*[\\\"']\\s*\\)", "msg": "Ask for Enter form: and store it in form."}, {"type": "pattern", "pattern": "\\bprint\\s*\\(\\s*[\\\"']Name:[\\\"']\\s*,\\s*name\\s*\\)", "msg": "Print Name: followed by name."}, {"type": "pattern", "pattern": "\\bprint\\s*\\(\\s*[\\\"']Form:[\\\"']\\s*,\\s*form\\s*\\)", "msg": "Print Form: followed by form."}]}, {"id": 18, "topic": "Output", "title": "Profile labels", "skill": "Print clear labelled output.", "task": "Create <code>name = \"Lina\"</code> and <code>subject = \"Computing\"</code>. Print <code>Student: Lina</code> and <code>Subject: Computing</code> on separate lines.", "starter": "# Question 18\n# Print a simple profile\n\n", "hint": "Use print(\"Student:\", name) and print(\"Subject:\", subject).", "runCases": [{"inputs": [], "expected": "Student: Lina\nSubject: Computing"}], "requirements": [{"type": "pattern", "pattern": "\\bname\\s*=\\s*[\\\"']Lina[\\\"']", "msg": "Create name = \"Lina\"."}, {"type": "pattern", "pattern": "\\bsubject\\s*=\\s*[\\\"']Computing[\\\"']", "msg": "Create subject = \"Computing\"."}, {"type": "pattern", "pattern": "\\bprint\\s*\\(\\s*[\\\"']Student:[\\\"']\\s*,\\s*name\\s*\\)", "msg": "Print Student: followed by name."}, {"type": "pattern", "pattern": "\\bprint\\s*\\(\\s*[\\\"']Subject:[\\\"']\\s*,\\s*subject\\s*\\)", "msg": "Print Subject: followed by subject."}]}, {"id": 19, "topic": "Challenge", "title": "My introduction", "skill": "Combine input, variables and output.", "task": "Ask <code>What is your name? </code> and <code>What is your age? </code>. Store them in <code>name</code> and <code>age</code>. Print <code>My name is Kai</code> and <code>I am 12 years old</code> when the inputs are Kai and 12.", "starter": "# Question 19\n# Build a short introduction\n\n", "hint": "You do not need int() yet. The age can stay as text.", "runCases": [{"inputs": ["Kai", "12"], "expected": "What is your name? Kai\nWhat is your age? 12\nMy name is Kai\nI am 12 years old"}], "requirements": [{"type": "pattern", "pattern": "\\bname\\s*=\\s*input\\s*\\(\\s*[\\\"']What is your name\\?\\s*[\\\"']\\s*\\)", "msg": "Ask for the name and store it in name."}, {"type": "pattern", "pattern": "\\bage\\s*=\\s*input\\s*\\(\\s*[\\\"']What is your age\\?\\s*[\\\"']\\s*\\)", "msg": "Ask for the age and store it in age."}, {"type": "pattern", "pattern": "\\bprint\\s*\\(\\s*[\\\"']My name is[\\\"']\\s*,\\s*name\\s*\\)", "msg": "Print My name is followed by name."}, {"type": "pattern", "pattern": "\\bprint\\s*\\(\\s*[\\\"']I am[\\\"']\\s*,\\s*age\\s*,\\s*[\\\"']years old[\\\"']\\s*\\)", "msg": "Print I am, age, years old."}]}, {"id": 20, "topic": "Extension", "title": "Personal profile program", "skill": "Create a complete input/output program.", "task": "Create a profile program. Ask for <code>Enter name: </code>, <code>Enter favourite subject: </code>, and <code>Enter learning goal: </code>. Print the profile exactly like the expected output.", "starter": "# Question 20 Extension\n# Create a personal profile program\n\n", "hint": "Use three input lines with Enter prompts, then four print lines. Remember commas when printing labels and variables.", "runCases": [{"inputs": ["Kai", "Computing", "learn Python"], "expected": "Enter name: Kai\nEnter favourite subject: Computing\nEnter learning goal: learn Python\n--- Profile ---\nName: Kai\nFavourite subject: Computing\nGoal: learn Python"}], "requirements": [{"type": "pattern", "pattern": "\\bname\\s*=\\s*input\\s*\\(\\s*[\\\"']Enter name:\\s*[\\\"']\\s*\\)", "msg": "Ask for Enter name: and store it in name."}, {"type": "pattern", "pattern": "\\bfavourite_subject\\s*=\\s*input\\s*\\(\\s*[\\\"']Enter favourite subject:\\s*[\\\"']\\s*\\)", "msg": "Ask for Enter favourite subject: and store it in favourite_subject."}, {"type": "pattern", "pattern": "\\bgoal\\s*=\\s*input\\s*\\(\\s*[\\\"']Enter learning goal:\\s*[\\\"']\\s*\\)", "msg": "Ask for Enter learning goal: and store it in goal."}, {"type": "pattern", "pattern": "\\bprint\\s*\\(\\s*[\\\"']--- Profile ---[\\\"']\\s*\\)", "msg": "Print the heading --- Profile ---."}, {"type": "pattern", "pattern": "\\bprint\\s*\\(\\s*[\\\"']Name:[\\\"']\\s*,\\s*name\\s*\\)", "msg": "Print Name: followed by name."}, {"type": "pattern", "pattern": "\\bprint\\s*\\(\\s*[\\\"']Favourite subject:[\\\"']\\s*,\\s*favourite_subject\\s*\\)", "msg": "Print Favourite subject: followed by favourite_subject."}, {"type": "pattern", "pattern": "\\bprint\\s*\\(\\s*[\\\"']Goal:[\\\"']\\s*,\\s*goal\\s*\\)", "msg": "Print Goal: followed by goal."}]}];
const STORAGE_KEY = 'y7-python-unit2-course-v1';
const PYODIDE_BASE_URL = 'https://cdn.jsdelivr.net/pyodide/v0.25.1/full/';
const PYTHON_RUNNER_WRAPPER = String.raw`
import builtins, js, sys, traceback

def __browser_input(prompt=""):
    return js.pyInput(str(prompt))

class __BrowserWriter:
    def write(self, data):
        if data is not None and data != "":
            js.pyWrite(str(data))
    def flush(self):
        pass

builtins.input = __browser_input
sys.stdout = __BrowserWriter()
sys.stderr = __BrowserWriter()

    js.pyMarkError()

`;

let state = loadState();
let currentIndex = state.currentIndex || 0;
let pyodidePromise = null;
let pyodideReady = false;
let pyodideLoading = false;
let runnerBusy = false;
let runtimeError = '';
let activeSession = null;

function defaultState() {
  const work = {};
  EXERCISES.forEach(ex => {
    work[ex.id] = {
      code: ex.starter || '',
      stdin: getDefaultInput(ex),
      console: ''
    };
  });
  return { currentIndex: 0, completed: {}, work };
}
function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    const fresh = defaultState();
    if (!saved || typeof saved !== 'object') return fresh;
    EXERCISES.forEach(ex => {
      if (!saved.work) saved.work = {};
      if (!saved.work[ex.id]) saved.work[ex.id] = fresh.work[ex.id];
      if (typeof saved.work[ex.id].code !== 'string') saved.work[ex.id].code = ex.starter || '';
      if (typeof saved.work[ex.id].stdin !== 'string') saved.work[ex.id].stdin = getDefaultInput(ex);
      if (typeof saved.work[ex.id].console !== 'string') saved.work[ex.id].console = '';
    });
    if (!saved.completed) saved.completed = {};
    return saved;
  } catch (e) { return defaultState(); }
}
function saveState() {
  state.currentIndex = currentIndex;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}
function getDefaultInput(ex) {
  const c = ex.runCases && ex.runCases[0];
  return c && c.inputs ? c.inputs.join('\n') : '';
}
function work(ex) { return state.work[ex.id]; }

function renderSidebar() {
  const sb = document.getElementById('sidebar');
  let html = '<p class="side-title">Course Questions</p>';
  let topic = '';
  EXERCISES.forEach((ex, i) => {
    if (ex.topic !== topic) { topic = ex.topic; html += `<div class="topic">${escapeHTML(topic)}</div>`; }
    const status = state.completed[ex.id];
    const cls = ['navitem', i === currentIndex ? 'active' : '', status === true ? 'done' : status === false ? 'wrong' : ''].join(' ');
    const mark = status === true ? '✓' : status === false ? '!' : '';
    html += `<div class="${cls}" onclick="goTo(${i})"><span class="num">${ex.id}</span><span>${escapeHTML(ex.title)}</span><span class="status">${mark}</span></div>`;
  });
  sb.innerHTML = html;
}

function renderExercise() {
  const ex = EXERCISES[currentIndex];
  const w = work(ex);
  const firstCase = ex.runCases && ex.runCases[0];
  const expected = firstCase ? firstCase.expected : '';
  const main = document.getElementById('main');
  main.innerHTML = `
    <section class="hero">
      <div>
        <span class="kicker">Question ${ex.id} of ${EXERCISES.length} • ${escapeHTML(ex.topic)}</span>
        <h2>${escapeHTML(ex.title)}</h2>
        <div class="skill">${escapeHTML(ex.skill)}</div>
      </div>
      <div class="hero-icon">${iconForTopic(ex.topic)}</div>
    </section>
    <section class="card">
      <h3 class="task-title">Your task</h3>
      <p class="task-text">${ex.task}</p>
      ${expected ? `<div class="expected"><h4>Expected output for the test input</h4><pre>${escapeHTML(expected)}</pre></div>` : ''}
    </section>
    <section class="grid">
      <div class="panel">
        <div class="panel-head"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="filename">answer_${ex.id}.py</span></div>
        <textarea class="editor" id="codeEditor" spellcheck="false" oninput="saveCode(this.value)" onkeydown="handleTab(event)">${escapeHTML(w.code)}</textarea>
      </div>
      <div class="panel">
        <div class="panel-head"><span class="dot g"></span><span class="filename" id="runtimeLabel">${runtimeLabel()}</span></div>
        <div class="runner-body">
          <label class="input-label" for="stdinEditor">Program input</label>
          <textarea class="stdin" id="stdinEditor" spellcheck="false" oninput="saveInput(this.value)" onkeydown="runShortcut(event)">${escapeHTML(w.stdin)}</textarea>
          <div class="btnrow" style="margin-top:0; margin-bottom:14px;">
            <button class="btn primary" id="runBtn" onclick="runVisibleCode()">Run Code</button>
            <button class="btn soft" onclick="resetInput()">Reset Input</button>
            <button class="btn soft" onclick="clearConsole()">Clear Output</button>
          </div>
          <label class="input-label">Console output</label>
          <pre class="console${w.console ? '' : ' muted'}" id="console">${escapeHTML(w.console || 'Click Run Code to see the output here.')}</pre>
        </div>
      </div>
    </section>
    <div class="btnrow">
      <button class="btn soft" onclick="previousQuestion()" ${currentIndex === 0 ? 'disabled' : ''}>Previous</button>
      <button class="btn primary" onclick="checkAnswer()">Check Answer</button>
      <button class="btn good" onclick="nextQuestion()">${currentIndex === EXERCISES.length - 1 ? 'Finish' : 'Next'}</button>
      <button class="btn soft" onclick="showHint()">Hint</button>
      <button class="btn soft" onclick="resetQuestion()">Reset Question</button>
    </div>
    <div class="feedback" id="feedback"></div>
  `;
  renderSidebar();
  updateProgress();
  updateRuntimeControls();
  saveState();
}
function iconForTopic(topic) {
  return {Variables:'📦', Output:'💬', Input:'⌨️', Comments:'📝', Debugging:'🐞', Challenge:'🚀', Extension:'⭐'}[topic] || '🐍';
}
function runtimeLabel() {
  if (runtimeError) return 'Python unavailable';
  if (runnerBusy) return 'Running...';
  if (pyodideLoading) return 'Loading Python...';
  if (pyodideReady) return 'Python ready';
  return 'Python loads on first run';
}
function updateRuntimeControls() {
  const label = document.getElementById('runtimeLabel');
  const runBtn = document.getElementById('runBtn');
  if (label) label.textContent = runtimeLabel();
  if (runBtn) runBtn.disabled = runnerBusy || pyodideLoading;
}
function saveCode(value) {
  const ex = EXERCISES[currentIndex];
  work(ex).code = value;
  saveState();
}
function saveInput(value) {
  const ex = EXERCISES[currentIndex];
  work(ex).stdin = value;
  saveState();
}
function setConsole(text) {
  const ex = EXERCISES[currentIndex];
  work(ex).console = text;
  const c = document.getElementById('console');
  if (c) { c.textContent = text || 'Click Run Code to see the output here.'; c.classList.toggle('muted', !text); }
  saveState();
}
function clearConsole() { setConsole(''); }
function resetInput() {
  const ex = EXERCISES[currentIndex];
  work(ex).stdin = getDefaultInput(ex);
  const el = document.getElementById('stdinEditor');
  if (el) el.value = work(ex).stdin;
  saveState();
}
function resetQuestion() {
  const ex = EXERCISES[currentIndex];
  state.work[ex.id] = { code: ex.starter || '', stdin: getDefaultInput(ex), console: '' };
  delete state.completed[ex.id];
  renderExercise();
}
function handleTab(e) {
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = e.target.selectionStart, end = e.target.selectionEnd;
    e.target.setRangeText('    ', s, end, 'end');
    saveCode(e.target.value);
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); runVisibleCode(); }
}
function runShortcut(e) { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); runVisibleCode(); } }

function goTo(i) { currentIndex = i; renderExercise(); }
function previousQuestion() { if (currentIndex > 0) { currentIndex--; renderExercise(); } }
function nextQuestion() {
  if (currentIndex < EXERCISES.length - 1) { currentIndex++; renderExercise(); }
  else showCompletion();
}
function showHint() { showFeedback('hint', EXERCISES[currentIndex].hint); }
function showFeedback(kind, text) {
  const fb = document.getElementById('feedback');
  fb.className = `feedback show ${kind}`;
  fb.textContent = text;
}
function updateProgress() {
  const total = EXERCISES.length;
  const done = Object.values(state.completed).filter(Boolean).length;
  const pct = Math.round((done/total)*100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('scorePill').textContent = `Score: ${done} / ${total}`;
  document.getElementById('progressPill').textContent = `${done} / ${total} complete`;
}

function stripComments(code) {
  return code.split(/\r?\n/).map(line => {
    let quote = null, out = '';
    for (let i=0; i<line.length; i++) {
      const ch = line[i], prev = line[i-1];
      if ((ch === '"' || ch === "'") && prev !== '\\') { quote = quote === ch ? null : (quote || ch); }
      if (ch === '#' && !quote) break;
      out += ch;
    }
    return out;
  }).join('\n');
}
function hasComment(code) { return code.split(/\r?\n/).some(line => /^\s*#/.test(line) && !/^\s*#\s*Question\s+\d+/i.test(line) && !/^\s*#\s*(Add|Ask|Create|Text|Numbers|A variable|Print|Fix|Use|Put|Build)/i.test(line)); }
function hasCommentedLineContaining(code, text) {
  return code.split(/\r?\n/).some(line => /^\s*#/.test(line) && line.includes(text));
}
function checkRequirements(ex, code) {
  const cleaned = stripComments(code);
  for (const req of ex.requirements || []) {
    if (req.type === 'pattern') {
      const re = new RegExp(req.pattern, req.flags || 'i');
      if (!re.test(cleaned)) return req.msg;
    }
    if (req.type === 'countPattern') {
      const re = new RegExp(req.pattern, req.flags || 'gi');
      const matches = cleaned.match(re) || [];
      if (matches.length < req.min) return req.msg;
    }
    if (req.type === 'comment') {
      if (!hasComment(code)) return req.msg;
    }
    if (req.type === 'lineCommentContains') {
      if (!hasCommentedLineContaining(code, req.text)) return req.msg;
    }
  }
  return '';
}
function normaliseOutput(text) {
  return String(text || '').replace(/\r/g,'').split('\n').map(line => line.replace(/\s+$/,'')).join('\n').trim();
}
async function checkAnswer() {
  const ex = EXERCISES[currentIndex];
  const code = work(ex).code;
  const reqError = checkRequirements(ex, code);
  if (reqError) {
    state.completed[ex.id] = false; saveState(); renderSidebar(); updateProgress();
    showFeedback('error', reqError);
    return;
  }
  runnerBusy = true; updateRuntimeControls();
  try {
    for (const runCase of ex.runCases || []) {
      const result = await executePython(code, runCase.inputs || [], false);
      const got = normaliseOutput(result.output);
      const expected = normaliseOutput(runCase.expected);
      if (result.hadError) {
        state.completed[ex.id] = false;
        setConsole(result.output);
        showFeedback('error', 'Your code has an error when Python runs it. Check the console output, then fix your code.');
        renderSidebar(); updateProgress(); saveState();
        return;
      }
      if (result.missingInput) {
        state.completed[ex.id] = false;
        work(ex).stdin = (runCase.inputs || []).join('\n');
        setConsole(result.output);
        showFeedback('error', 'Your program asked for more input than expected. I loaded the test input so you can run it and check.');
        renderExercise();
        return;
      }
      if (got !== expected) {
        state.completed[ex.id] = false;
        work(ex).stdin = (runCase.inputs || []).join('\n');
        setConsole(result.output || '[Program finished with no output]');
        showFeedback('error', `Your code ran, but the output is not correct yet.\n\nExpected:\n${expected || '[no output]'}\n\nGot:\n${got || '[no output]'}`);
        renderSidebar(); updateProgress(); saveState();
        return;
      }
    }
    state.completed[ex.id] = true;
    showFeedback('success', 'Correct. Your code matches the task and passes the Python check.');
  } catch (e) {
    state.completed[ex.id] = false;
    showFeedback('error', 'The Python runner could not load. Check your internet connection, then try Run Code again.');
  } finally {
    runnerBusy = false; updateRuntimeControls(); renderSidebar(); updateProgress(); saveState();
  }
}

async function runVisibleCode() {
  const ex = EXERCISES[currentIndex];
  const code = work(ex).code;
  const inputs = work(ex).stdin ? work(ex).stdin.split(/\r?\n/) : [];
  runnerBusy = true; updateRuntimeControls(); setConsole('');
  try {
    const result = await executePython(code, inputs, true);
    if (!result.output) setConsole('[Program finished with no output]');
  } catch (e) {
    setConsole('Python runner could not load. Check your internet connection, then try again.');
  } finally { runnerBusy = false; updateRuntimeControls(); }
}
async function ensurePyodide() {
  if (pyodidePromise) return pyodidePromise;
  pyodideLoading = true; updateRuntimeControls();
  pyodidePromise = (async () => {
    await loadPyodideScript();
    const pyodide = await window.loadPyodide({ indexURL: PYODIDE_BASE_URL });
    pyodideReady = true;
    return pyodide;
  })().catch(err => { runtimeError = err.message || String(err); pyodidePromise = null; throw err; }).finally(() => { pyodideLoading = false; updateRuntimeControls(); });
  return pyodidePromise;
}
function loadPyodideScript() {
  if (typeof window.loadPyodide === 'function') return Promise.resolve();
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = PYODIDE_BASE_URL + 'pyodide.js';
    s.async = true;
    s.onload = resolve;
    s.onerror = () => reject(new Error('Could not load Pyodide.'));
    document.head.appendChild(s);
  });
}
function createSession(inputs, show) {
  return {
    inputs: [...inputs], index: 0, output: '', hadError: false, missingInput: false, show,
    write(chunk) {
      this.output += chunk;
      if (this.show) setConsole(this.output);
    },
    input(prompt) {
      if (prompt) this.write(prompt);
      if (this.index >= this.inputs.length) { this.missingInput = true; this.write('[No input provided]\n'); return ''; }
      const value = this.inputs[this.index++];
      this.write(value + '\n');
      return value;
    }
  };
}
window.pyWrite = chunk => { if (activeSession) activeSession.write(String(chunk)); };
window.pyInput = prompt => activeSession ? activeSession.input(String(prompt || '')) : '';
window.pyMarkError = () => { if (activeSession) activeSession.hadError = true; };
async function executePython(code, inputs, show) {
  const pyodide = await ensurePyodide();
  activeSession = createSession(inputs, show);
  window.__studentCode = code;
  try { await pyodide.runPythonAsync(PYTHON_RUNNER_WRAPPER); }
  catch (e) { activeSession.hadError = true; activeSession.write('Runner error: ' + (e.message || e) + '\n'); }
  const result = { output: activeSession.output, hadError: activeSession.hadError, missingInput: activeSession.missingInput };
  activeSession = null; delete window.__studentCode;
  return result;
}
function showCompletion() {
  const done = Object.values(state.completed).filter(Boolean).length;
  const total = EXERCISES.length;
  document.getElementById('main').innerHTML = `<div class="completion"><div class="completion-card"><div style="font-size:86px">🏆</div><h2>Course Complete</h2><p class="task-text">You finished the Y7 Unit 2 Python course.</p><div class="bigscore">${done} / ${total}</div><div class="btnrow" style="justify-content:center"><button class="btn primary" onclick="goTo(0)">Review Course</button><button class="btn soft" onclick="restartCourse()">Restart All</button></div></div></div>`;
  renderSidebar(); updateProgress(); saveState();
}
function restartCourse() {
  if (!confirm('Restart all questions and clear saved work?')) return;
  localStorage.removeItem(STORAGE_KEY);
  state = defaultState(); currentIndex = 0; renderExercise();
}
function escapeHTML(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}
renderExercise();
</script>
