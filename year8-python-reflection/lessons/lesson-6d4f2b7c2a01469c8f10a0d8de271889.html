  <script>window.CHECKPOINT_HOSTED=true;window.CHECKPOINT_CURATED_PRACTICE=true;window.LESSON={"mode":"practice","className":"8T","sessionId":"8-python-reflection-2026-11-19","date":"2026-11-19","sessionDate":"2026-11-19","sessionStart":"14:00","sessionEnd":"15:00","names":[{"id":"8t-21","name":"Ee Ther"}],"profile":{"id":"8t-21","name":"Ee Ther","route":"foundation","language":"zh"},"cards":[{"id":"focus","type":"reflect","phase":"Reflect","topic":"Reflection","title":"Turn one Teams comment into a goal","body":"Think about the feedback you just read. Choose one Python skill to practise and explain why it’s your next step. Don’t copy your score or the teacher’s comment here.","prompts":["I want to get better at ___ because I got stuck when ___.","I could explain ___, but I still had to guess when ___.","I feel ready for a harder version of ___ because I can already ___."],"zh":"想一想你刚在 Teams 中读到的反馈。选一个想练习的 Python 技能，用自己的话解释原因。不要把分数或老师的评语复制到这里。","prompt":"Which skill do you want to get better at first, and why?","keywords":["Getting started — knowing which line to write first","Syntax — getting the brackets, quotes, colon, or spaces right","Tracing — following what happens one line at a time","Reading an error — finding the first clue instead of starting over","Testing — trying a second input to check that it really works"],"examples":["I knew what message I wanted to show, but I kept getting stuck on how to close the quotes and brackets. I want to get that line right without copying it.","I got the first input to work, so I assumed the whole program was fine. I want to get better at choosing a second input that might make it fail."],"help":"A focus is one thing you can work on, not a judgement about how good you are at Python. You can say you felt stuck or unsure, but you do not have to share personal feelings. If nothing felt hard, pick something you want to do without help."},{"id":"strategy","type":"reflect","phase":"Reflect","topic":"Reflection","title":"How will you practise it?","body":"A strategy is something you can actually do when you hit a hard bit. Pick one move you could try on the very next practice card, and say how you would know it helped.","prompts":["When ___ happens, I will ___. I’ll know it helped if ___.","Instead of changing loads of lines at once, I will ___.","Before I ask for help, I will try ___ and check ___."],"zh":"策略就是卡住时能做的一个具体动作。选一个下一关就能试的方法，再想想怎样判断它有没有用。句型：当___时，我会先___。如果我能___，就说明这个方法有用。可以先预测再运行；每次只改一行；看完示例后盖住重写；或换一组输入再测试。","prompt":"What is one move you will try the next time you get stuck?","keywords":["Predict → run → compare — guess the output, run it, then check your guess","One change at a time — edit one line, then run to see what changed","Cover and retype — look at a model, hide it, and write it from memory","Check the basics — match quotes and brackets, then check colons and indentation","Test a different case — change the input so a different result should appear"],"examples":["When I see an error, I’ll read the line number and change one thing before I run it again. I’ll know it helped if I can point to the fix, even if there’s still another error.","Before I run an if statement, I’ll write down what I expect for two different inputs. If one result surprises me, I’ll trace the line that makes the decision."],"help":"‘Practise more’ says how much; a strategy says what you will do. Choose something small enough to try now. You can check whether it helped by pointing to a line you fixed, an output you predicted, or a test you can explain."},{"id":"learned-best","type":"reflect","phase":"Reflect","topic":"Reflection","title":"What helped you learn Python?","body":"Think of a moment when something in Python finally made sense. If it still hasn’t clicked, you can say what you tried and what you still couldn’t work out.","prompts":["It started to make sense when I ___. Then I could ___.","I understood ___ better after I ___, because I noticed ___.","I tried ___, but I still couldn’t tell ___."],"zh":"想一想：哪一刻你开始明白某行代码的作用？用一个细节说明那个方法怎样帮了你。句型：我做了___之后，能自己___。如果还没懂，也可以写：我试了___，可是还是不知道___。可以想想：对比两个版本、运行后看结果、跟同伴解释，或先完成一行。","prompt":"What helped you understand one bit of code, and what could you do after that?","keywords":["A worked example — see one complete example and what it produces","A side-by-side comparison — spot what changed between two versions","Talking it through — explain a line to someone and hear their question","Seeing the result — change a value and watch the output change","A small first step — finish one line before adding more"],"examples":["It clicked when I ran the same instruction with a word and then with a number. I could explain why the outputs showed different things instead of just saying the code worked.","Seeing the finished example helped me follow it, but I still froze when the editor was empty. Next time I want to try a starter with just the first line filled in."],"help":"You are not choosing a ‘type of learner’. You are identifying one thing that made this specific coding task easier to understand. ‘After I did it, I could…’ is a good way to show the difference it made."},{"id":"support","type":"reflect","phase":"Reflect","topic":"Reflection","title":"What help would you like next?","body":"Picture yourself stopped at one line of code. You know what you want to happen, but you can’t see the next step. Say what someone could show, say, or give you to help you carry on yourself.","prompts":["When I’m stuck on ___, it helps if you ___ so I can ___.","Please show me ___ first; then I’d like to try ___.","One hint I could use on my own is ___."],"zh":"设想你卡在某一行。怎样的帮助能让你自己继续写，而不是直接看到答案？句型：当我卡在___时，请先帮我___，然后我可以自己___。例如：指给我看报错的行号；演示时每写一行就停一下；给我一行起步代码；或用中文和英文解释一个关键词。","prompt":"What kind of help would get you moving again without giving you the answer?","keywords":["One hint — point to where to look without fixing it for me","A slower demonstration — pause after each line so I can see its effect","A starter line — give me a way in, then let me do the next part","A small test case — give me an input and tell me what should come out","Plain words or two languages — explain a keyword so I can use it myself"],"examples":["When the red message pops up, I don’t know what part to read first. Could you show me where the line number is once, so I can find it on my own next time?","When a task has several instructions, I’d like one example of the first step and a pause. Then I can try the next step before seeing the whole answer."],"help":"Be specific: ‘Help me read the first line of the error’ is more useful than ‘Help me with Python’. If you aren’t sure what help you need, name the point where you stopped and ask for one hint."},{"id":"foundation-p01","title":"Print practice 1 of 5: Say hello","body":"Type this line. Python displays the words inside the quotes.","type":"type","topic":"print()","sample":"print(\"Hello\")","zh":"照着输入一行。print() 把引号里的文字显示在屏幕上。","help":"","phase":"Print practice"},{"id":"foundation-p02","title":"Print practice 2 of 5: Keep the space","body":"Type the whole line. Keep the space inside the message.","type":"type","topic":"print()","sample":"print(\"Moon base\")","zh":"照着输入整行，保留引号里两个单词之间的空格。","help":"","phase":"Print practice"},{"id":"foundation-p03","title":"Print practice 3 of 5: Show a number","body":"Type this line. A whole number can go inside the parentheses without quotation marks.","type":"type","topic":"print()","sample":"print(7)","zh":"照着输入。整数可以直接放进括号，不需要引号。","help":"","phase":"Print practice"},{"id":"foundation-p04","title":"Print practice 4 of 5: Use single quotes","body":"Type this message using single quotation marks. Open and close with the same kind.","type":"type","topic":"print()","sample":"print('Launch')","zh":"这次使用单引号。开头和结尾的引号要成对。","help":"","phase":"Print practice"},{"id":"foundation-p05","title":"Print practice 5 of 5: Show two lines","body":"Type both lines. Press Enter before typing the second print command.","type":"type","topic":"print()","sample":"print(\"First\")\nprint(\"Next\")","zh":"先输入第一行，按回车键，再输入第二行。","help":"","phase":"Print practice"},{"id":"foundation-p06","title":"Predict what appears","body":"What appears after Python runs print(\"Star\")?","type":"mc","topic":"print()","choices":["Star","\"Star\"","print","Nothing"],"correct":0,"zh":"运行 print(\"Star\") 后，会显示什么？","help":"Quotation marks tell Python where a text value begins and ends; they are not displayed.","phase":"Print practice"},{"id":"foundation-p07","title":"Choose code that displays a word","body":"Which line will display the word Comet?","type":"mc","topic":"print()","choices":["print(\"Comet\")","print(Comet)","\"Comet\"","print[\"Comet\"]"],"correct":0,"zh":"哪一行代码会显示 Comet？","help":"Use print with round parentheses. Put written text in quotation marks.","phase":"Print practice"},{"id":"foundation-p08","title":"Fix the missing command","body":"Add the missing function name: ___(\"Signal\")","type":"blank","topic":"print()","answers":["print"],"zh":"填入缺少的函数名：___(\"Signal\")。","help":"You only type the word before the opening parenthesis.","phase":"Print practice"},{"id":"foundation-p09","title":"Close the sentence","body":"Type the single missing character: print(\"Station\"___","type":"blank","topic":"print()","answers":[")"],"zh":"只输入缺少的一个符号。引号已成对，括号还没合上。","help":"The text already has its closing quotation mark.","phase":"Print practice"},{"id":"foundation-p10","title":"Fix a word that needs quotes","body":"Rewrite this whole line so Python treats Blue as text: print(Blue)","type":"blank","topic":"print()","answers":["print(\"Blue\")","print('Blue')"],"zh":"重写整行，让 Python 把 Blue 当作文字。","help":"Add matching quotes around Blue. Do not change its capital B.","phase":"Print practice"},{"id":"foundation-p11","title":"Run a launch message","body":"Complete the program so it displays exactly Launch ready.","type":"code","topic":"print()","starter":"# Type one print command below.\n","tests":[{"input":"","output":"Launch ready"}],"sample":"print(\"Gate open\")","help":"Use the same shape as the example, with the requested message.","zh":"写一条 print() 语句，准确显示 Launch ready。","phase":"Print practice"},{"id":"foundation-p12","title":"Build a two-line notice","body":"Write two print commands. Display Check map on line 1 and Board rover on line 2.","type":"code","topic":"print()","starter":"# Notice board\n","tests":[{"input":"","output":"Check map\nBoard rover"}],"sample":"print(\"Check door\")\nprint(\"Turn left\")","help":"Put one command on each line and check the order of the output.","zh":"写两行 print()：第一行显示 Check map，第二行显示 Board rover。","phase":"Print practice"},{"id":"foundation-p13","title":"What does print() do?","body":"Think of a tiny program you might actually use: a scoreboard, a reminder, or a game message. Imagine somebody is looking at the screen.","type":"reflect","topic":"print()","prompts":["I would use print() to show ___ so the person knows ___.","After my program works out ___, it should show ___."],"zh":"想象一个小游戏、计分板或提醒程序。print() 可以把信息显示出来。句型：我会用 print() 显示___，这样使用者就知道___。例如：显示还剩几次机会，让玩家决定下一步。","phase":"Print practice","prompt":"What would you use print() to show that person?","keywords":["Output — something the program shows","Message — words for the person using it","Result — an answer or number the program worked out"],"examples":["I’d use print() to show how many guesses are left. Without that message, the player wouldn’t know how many more tries they have.","I’d show the final score when the game ends so the player can see whether they beat their best."],"help":"print() displays something. It does not have to be a finished program: name a result or message and say why someone would want to see it."},{"id":"foundation-p14","title":"Ask a partner to check your print() explanation","body":"Explain print() to a partner. Ask them to predict what print(\"Lift\") shows. Your partner gives a rating and a short reason.","type":"peer","topic":"print()","prompts":["I followed the part where you said ___.","One detail that would help me follow is ___."],"zh":"向同伴解释 print()，请对方预测 print(\"Lift\") 的结果。同伴给出评价并写一句理由。\n\n听同伴解释一行代码，用一句话说出你听懂的地方，再给一个具体建议。句型：你刚才解释的___我听懂了。如果再说说___，会更清楚。评价的是解释，不是这个人。","phase":"Print practice","keywords":["Job of the line — what it actually does","Result — what happened when the code ran","Missing link — one step they could explain more clearly"],"examples":["I followed why the line shows a message. I’d like to hear what message your program would show for a different input.","I understood which line makes the decision. Hearing the two possible results would make it even clearer."],"help":"A useful peer comment names something you heard and, if needed, one thing your partner can add. Comments like ‘good’ don’t tell them what to keep or improve."},{"id":"foundation-i01","title":"Input practice 1 of 5: Ask for a response","body":"Type the shortest form. input() waits for the person to type and press Enter.","type":"type","topic":"input()","sample":"input()","zh":"照着输入。input() 等待使用者输入内容并按回车键。","help":"","phase":"Input practice"},{"id":"foundation-i02","title":"Input practice 2 of 5: Show a prompt","body":"Type the prompt in quotes. It tells a person what to enter.","type":"type","topic":"input()","sample":"input(\"Name?\")","zh":"把提示文字放入引号。它告诉使用者需要输入什么。","help":"","phase":"Input practice"},{"id":"foundation-i03","title":"Input practice 3 of 5: Store the reply","body":"Store what the person types in a variable called name. Type the entire line.","type":"type","topic":"input()","sample":"name = input()","zh":"把使用者输入的内容保存到名为 name 的变量中。照着输入整行。","help":"","phase":"Input practice"},{"id":"foundation-i04","title":"Input practice 4 of 5: Prompt and store","body":"Type a prompt and store the reply in pet. Keep the question mark inside the quotes.","type":"type","topic":"input()","sample":"pet = input(\"Pet?\")","zh":"显示提示，把输入保存到 pet。问号放在引号里。","help":"","phase":"Input practice"},{"id":"foundation-i05","title":"Input practice 5 of 5: Read, then display","body":"Type both lines. The second line uses the stored value, so colour has no quotation marks.","type":"type","topic":"input()","sample":"colour = input()\nprint(colour)","zh":"照着输入两行。第二行使用变量 colour，所以不用引号。","help":"","phase":"Input practice"},{"id":"foundation-i06","title":"Spot what input does","body":"The program reaches name = input(). What happens next?","type":"mc","topic":"input()","choices":["It waits to read what the person types.","It prints name to the screen.","It changes the reply into a whole number.","It always stores the word name."],"correct":0,"zh":"运行到 name = input() 时，接下来发生什么？","help":"input() gathers a response; it is not the same as displaying one.","phase":"Input practice"},{"id":"foundation-i07","title":"Follow a reply through the program","body":"A program runs pet = input() and then print(pet). The person enters turtle. What does print(pet) display?","type":"mc","topic":"input()","choices":["pet","turtle","input","Nothing"],"correct":1,"zh":"使用者输入 turtle。程序接着运行 print(pet)，显示什么？","help":"Without quotes, pet refers to the value that was stored in the variable.","phase":"Input practice"},{"id":"foundation-i08","title":"Fill in the function that reads","body":"Type one word to complete this line: snack = ___(\"Snack?\")","type":"blank","topic":"input()","answers":["input"],"zh":"只填一个词，补全读取输入的这行代码。","help":"The command reads the reply, then snack holds it.","phase":"Input practice"},{"id":"foundation-i09","title":"Close the input call","body":"Type the single missing character: city = input(\"City?\"___","type":"blank","topic":"input()","answers":[")"],"zh":"只输入一个缺少的符号，把 input() 的括号合上。","help":"Find the opening parenthesis just after input.","phase":"Input practice"},{"id":"foundation-i10","title":"Fix function-name case","body":"Rewrite the whole line with the correct Python function name: name = Input()","type":"blank","topic":"input()","answers":["name = input()","name=input()"],"zh":"用正确的函数名称重写。Python 区分大小写。","help":"Built-in input is written in lowercase.","phase":"Input practice"},{"id":"foundation-i11","title":"Build a reply echo","body":"Read one reply into animal, then display that reply. Keep the name animal. Test with a different animal each time.","type":"code","topic":"input()","starter":"animal = input()\n# Display the value stored in animal.\n","tests":[{"input":"panda","output":"panda"},{"input":"otter","output":"otter"}],"sample":"planet = input()\nprint(planet)","help":"Print the variable without quotes so its value is displayed.","zh":"读取一个动物名称到 animal，再显示 animal 中保存的文字。同一程序要能处理不同的名称。","phase":"Input practice"},{"id":"foundation-i12","title":"Read two answers in order","body":"Read a name first and a colour second. Display the colour, then the name on a new line.","type":"code","topic":"input()","starter":"name = input()\ncolour = input()\n# Display the two replies in the requested order.\n","tests":[{"input":"Ari\ngreen","output":"green\nAri"},{"input":"Nia\nred","output":"red\nNia"}],"sample":"song = input()\nband = input()\nprint(band)\nprint(song)","help":"There are two inputs. Check which printed variable must come first.","zh":"先读取名字，再读取颜色。先显示颜色，下一行显示名字。","phase":"Input practice"},{"id":"foundation-i13","title":"What does input() do?","body":"Imagine two people using the same program. Their answers might be different, so the program should not guess what they will type.","type":"reflect","topic":"input()","prompts":["I’d ask the person to type ___. The program could use it to ___.","If two people type different ___, the program can ___."],"zh":"input() 读取使用者输入的文字。句型：我会请使用者输入___，程序可以用这个答案来___。例如：问玩家叫什么，让程序用他输入的名字打招呼。先说明用途，不用写代码。","phase":"Input practice","prompt":"What would you ask the person to type, and how would their answer help the program?","keywords":["Input — information the person types","Prompt — words that tell them what to enter","Store — hold the answer so the program can use it later"],"examples":["I’d ask the person for a player name. The program could remember it and use it in a welcome message instead of guessing their name.","I’d ask how many players are on their team. Their answer gives the program a number to work with when it makes the groups."],"help":"input() reads what the person types as text. A program can use that answer later. For now, say what you would ask for and why it matters; you do not have to write the code."},{"id":"foundation-i14","title":"Ask a partner to check your input() explanation","body":"Explain input() to a partner. Ask them to enter a value in your echo program. Your partner rates whether your explanation matched what happened.","type":"peer","topic":"input()","prompts":["I followed the part where you said ___.","One detail that would help me follow is ___."],"zh":"向同伴解释 input()，让对方在你的程序里输入内容。同伴评价你的解释是否符合程序的实际表现。\n\n听同伴解释一行代码，用一句话说出你听懂的地方，再给一个具体建议。句型：你刚才解释的___我听懂了。如果再说说___，会更清楚。评价的是解释，不是这个人。","phase":"Input practice","keywords":["Job of the line — what it actually does","Result — what happened when the code ran","Missing link — one step they could explain more clearly"],"examples":["I followed why the line shows a message. I’d like to hear what message your program would show for a different input.","I understood which line makes the decision. Hearing the two possible results would make it even clearer."],"help":"A useful peer comment names something you heard and, if needed, one thing your partner can add. Comments like ‘good’ don’t tell them what to keep or improve."},{"id":"foundation-v01","title":"Read a value from a variable","body":"Type the two lines. The equals sign stores the text in the variable called tool.","type":"type","topic":"Variables","sample":"tool = \"torch\"\nprint(tool)","zh":"照着输入。等号把文字保存到名为 tool 的变量中。","help":"","phase":"Build"},{"id":"foundation-v02","title":"Quotes change the meaning","body":"The program sets tool = \"torch\". Which line displays the value torch, not the word tool?","type":"mc","topic":"Variables","choices":["print(\"tool\")","print(tool)","print(\"print\")","input(tool)"],"correct":1,"zh":"tool 已经保存了文字 torch。哪一行会显示它保存的值，而不是单词 tool？","help":"","phase":"Build"},{"id":"foundation-v03","title":"Read the current value","body":"Type the missing variable name: place = \"cave\" then print(___). The output should be cave.","type":"blank","topic":"Variables","answers":["place"],"zh":"把缺少的变量名填进括号，让程序显示 cave。","help":"Do not put the variable name in quotation marks.","phase":"Build"},{"id":"foundation-v04","title":"Add a label to an output","body":"Read a rover name. Display Rover: followed by the name, on one line. print() can show two values separated by a comma.","type":"code","topic":"Variables","starter":"rover = input()\n# Display the label and the variable.\n","tests":[{"input":"Bolt","output":"Rover: Bolt"},{"input":"Scout","output":"Rover: Scout"}],"sample":"animal = \"wolf\"\nprint(\"Animal:\", animal)","help":"Keep the label in quotes. Use the variable name without quotes.","zh":"读取探测车名称。用逗号把提示 Rover: 和变量分开，使两者显示在同一行。","phase":"Build"},{"id":"foundation-n01","title":"Typing digits still starts as text","body":"A user types 12 into input(). What does Python get before any conversion?","type":"mc","topic":"int() and numbers","choices":["An integer","A text string","A list","An if statement"],"correct":1,"zh":"使用者输入 12。在转换之前，input() 读入的是什么类型？","help":"input() always reads text. int() is the next step when you need a whole number.","phase":"Build"},{"id":"foundation-n02","title":"Convert the stored reply","body":"Type the two lines. int() changes the text from input() to a whole number.","type":"type","topic":"int() and numbers","sample":"reply = input()\npoints = int(reply)","zh":"照着输入。int() 把读入的数字文字转换成整数。","help":"","phase":"Build"},{"id":"foundation-n03","title":"Find the conversion command","body":"Type only the function name: points = ___(reply). The stored text should become a whole number.","type":"blank","topic":"int() and numbers","answers":["int"],"zh":"只填写函数名称：把 reply 中的数字文字转换成整数。","help":"","phase":"Build"},{"id":"foundation-n04","title":"Predict the result after conversion","body":"The reply is 4. Python sets amount = int(reply), then runs print(amount + 1). What is displayed?","type":"mc","topic":"int() and numbers","choices":["41","4","5","amount"],"correct":2,"zh":"输入 4。转换成整数后加 1，再显示结果。会显示什么？","help":"","phase":"Build"},{"id":"foundation-n05","title":"Build a one-step counter","body":"Read a whole number, convert it, then display one more than the number. For example, entering 8 should give 9.","type":"code","topic":"int() and numbers","starter":"reply = input()\namount = int(reply)\n# Display one more.\n","tests":[{"input":"8","output":"9"},{"input":"25","output":"26"}],"sample":"boxes = 7\nprint(boxes + 1)","help":"Use the converted variable in the addition, not the original text.","zh":"读取一个整数并转换，然后显示比它大 1 的数，例如输入 8 时显示 9。","phase":"Build"},{"id":"foundation-l01","title":"Store several things in one list","body":"Type the one line. Square brackets surround the list; a comma separates the items.","type":"type","topic":"Lists","sample":"gear = [\"map\", \"gloves\", \"torch\"]","zh":"方括号括住整个列表，逗号分隔各项。照着输入。","help":"","phase":"Build"},{"id":"foundation-l02","title":"Start a list index at zero","body":"For gear = [\"map\", \"gloves\", \"torch\"], what does print(gear[0]) display?","type":"mc","topic":"Lists","choices":["gloves","0","map","torch"],"correct":2,"zh":"列表从索引 0 开始。print(gear[0]) 会显示什么？","help":"","phase":"Build"},{"id":"foundation-l03","title":"Replace just one list item","body":"Type the two lines. The assignment changes item 0 without changing the rest of the list.","type":"type","topic":"Lists","sample":"gear[0] = \"radio\"\nprint(gear)","zh":"修改索引 0 的项目，其他项目保持不变。照着输入。","help":"","phase":"Build"},{"id":"foundation-l04","title":"Add a new item with append()","body":"Add a rope to the end of gear, then display the whole list. Keep the other items.","type":"code","topic":"Lists","starter":"gear = [\"map\", \"torch\"]\n# Add rope at the end, then display gear.\n","tests":[{"input":"","output":"['map', 'torch', 'rope']"}],"sample":"bag = [\"book\"]\nbag.append(\"pen\")\nprint(bag)","help":"append() adds after the final item. You do not need to use an index.","zh":"在 gear 的末尾添加 rope，再显示整个列表。保留原来的项目。","phase":"Build"},{"id":"foundation-l05","title":"Count the items without guessing","body":"Type the missing function name: print(___(gear)). Use the length of gear, not a number you counted yourself.","type":"blank","topic":"Lists","answers":["len"],"zh":"填入函数名称，让 Python 计算列表中有多少项。","help":"This function returns the length of a list.","phase":"Build"},{"id":"foundation-b01","title":"Give Python a decision","body":"Type this if line. The >= comparison includes the number 5. Finish the line with a colon.","type":"type","topic":"if / else","sample":"if tickets >= 5:","zh":">= 表示大于或等于，包含 5。if 行末尾要有冒号。","help":"","phase":"Build"},{"id":"foundation-b02","title":"Check the exact boundary","body":"Which value is the smallest value that makes tickets >= 5 true?","type":"mc","topic":"if / else","choices":["4","5","6","It is never true."],"correct":1,"zh":"最小的哪个数会让 tickets >= 5 成立？","help":"","phase":"Build"},{"id":"foundation-b03","title":"Indent the action","body":"Start the second line with four spaces. That line belongs to the if branch.","type":"type","topic":"if / else","sample":"if tickets >= 5:\n    print(\"Group\")","zh":"第二行前面输入四个空格，表示这一行属于 if 分支。","help":"","phase":"Build"},{"id":"foundation-b04","title":"Add the other branch","body":"Type the missing keyword, not the colon: if tickets >= 5 prints Group. ___: starts the branch for all other values.","type":"blank","topic":"if / else","answers":["else"],"zh":"只输入缺少的关键词，不输入冒号。它开始条件不成立时的分支。","help":"Write the other branch at the same indentation as if.","phase":"Build"},{"id":"foundation-b05","title":"Build a two-message decision","body":"Display Group for 5 or more tickets. Otherwise display Solo. Complete the two indented branches.","type":"code","topic":"if / else","starter":"tickets = int(input())\nif tickets >= 5:\n    # Display Group.\nelse:\n    # Display Solo.\n","tests":[{"input":"4","output":"Solo"},{"input":"5","output":"Group"},{"input":"8","output":"Group"}],"sample":"if bags >= 2:\n    print(\"Share\")\nelse:\n    print(\"Carry\")","help":"Keep the colon and print with four leading spaces inside each branch.","zh":"票数为 5 或更多时显示 Group，否则显示 Solo。补全两条缩进的输出语句。","phase":"Build"},{"id":"foundation-o01","title":"Make your own welcome sign","body":"Write a program that reads a visitor’s name and prints Hello: followed by that name. You choose the variable name.","type":"code","topic":"Your own programs","starter":"# Choose a variable. Read one name, then display a labelled line.\n","tests":[{"input":"Lee","output":"Hello: Lee"},{"input":"Fern","output":"Hello: Fern"}],"sample":"captain = input()\nprint(\"Captain:\", captain)","help":"Read from input() rather than writing a fixed name. The same program will see two different visitors.","zh":"自己选择变量名。读入一个名字，在同一行输出 Hello: 和这个名字。","phase":"Build"},{"id":"foundation-o02","title":"Make a crew-count program","body":"There is one extra crew member. Read the current count and display the updated count. Choose your own variable names.","type":"code","topic":"Your own programs","starter":"# Read text, convert it, then calculate the new number.\n","tests":[{"input":"2","output":"3"},{"input":"17","output":"18"}],"sample":"reply = input()\namount = int(reply)\nprint(amount + 2)","help":"The example adds two. Your program only adds one and must work with different inputs.","zh":"自行选择变量名。读取当前人数，转成整数，然后显示加一后的人数。","phase":"Build"},{"id":"foundation-o03","title":"Make an editable kit list","body":"Invent a three-item starter list. Replace the second item with the user’s input, then display only that changed item.","type":"code","topic":"Your own programs","starter":"# Write your own starter list.\n# Read a replacement, update index 1 and display that item.\n","tests":[{"input":"lamp","output":"lamp"},{"input":"blanket","output":"blanket"}],"sample":"bag = [\"pen\", \"hat\", \"map\"]\nitem = input()\nbag[0] = item\nprint(bag[0])","help":"The example changes the first item. Your program must use the second; its index is 1.","zh":"自己写一个有三项的列表。用使用者的输入替换第二项，并只显示改后的那一项。","phase":"Build"},{"id":"foundation-o04","title":"Make your own gate rule","body":"Choose a scene such as a museum or a campsite. The gate displays Open when the entry number is at least 6; otherwise it displays Closed. Build the rule from scratch.","type":"code","topic":"Your own programs","starter":"# Pick a scene. Read a number, compare it and show one message.\n","tests":[{"input":"5","output":"Closed"},{"input":"6","output":"Open"},{"input":"9","output":"Open"}],"sample":"number = int(input())\nif number >= 3:\n    print(\"Enter\")\nelse:\n    print(\"Wait\")","help":"Use the limit and messages in your task. Check one number below, one at and one above the limit.","zh":"自己选择场景。输入数字至少为 6 时显示 Open，否则显示 Closed。检查 5、6 和 9。","phase":"Build"},{"id":"foundation-o05","title":"Show your teacher what your code does","body":"Pick one line from a program you tried. Say what job that line does, not just what it reads. Use something you saw when you ran your program as a clue.","type":"reflect","topic":"Your own programs","prompts":["This line tells Python to ___. I noticed because ___.","If I took this line out, ___ would happen instead.","I know this line is doing its job because when I tried ___, I saw ___."],"zh":"选一行你实际运行过的代码。用自己的话说明它让电脑做什么，然后说出你看到的一个结果。句型：这一行让 Python___，我知道是因为我运行时看到了___。如果去掉这一行，___会改变。","phase":"Build","prompt":"What does this line do, and what would change without it?","keywords":["Read input — take in what someone types","Store or change a value — give a value a name or update it","Make a decision — choose what runs next","Show output — display the result","Evidence — something you saw when you ran or tested the code"],"examples":["This line shows the final message. I know because the program still ran when I hid the line, but there was nothing on the screen.","This line decides which message to show. Changing my input took me to the other branch, so I saw a different message."],"help":"Read it as an instruction to the computer, in your own words. To make your explanation stronger, connect the instruction to something you can predict, see, or test."},{"id":"teacher-check","type":"finish","phase":"Show","topic":"Teacher check-in","title":"Show one thing you can do","body":"Show one program you ran and explain one line to your teacher.","prompts":["My program …","I used … so that …","I tested it with … and it showed …"],"zh":"展示一个你运行的程序，并向老师解释其中一行。"}]};</script>
