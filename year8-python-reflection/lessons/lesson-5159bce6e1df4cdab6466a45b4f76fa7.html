  <script>window.CHECKPOINT_HOSTED=true;window.CHECKPOINT_CURATED_PRACTICE=true;window.LESSON={"mode":"practice","className":"8T","sessionId":"8-python-reflection-2026-11-19","date":"2026-11-19","sessionDate":"2026-11-19","sessionStart":"14:00","sessionEnd":"15:00","names":[{"id":"8t-18","name":"Aleeya"}],"profile":{"id":"8t-18","name":"Aleeya","route":"review","language":"en"},"cards":[{"id":"focus","type":"reflect","phase":"Reflect","topic":"Reflection","title":"Turn one Teams comment into a goal","body":"Think about the feedback you just read. Choose one Python skill to practise and explain why it’s your next step. Don’t copy your score or the teacher’s comment here.","prompts":["I want to get better at ___ because I got stuck when ___.","I could explain ___, but I still had to guess when ___.","I feel ready for a harder version of ___ because I can already ___."],"zh":"想一想你刚在 Teams 中读到的反馈。选一个想练习的 Python 技能，用自己的话解释原因。不要把分数或老师的评语复制到这里。","prompt":"Which skill do you want to get better at first, and why?","keywords":["Getting started — knowing which line to write first","Syntax — getting the brackets, quotes, colon, or spaces right","Tracing — following what happens one line at a time","Reading an error — finding the first clue instead of starting over","Testing — trying a second input to check that it really works"],"examples":["I knew what message I wanted to show, but I kept getting stuck on how to close the quotes and brackets. I want to get that line right without copying it.","I got the first input to work, so I assumed the whole program was fine. I want to get better at choosing a second input that might make it fail."],"help":"A focus is one thing you can work on, not a judgement about how good you are at Python. You can say you felt stuck or unsure, but you do not have to share personal feelings. If nothing felt hard, pick something you want to do without help."},{"id":"strategy","type":"reflect","phase":"Reflect","topic":"Reflection","title":"How will you practise it?","body":"A strategy is something you can actually do when you hit a hard bit. Pick one move you could try on the very next practice card, and say how you would know it helped.","prompts":["When ___ happens, I will ___. I’ll know it helped if ___.","Instead of changing loads of lines at once, I will ___.","Before I ask for help, I will try ___ and check ___."],"zh":"策略就是卡住时能做的一个具体动作。选一个下一关就能试的方法，再想想怎样判断它有没有用。句型：当___时，我会先___。如果我能___，就说明这个方法有用。可以先预测再运行；每次只改一行；看完示例后盖住重写；或换一组输入再测试。","prompt":"What is one move you will try the next time you get stuck?","keywords":["Predict → run → compare — guess the output, run it, then check your guess","One change at a time — edit one line, then run to see what changed","Cover and retype — look at a model, hide it, and write it from memory","Check the basics — match quotes and brackets, then check colons and indentation","Test a different case — change the input so a different result should appear"],"examples":["When I see an error, I’ll read the line number and change one thing before I run it again. I’ll know it helped if I can point to the fix, even if there’s still another error.","Before I run an if statement, I’ll write down what I expect for two different inputs. If one result surprises me, I’ll trace the line that makes the decision."],"help":"‘Practise more’ says how much; a strategy says what you will do. Choose something small enough to try now. You can check whether it helped by pointing to a line you fixed, an output you predicted, or a test you can explain."},{"id":"learned-best","type":"reflect","phase":"Reflect","topic":"Reflection","title":"What helped you learn Python?","body":"Think of a moment when something in Python finally made sense. If it still hasn’t clicked, you can say what you tried and what you still couldn’t work out.","prompts":["It started to make sense when I ___. Then I could ___.","I understood ___ better after I ___, because I noticed ___.","I tried ___, but I still couldn’t tell ___."],"zh":"想一想：哪一刻你开始明白某行代码的作用？用一个细节说明那个方法怎样帮了你。句型：我做了___之后，能自己___。如果还没懂，也可以写：我试了___，可是还是不知道___。可以想想：对比两个版本、运行后看结果、跟同伴解释，或先完成一行。","prompt":"What helped you understand one bit of code, and what could you do after that?","keywords":["A worked example — see one complete example and what it produces","A side-by-side comparison — spot what changed between two versions","Talking it through — explain a line to someone and hear their question","Seeing the result — change a value and watch the output change","A small first step — finish one line before adding more"],"examples":["It clicked when I ran the same instruction with a word and then with a number. I could explain why the outputs showed different things instead of just saying the code worked.","Seeing the finished example helped me follow it, but I still froze when the editor was empty. Next time I want to try a starter with just the first line filled in."],"help":"You are not choosing a ‘type of learner’. You are identifying one thing that made this specific coding task easier to understand. ‘After I did it, I could…’ is a good way to show the difference it made."},{"id":"support","type":"reflect","phase":"Reflect","topic":"Reflection","title":"What help would you like next?","body":"Picture yourself stopped at one line of code. You know what you want to happen, but you can’t see the next step. Say what someone could show, say, or give you to help you carry on yourself.","prompts":["When I’m stuck on ___, it helps if you ___ so I can ___.","Please show me ___ first; then I’d like to try ___.","One hint I could use on my own is ___."],"zh":"设想你卡在某一行。怎样的帮助能让你自己继续写，而不是直接看到答案？句型：当我卡在___时，请先帮我___，然后我可以自己___。例如：指给我看报错的行号；演示时每写一行就停一下；给我一行起步代码；或用中文和英文解释一个关键词。","prompt":"What kind of help would get you moving again without giving you the answer?","keywords":["One hint — point to where to look without fixing it for me","A slower demonstration — pause after each line so I can see its effect","A starter line — give me a way in, then let me do the next part","A small test case — give me an input and tell me what should come out","Plain words or two languages — explain a keyword so I can use it myself"],"examples":["When the red message pops up, I don’t know what part to read first. Could you show me where the line number is once, so I can find it on my own next time?","When a task has several instructions, I’d like one example of the first step and a pause. Then I can try the next step before seeing the whole answer."],"help":"Be specific: ‘Help me read the first line of the error’ is more useful than ‘Help me with Python’. If you aren’t sure what help you need, name the point where you stopped and ask for one hint."},{"id":"public-compare-list","type":"compare","phase":"Compare","topic":"Lists","title":"Repair the gear list","body":"The program should keep every existing item, add a new item at the end, and show the whole list. Look at both examples before answering.","submittedTitle":"Example with a bug","submitted":"gear = [\"map\", \"torch\"]\ngear[1] = \"radio\"\nprint(gear)","model":"gear = [\"map\", \"torch\"]\ngear.append(\"radio\")\nprint(gear)","feedback":"An index assignment replaces an existing value. append() adds a new element without replacing anything.","prompt":"What change keeps torch on the list?","prompts":["I would use … because …"],"zh":"比较两个示例，哪种改法能保留 torch？"},{"id":"public-compare-rule","type":"compare","phase":"Compare","topic":"Decisions","title":"Include the exact limit","body":"A team gets access when it has at least 10 points. The first program excludes a score of 10.","submittedTitle":"Example with a bug","submitted":"score = int(input())\nif score > 10:\n    print(\"Go\")\nelse:\n    print(\"Wait\")","model":"score = int(input())\nif score >= 10:\n    print(\"Go\")\nelse:\n    print(\"Wait\")","feedback":">= includes the boundary because 10 is equal to 10.","prompt":"Why does changing > to >= fix the program?","prompts":["A score of 10 now …","I would test with …"],"zh":"为什么把 > 改成 >= 能修复程序？"},{"type":"mc","title":"Choose the better type for a label","body":"A seat code is 013, and the leading zero must stay. Which line stores it as a label?","help":"Think about whether the value will be calculated with or displayed as written.","choices":["seat = 13","seat = \"013\"","seat = 13.0","seat = False"],"correct":1,"topic":"Python data types","id":"q01-s1","phase":"Targeted practice"},{"type":"reflect","title":"Explain the difference","body":"What is one difference between \"5\" and 5 in Python?","help":"Useful words: text, integer, digits, quotation marks.","prompts":["In quotation marks, 5 is stored as …","Without quotation marks, 5 is stored as …"],"topic":"Python data types","id":"q01-s2","phase":"Targeted practice"},{"type":"mc","title":"Print before and after","body":"steps = 6\nprint(steps)\nsteps = steps + 4\nprint(steps)\n\nWhich pair is displayed in order?","help":"The first print line runs before the value changes.","choices":["10 then 10","6 then 4","10 then 6","6 then 10"],"correct":3,"topic":"Tracing a changing value","id":"q02-s1","phase":"Targeted practice"},{"type":"code","title":"Update the prize count","body":"There are 6 prizes. Add 4 to the stored count, then display the updated count.","help":"Put the calculation on the right of =. Add the print line after the update.","starter":"prizes = 6\n","tests":[{"input":"","output":"10"}],"sample":"prizes = 6\nprizes = prizes + 4\nprint(prizes)","topic":"Tracing a changing value","id":"q02-s2","phase":"Targeted practice"},{"type":"mc","title":"Does the position change?","body":"rooms = [\"hall\", \"studio\"]\nprint(rooms[1])\n\nIf the list becomes [\"gym\", \"pool\"], what does the same print line display?","help":"The number still points to the same position, not the same value.","choices":["gym","pool","studio","1"],"correct":1,"topic":"Reading a list item","id":"q03-s1","phase":"Targeted practice"},{"type":"code","title":"Display the first speaker","body":"Print the first speaker using their list position rather than typing the name into print.","help":"Use print around a reference to one element. The first index is 0.","starter":"speakers = [\"Inez\", \"Mei\", \"Leo\"]\n","tests":[{"input":"","output":"Inez"}],"sample":"speakers = [\"Inez\", \"Mei\", \"Leo\"]\nprint(speakers[0])","topic":"Reading a list item","id":"q03-s2","phase":"Targeted practice"},{"type":"code","title":"Show the stored queue number","body":"Display the stored number.","help":"This is two actions: store the number, then display it.","starter":"queue_number = 17\n","tests":[{"input":"","output":"17"}],"sample":"queue_number = 17\nprint(queue_number)","topic":"Displaying a stored value with print()","id":"q04-s1","phase":"Targeted practice"},{"type":"reflect","title":"Say what print() does","body":"When you run print(name), what happens and what does not happen?","help":"Useful words: output, screen, value, variable.","prompts":["print() shows …","It does not change …"],"topic":"Displaying a stored value with print()","id":"q04-s2","phase":"Targeted practice"},{"type":"code","title":"Mirror a word","body":"Read the user's word, store it in word, then print that stored word. Use input() with no prompt here.","help":"What does the stored word become with each different input? Display the variable without quotes.","starter":"word = input()\n","tests":[{"input":"ocean","output":"ocean"},{"input":"cloud","output":"cloud"}],"sample":"word = input()\nprint(word)","topic":"Reading typed input with input()","id":"q05-s1","phase":"Targeted practice"},{"type":"mc","title":"Type versus display","body":"What is the job of input() in a program?","help":"Compare the direction of the information: user to program.","choices":["It converts every reply into a number","It displays the answer","It receives what the user types","It repeats an existing value"],"correct":2,"topic":"Reading typed input with input()","id":"q05-s2","phase":"Targeted practice"},{"type":"code","title":"Read a number and add two","body":"Read a whole number, convert it, then display the number plus 2. Do not display a prompt.","help":"Separate your three actions: read, convert, then calculate and show.","starter":"raw = input()\n","tests":[{"input":"3","output":"5"},{"input":"10","output":"12"}],"sample":"raw = input()\nnumber = int(raw)\nprint(number + 2)","topic":"Converting text into an integer","id":"q06-s1","phase":"Targeted practice"},{"type":"reflect","title":"Explain why conversion matters","body":"A program receives the text \"8\". Why convert it with int() before adding 1?","help":"Useful comparison: the character 8 versus the number eight.","prompts":["input() gives me …","int() changes it to …","Then + can …"],"topic":"Converting text into an integer","id":"q06-s2","phase":"Targeted practice"},{"type":"mc","title":"Is the check true?","body":"badge = \"bird\"\nif badge == \"fish\":\n    print(\"Match\")\n\nDoes it print Match?","help":"Compare the stored text on the left with the text on the right.","choices":["Yes, because both are text","Yes, because it stores fish","No, the values differ","Yes, every if prints"],"correct":2,"topic":"Checking equality with ==","id":"q07-s1","phase":"Targeted practice"},{"type":"reflect","title":"Explain the two signs","body":"What is the difference between symbol = and symbol == in Python?","help":"Useful words: assignment, stores, condition, compares.","prompts":["One = is used to …","Two == are used to …"],"topic":"Checking equality with ==","id":"q07-s2","phase":"Targeted practice"},{"type":"mc","title":"Include the exact target","body":"A goal is met with 15 or more points. Which check includes 15?","help":"\"Or more\" includes the target itself as well as numbers above it.","choices":["points > 15","points == 15","points >= 15","points = 15"],"correct":2,"topic":"Including the boundary with >=","id":"q08-r1","phase":"Targeted practice"},{"type":"type","title":"Type an inclusive check","body":"Copy the if line that includes the minimum number.","help":"Type greater-than first, then equals, with no space between them.","sample":"if stamps >= 8:","topic":"Including the boundary with >=","id":"q08-r2","phase":"Targeted practice"},{"type":"blank","title":"Use the test at the edge","body":"if score ___ 20:\n    print(\"Yes\")\n\nBoth 20 and 21 should give Yes. Type only the operator.","help":"Ask whether the check should accept 20 itself.","answers":[">="],"topic":"Including the boundary with >=","id":"q08-r3","phase":"Targeted practice"},{"type":"mc","title":"Count the boxes from zero","body":"pets = [\"cat\", \"dog\", \"frog\", \"fish\"]\n\nWhat is the index of frog?","help":"Slide your finger from the first item: say 0, then 1, then 2.","choices":["1","2","3","4"],"correct":1,"topic":"Using zero-based indexes","id":"q09-r1","phase":"Targeted practice"},{"type":"blank","title":"Choose the fourth flag","body":"flags = [\"blue\", \"grey\", \"gold\", \"pink\"]\nprint(flags[___])\n\nType the index for pink.","help":"An item's Python index is one less than its everyday position.","answers":["3"],"topic":"Using zero-based indexes","id":"q09-r2","phase":"Targeted practice"},{"type":"type","title":"Type an index expression","body":"Copy the line to read the first item without changing it.","help":"The first slot starts at 0; the square brackets select it.","sample":"choice = rides[0]","topic":"Using zero-based indexes","id":"q09-r3","phase":"Targeted practice"},{"id":"public-transfer-list","type":"code","phase":"Build","topic":"Lists","title":"Add an item to your list","body":"Add radio to the end of gear, then show the entire list on one line.","starter":"gear = [\"map\", \"torch\"]\n","tests":[{"input":"","output":"['map', 'torch', 'radio']"}],"sample":"kit = [\"pen\"]\nkit.append(\"paper\")\nprint(kit)","help":"Keep the starter list. Add a new item rather than replacing an old one.","zh":"把 radio 添加到列表末尾，并显示整个列表。"},{"type":"type","title":"Type a flexible count","body":"Type the line that calculates the number of items in badges.","help":"The list is the input to len(); count stores the number it returns.","sample":"count = len(badges)","topic":"Counting items with len()","id":"q10-r1","phase":"Targeted practice"},{"type":"blank","title":"Select the function for a count","body":"items = [\"rope\", \"tape\", \"glue\", \"card\"]\nprint(___(items))\n\nType the function name that counts the items.","help":"The count is the list's length, not the name of its last item.","answers":["len"],"topic":"Counting items with len()","id":"q10-r2","phase":"Targeted practice"},{"type":"mc","title":"What does length count?","body":"options = [\"jump\", \"slide\", \"duck\"]\nprint(len(options))\n\nWhat appears?","help":"Count the items between the square brackets, not the letters in each item.","choices":["2","3","jump","13"],"correct":1,"topic":"Counting items with len()","id":"q10-r3","phase":"Targeted practice"},{"type":"mc","title":"Spot the separator inside the quotes","body":"lane = [\"red, blue\", \"green\"]\n\nHow many items does lane have?","help":"The comma inside the first pair of quotes is part of that text.","choices":["1","2","3","4"],"correct":1,"topic":"Separating list items with commas","id":"q11-s1","phase":"Targeted practice"},{"type":"code","title":"Write two distinct items","body":"Repair the list so it has two items. Keep the print line.","help":"Give each item its own quotes and place one comma in between.","starter":"seeds = [\"bean pea\"]\nprint(len(seeds))","tests":[{"input":"","output":"2"}],"sample":"seeds = [\"bean\", \"pea\"]\nprint(len(seeds))","topic":"Separating list items with commas","id":"q11-s2","phase":"Targeted practice"},{"type":"mc","title":"What does the indentation mark?","body":"if light == \"on\":\n    print(\"Lit\")\n\nWhich line belongs inside the if branch?","help":"The first line begins the branch. The line moved right is its action.","choices":["Both lines are branch bodies","The print line only","The header line only","Neither line"],"correct":1,"topic":"Ending a decision header with a colon","id":"q12-s1","phase":"Targeted practice"},{"type":"code","title":"Repair and run a decision","body":"The condition is already correct. Fix the missing punctuation so Bright prints.","help":"Read the header aloud, then add the punctuation before the indented line.","starter":"light = \"on\"\nif light == \"on\"\n    print(\"Bright\")","tests":[{"input":"","output":"Bright"}],"sample":"light = \"on\"\nif light == \"on\":\n    print(\"Bright\")","topic":"Ending a decision header with a colon","id":"q12-s2","phase":"Targeted practice"},{"type":"code","title":"Complete the decision","body":"Print Inside when mode is indoor and Outside for any other mode. Add the missing branch.","help":"Align else with if. Indent the new print line under else.","starter":"mode = input()\nif mode == \"indoor\":\n    print(\"Inside\")\n","tests":[{"input":"indoor","output":"Inside"},{"input":"garden","output":"Outside"}],"sample":"mode = input()\nif mode == \"indoor\":\n    print(\"Inside\")\nelse:\n    print(\"Outside\")","topic":"Using else for the other case","id":"q13-s1","phase":"Targeted practice"},{"type":"reflect","title":"Explain when else runs","body":"In one sentence, say when the else branch is selected.","help":"Useful words: condition, false, alternative, branch.","prompts":["The else branch runs when the if condition is …"],"topic":"Using else for the other case","id":"q13-s2","phase":"Targeted practice"},{"type":"mc","title":"Trace the ordered lines","body":"raw = \"5\"\nsize = int(raw)\nprint(size * 2)\n\nWhat is displayed?","help":"Multiplying by 2 repeats text if it is still text; here the value has been converted.","choices":["55","10","5","52"],"correct":1,"topic":"Putting read, convert and calculate in order","id":"q14-s1","phase":"Targeted practice"},{"type":"code","title":"Read and increase a number","body":"Read a whole number and display that number plus 5. The same code must work for both test inputs.","help":"Don't type a fixed answer: use the value read by input.","starter":"raw = input()\n","tests":[{"input":"7","output":"12"},{"input":"12","output":"17"}],"sample":"raw = input()\nnumber = int(raw)\nprint(number + 5)","topic":"Putting read, convert and calculate in order","id":"q14-s2","phase":"Targeted practice"},{"type":"mc","title":"Read the output without running","body":"choices = [\"drums\", \"guitar\", \"piano\"]\npick = choices[1]\nprint(pick)\n\nWhat is displayed?","help":"Look up the index first. The name pick stores its value.","choices":["choices","guitar","drums","1"],"correct":1,"topic":"Choosing and displaying the right item","id":"q15-s1","phase":"Targeted practice"},{"type":"code","title":"Read the chosen shop","body":"Print the second shop name using an index. Keep the list and use the value it stores.","help":"One print can display the chosen list item directly.","starter":"shops = [\"Bakery\", \"Market\", \"Cafe\"]\n","tests":[{"input":"","output":"Market"}],"sample":"shops = [\"Bakery\", \"Market\", \"Cafe\"]\nprint(shops[1])","topic":"Choosing and displaying the right item","id":"q15-s2","phase":"Targeted practice"},{"type":"mc","title":"Predict what does not change","body":"songs = [\"Calm\", \"Fast\", \"Loud\"]\nsongs[0] = \"Chill\"\n\nWhat stays the same?","help":"Replacement changes the value in a slot. It does not make another slot.","choices":["The first item","The number of items","All songs","Nothing stays the same"],"correct":1,"topic":"Replacing a list value by index","id":"q16-s1","phase":"Targeted practice"},{"type":"code","title":"Replace then show the last supplied label","body":"Replace \"late\" with \"on time\", then display the value from that same list position.","help":"Use the same index in the update and the print.","starter":"labels = [\"open\", \"ready\", \"late\"]\n","tests":[{"input":"","output":"on time"}],"sample":"labels = [\"open\", \"ready\", \"late\"]\nlabels[2] = \"on time\"\nprint(labels[2])","topic":"Replacing a list value by index","id":"q16-s2","phase":"Targeted practice"},{"type":"mc","title":"Count after the second append","body":"kit = [\"tape\", \"glue\"]\nkit.append(\"card\")\nkit.append(\"pen\")\nprint(len(kit))\n\nWhat displays?","help":"Tick off the size after each append; each one adds a whole item.","choices":["2","3","4","pen"],"correct":2,"topic":"Appending before counting","id":"q17-s1","phase":"Targeted practice"},{"type":"code","title":"Grow a list with user input","body":"Read a new colour (no prompt), add it to the end, then print the new count.","help":"Use the input variable without quotes inside append, then calculate the length.","starter":"colours = [\"blue\", \"pink\", \"red\"]\nnew_colour = input()\n","tests":[{"input":"green","output":"4"},{"input":"white","output":"4"}],"sample":"colours = [\"blue\", \"pink\", \"red\"]\nnew_colour = input()\ncolours.append(new_colour)\nprint(len(colours))","topic":"Appending before counting","id":"q17-s2","phase":"Targeted practice"},{"type":"mc","title":"Choose a pair of tests","body":"The rule says: exact lower-case yes prints \"Save\", anything else prints \"Skip\". Which pair checks both outcomes?","help":"Include one input that matches and one that does not.","choices":["yes and yes","no and no","yes and no","no and later"],"correct":2,"topic":"Reading input and running exactly one branch","id":"q18-s1","phase":"Targeted practice"},{"type":"code","title":"Try the snack-order decision","body":"Read the order. If the text is toast, print Warm; otherwise print Cold. Do not add an input prompt.","help":"Use == to check the text. Align the headers and indent both print lines.","starter":"order = input()\n","tests":[{"input":"toast","output":"Warm"},{"input":"fruit","output":"Cold"}],"sample":"order = input()\nif order == \"toast\":\n    print(\"Warm\")\nelse:\n    print(\"Cold\")","topic":"Reading input and running exactly one branch","id":"q18-s2","phase":"Targeted practice"},{"id":"extra-read","phase":"Targeted practice","type":"type","title":"Type a read-and-show line","body":"Type this line. The inside command runs first.","sample":"print(input())","topic":"Input and output"},{"id":"extra-type","phase":"Targeted practice","type":"mc","title":"Pick the whole number","body":"Which expression turns read text into a whole number?","choices":["print(entry)","int(entry)","entry == 5","input(entry)"],"correct":1,"topic":"Data types"},{"id":"extra-index","phase":"Targeted practice","type":"blank","title":"Choose the last index","body":"In [\"spade\", \"seed\", \"pot\", \"tag\"], type the index that reads \"tag\".","answers":["3"],"help":"Start counting from zero.","topic":"Lists and indexes"},{"id":"extra-count","phase":"Targeted practice","type":"type","title":"Type a list count","body":"Type this line. Notice the two closing parentheses.","sample":"print(len(books))","topic":"List length"},{"id":"extra-boundary","phase":"Targeted practice","type":"mc","title":"Test exactly at the limit","body":"A discount starts at age 12. Which condition includes 12 and all higher ages?","choices":["age > 12","age == 12","age >= 12","age \u003c 12"],"correct":2,"topic":"Comparisons"},{"id":"public-transfer-rule","type":"code","phase":"Build","topic":"Decisions","title":"Set a new team rule","body":"Read an integer score. If it is at least 10, show Go. Otherwise show Wait.","starter":"score = int(input())\n","tests":[{"input":"9","output":"Wait"},{"input":"10","output":"Go"},{"input":"13","output":"Go"}],"sample":"points = int(input())\nif points >= 3:\n    print(\"Ready\")\nelse:\n    print(\"Try again\")","help":"Use >= for at least, then indent a print() under each branch.","zh":"读取整数分数，10 分或以上显示 Go，否则显示 Wait。"},{"id":"explain-your-syntax","type":"reflect","phase":"Explain","topic":"Programming","title":"Explain one line you used today","body":"Pick one line from a program you tried. Say what job that line does, not just what it reads. Use something you saw when you ran your program as a clue.","prompts":["This line tells Python to ___. I noticed because ___.","If I took this line out, ___ would happen instead.","I know this line is doing its job because when I tried ___, I saw ___."],"zh":"选一行你实际运行过的代码。用自己的话说明它让电脑做什么，然后说出你看到的一个结果。句型：这一行让 Python___，我知道是因为我运行时看到了___。如果去掉这一行，___会改变。","prompt":"What does this line do, and what would change without it?","keywords":["Read input — take in what someone types","Store or change a value — give a value a name or update it","Make a decision — choose what runs next","Show output — display the result","Evidence — something you saw when you ran or tested the code"],"examples":["This line shows the final message. I know because the program still ran when I hid the line, but there was nothing on the screen.","This line decides which message to show. Changing my input took me to the other branch, so I saw a different message."],"help":"Read it as an instruction to the computer, in your own words. To make your explanation stronger, connect the instruction to something you can predict, see, or test."},{"id":"teacher-check","type":"finish","phase":"Show","topic":"Teacher check-in","title":"Show one thing you can do","body":"Show one program you ran and explain one line to your teacher.","prompts":["My program …","I used … so that …","I tested it with … and it showed …"],"zh":"展示一个你运行的程序，并向老师解释其中一行。"}]};</script>
