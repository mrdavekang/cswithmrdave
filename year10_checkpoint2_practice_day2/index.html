cks":[{"label":"Shell evidence","text":"Capture the entered number and its result from the Shell. One image is fine if it shows both tests."}]}},"rows":[{"id":"do-now","stage":"Do Now","title":"Count and index","minutes":5,"cue":"Screens up","section":"A","marks":2,"text":["Open the Session 2 Practice EAD in Word and save a named copy.","Read the mini list for 01.1. Then open the practice starter and look at the printed menu for 01.2. You do not need to run it yet."],"code":"shelves = [12, 18, 24]","label":"01.1 Count and index","prompt":"How many items are in shelves? What is its final valid index?","help":"Start counting positions at 0.","response":["Number of items","Final valid index"],"items":[{"label":"01.2 Read the menu","marks":1,"prompt":"Which menu option would you choose to replace the first donation amount? Give the option number.","response":["Menu option number"]}]},{"id":"types","stage":"Types of Learning","title":"One focus for this lesson","minutes":3,"cue":"Screens up","text":["Use the Do Now to choose your focus: recall what an index means, trace a loop, or explain why the program checks a count first."],"label":"Types of Learning","prompt":"What will you practise today, and what in your first answer led to that choice?","help":"I chose ___ because in 01.1 I ___.","response":["My focus and reason:"]},{"id":"predict","stage":"Main Task 1","title":"Predict and run a short loop","minutes":10,"cue":"Pause before Run","section":"A","marks":2,"text":["Read the shelf example. Type your two predicted lines in 01.3 before running it.","Run the worked example. Copy the actual output into the second box. Then answer 01.4 without running it again."],"code":"shelves = [12, 18, 24]\nrequested = 2\nfor index in range(requested):\n    print(index, shelves[index])","demo":true,"label":"01.3 Predict and check","prompt":"Before running the code, predict both output lines. Run it and copy the actual output into the second box.","help":"","response":["My prediction"," e the loop.","help":"Think about the first allowed count and the largest allowed count.","response":["Allowed range","Why the check comes first"]},{"id":"modify","stage":"Main Task 2","title":"Modify option 5 in IDLE","minutes":12,"cue":"Screens up","section":"C","marks":5,"text":["Open Book_Donation_Tracker_Day2_Starter.py in the IDLE Editor. Save As Book_Donation_Tracker_Day2_Work.py.","Find the option 5 branch. Leave its input line in place. Replace the placeholder print with your check, loop and out-of-range message.","Copy the whole amended option 5 branch into 03.2 as text. Stop before the final print that finishes the program."],"label":"03.2 Amended source code","prompt":"Paste the whole option 5 branch, including its opening elif and input line. Keep the indentation intact.","help":"Use the print pattern from option 1. Check that the code for a valid count and the code for an invalid count are in separate branches.","response":["Source code from the IDLE Editor"]},{"id":"test","stage":"Main Task 2","title":"Run two tests and capture evidence","minutes":9,"cue":"Screens up · predict before you run","section":"C","marks":4,"text":["In 03.3, predict what option 5 will do for requests of 2 and 0.","Start a fresh run. Choose 5 and enter 2. Choose 5 again and enter 0. Leave the menu visible for your capture, then choose 0 to exit.","Paste one or two readable Shell captures in 03.3. Then use your evidence to answer 03.4."],"label":"03.3 Shell test evidence","prompt":"Predict the index and value pairs for input 2 and the message for input 0. Then run both tests and paste the Shell evidence.","help":"Capture each input and its result. An image of the Editor does not show what the program did.","response":["Prediction for input 2","Prediction for input 0","Shell capture for input 2 or both tests","Shell capture for input 0"],"items":[{"label":"03.4 Check the menu","marks":1,"prompt":"What shows the menu is back after the input 0 test?","response":["What I saw in the const esc = val => String(val).replace(/[&<>"']/g, s => ({
  '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
}[s]));
const p = val => '<p>' + esc(val) + '</p>';
const lead = (label, val) => '<p><strong>' + esc(label) + '</strong> ' + esc(val) + '</p>';
const list = (items, ordered = false) => {
  const tag = ordered ? 'ol' : 'ul';
  return '<' + tag + ' class="step-points">' + items.map(s => '<li>' + esc(s) + '</li>').join('') + '</' + tag + '>';
};
const icons = {
  read: '<path d="M12 6.5C9.5 4.8 5.9 4.2 3 5v13c3-.8 6.6-.2 9 1.5 2.4-1.7 6-2.3 9-1.5V5c-2.9-.8-6.5-.2-9 1.5ZM12 7v12"/>',

  ead: '<path d="m5 15-1 5 5-1L20 8l-4-4L5 15ZM14 6l4 4M5 15l4 4"/>'
};
const badge = kind => '<span class="badge badge-' + kind + '" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + icons[kind] + '</svg></span>';
const code = source => {
  const tokens = /"[^"\n]*"|\b(?:for|in|if|else|elif|print|range|len)\b|\b\d+\b/g;
  let from = 0, html = '';
  for (const token of source.matchAll(tokens)) {
    html += esc(source.slice(from, token.index));
    const kind = token[0].startsWith('"') ? 'text' : /^\d+$/.test(token[0]) ? 'number' : 'word';
    html += '<span class="token-' + kind + '">' + esc(token[0]) + '</span>';
    from = token.index + token[0].length;
  }
  return '<pre tabindex="0" aria-label="Python code"><code>' + html + esc(source.slice(from)) + '</code></pre>';

const stages = steps.filter((s, i) => i === 0 || s.stage !== steps[i - 1].stage);
function render(focus = false) {
  const route = location.hash.slice(1) || 'start';
  const index = Math.max(0, steps.findIndex(s => s.id === route));
  const s = steps[index], previous = steps[index - 1], next = steps[index + 1];
  const label = [s.stage, s.section ? 'Section ' + s.section : '', s.id === 'start' ? '' : s.ref].filter(Boolean);
  const currentStep = 'Step ' + (index + 1) + ' of ' + steps.length;
  $('step-bar').innerHTML = '<div class="progress-wrap"><span>' + currentStep + '</span><progress max="' + steps.length +
    '" value="' + (index + 1) + '" aria-label="Lesson position"></progress></div><details class="stage-menu"><summary>Lesson stages</summary>' +
    '<nav aria-label="Jump to a lesson stage">' + stages.map(first => '<a href="#' + first.id + '"' +
      (first.stage === s.stage ? ' aria-current="step"' : '') + '>' + esc(first.stage) + '</a>').join('') + '</nav></details>';
  const boxPath = s.ref + ' · ' + s.fields.join(' / ');
  const railPath = s.id === 'find-branch' ? s.ref + ' · Nothing to paste yet' : boxPath;
  const word = '<section class="card ead-card" data-ead aria-labelledby="ead-title">' +
    '<div class="card-heading">' + badge('ead') + '<div><h2 id="ead-title">Answer in your Word EAD</h2>' +
    '<p class="ead-location">' + esc(boxPath) + '</p></div></div>' +
    (s.instructions.length > 1 ? list(s.instructions, true) : p(s.instructions[0])) + '</section>';
  const demo = s.demo ? '<section class="demo" aria-labelledby="run-title"><h2 id="run-title">Check after predicting</h2>' +
    '<p>Write your prediction in Word first. Only this short example runs here.</p>' +
    '<button id="run" type="button">I’ve written my prediction · Run the code</button>' +
    '<p id="result-status" role="status"></p><pre id="result" tabindex="0" aria-label="Example output" hidden><samp></samp></pre></section>' : '';
  const heading = s.id === 'start' ? '' : '<p class="eyebrow">' + esc([...new Set(label)].join(' · ')) +
    '</p><h1>' + esc(s.title) + '</h1>';
  $('lesson').innerHTML = heading + '<div class="flow">' + s.content() + word + demo + '</div>';
  $('pager').innerHTML = '<div class="wrap pager-inner">' +
    (previous ? anchor('#' + previous.id, '← Back', 'button secondary prev') : '<span class="prev"></span>') +
    '<div class="rail-ead"><strong>Answer in your Word EAD</strong><span>' + esc(railPath) + '</span></div>' +
    (next ? anchor('#' + next.id, s.id === 'start' ? 'Start Do Now →' :
      s.id === 'extension' ? 'Go to Learning Pit Stop →' : 'Next →', 'button next') :
      anchor('#start', 'Lesson start', 'button secondary next')) + '</div>';

  if (focus) { window.scrollTo(0, 0); $('lesson').focus({preventScroll:true}); }
}

function load(src) {
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = src;
    script.onload = resolve;
    script.onerror = () => { script.remove(); reject(Error('Local Python files could not be loaded.')); };
    document.head.append(script);
  });
}
let python, running = false;
async function runExample(source) {
  if (running) return;
  running = true;
  const button = $('run'), result = $('result'), status = $('result-status');
  button.disabled = true; result.hidden = true;
  status.textContent = 'Running the example…';
  try {
    python ||= (async () => {
      if (!window.Sk) await load('vendor/skulpt.min.js');
      if (!window.Sk.builtinFiles) await load('vendor/skulpt-stdlib.js');
      return window.Sk;
    })().catch(error => { python = null; throw error; });
    const sk = await python;
    let output = '';
    sk.configure({__future__:sk.python3, execLimit:2000, output:chunk => { output += chunk; },
      read:name => sk.builtinFiles.files[name]});
    await sk.misceval.asyncToPromise(() => sk.importMainWithBody('<example>', false, source, true));
    result.querySelector('samp').textContent = output;
    result.hidden = false;
    status.textContent = 'Copy the output below into 01.3 · What actually printed in your Word EAD.';
    button.textContent = 'Run the code again';
  } catch {
    status.textContent = 'The example could not run here. Copy the question’s code into a new IDLE file and run it there. Record the output in 01.3.';
  } finally {
    running = false; button.disabled = false;
  }
}

document.querySelector('.skip').onclick = event => {
  event.preventDefault();
  $('lesson').focus();
  $('lesson').scrollIntoView({block:'start'});
};
window.addEventListener('hashchange', () => render(true));

if (typeof ResizeObserver !== 'undefined') {
  // Reserve enough space for long destinations when they wrap on smaller screens.
  const pager = $('pager');
  new ResizeObserver(() => {
    document.documentElement.style.setProperty('--pager-height', pager.getBoundingClientRect().height + 'px');
  }).observe(pager);
}
