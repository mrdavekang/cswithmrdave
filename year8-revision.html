<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Year 8 Computing Revision · Slide Practice</title>
<style>
:root{
  --bg:#f5f5f7;--panel:#ffffffcc;--ink:#1d1d1f;--muted:#6e6e73;--line:#d9d9de;
  --blue:#0071e3;--green:#34c759;--orange:#ff9f0a;--red:#ff3b30;--purple:#af52de;
  --shadow:0 24px 70px rgba(0,0,0,.10);--soft:0 12px 38px rgba(0,0,0,.08);
  --radius:34px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,Arial,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 8% 14%, rgba(0,113,227,.18), transparent 30%),
    radial-gradient(circle at 88% 10%, rgba(175,82,222,.15), transparent 28%),
    radial-gradient(circle at 80% 82%, rgba(52,199,89,.13), transparent 30%),
    linear-gradient(180deg,#fff,var(--bg));
}
.blob{position:fixed;border-radius:999px;filter:blur(4px);opacity:.6;z-index:0;animation:float 9s ease-in-out infinite alternate;pointer-events:none}
.b1{width:260px;height:260px;background:#cfe7ff;left:-70px;top:18%;animation-delay:.3s}.b2{width:220px;height:220px;background:#ead7ff;right:2%;top:7%;animation-delay:1.2s}.b3{width:240px;height:240px;background:#d9f6df;right:8%;bottom:-80px;animation-delay:2s}
@keyframes float{from{transform:translateY(0) scale(1)}to{transform:translateY(-26px) scale(1.08)}}
.app{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:20px;gap:14px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 16px;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.8);border-radius:24px;box-shadow:0 8px 28px rgba(0,0,0,.06);backdrop-filter:blur(22px)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}.orb{width:38px;height:38px;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--purple));box-shadow:0 12px 26px rgba(0,113,227,.25);display:grid;place-items:center;color:white;font-weight:900}.brand strong{font-size:15px}.brand span{display:block;font-size:12px;color:var(--muted);margin-top:2px}.progress{display:flex;align-items:center;gap:10px;min-width:min(520px,45vw)}.track{height:10px;flex:1;background:#e8e8ed;border-radius:999px;overflow:hidden}.fill{height:100%;width:0%;background:linear-gradient(90deg,var(--blue),var(--purple),var(--green));border-radius:999px;transition:width .35s cubic-bezier(.2,.8,.2,1)}.badge{font-size:13px;font-weight:800;background:white;border:1px solid var(--line);border-radius:999px;padding:8px 12px;white-space:nowrap}.main{height:100%;display:grid;grid-template-columns:280px 1fr;gap:14px;min-height:0}.rail{background:rgba(255,255,255,.58);border:1px solid rgba(255,255,255,.8);border-radius:30px;box-shadow:var(--soft);backdrop-filter:blur(24px);padding:14px;overflow:auto}.rail-title{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;font-weight:900;color:var(--muted);margin:6px 8px 12px}.navbtn{width:100%;display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;text-align:left;border:1px solid transparent;background:transparent;border-radius:18px;padding:12px 10px;margin-bottom:6px;color:var(--muted);cursor:pointer;transition:.2s ease}.navbtn:hover,.navbtn.active{background:white;border-color:#ececf0;color:var(--ink);box-shadow:0 12px 24px rgba(0,0,0,.07);transform:translateY(-1px)}.n-dot{width:13px;height:13px;margin-top:4px;border-radius:999px;background:#c7c7cc}.n-dot.done{background:var(--green)}.navbtn strong{display:block;font-size:13px}.navbtn small{display:block;font-size:11px;line-height:1.3;color:var(--muted);margin-top:3px}.stage{position:relative;overflow:hidden;border-radius:36px;background:rgba(255,255,255,.48);border:1px solid rgba(255,255,255,.8);box-shadow:var(--shadow);backdrop-filter:blur(26px)}.slide{height:100%;display:none;padding:34px;overflow:auto}.slide.active{display:grid;grid-template-rows:auto 1fr;gap:22px;animation:slideIn .42s cubic-bezier(.16,1,.3,1)}@keyframes slideIn{from{opacity:0;transform:translateX(34px) scale(.985)}to{opacity:1;transform:none}}
.hero-slide{place-items:center;text-align:center;grid-template-rows:1fr}.hero-slide .hero-inner{max-width:950px}.super{display:inline-flex;gap:9px;align-items:center;background:white;border:1px solid var(--line);border-radius:999px;padding:10px 14px;font-size:13px;font-weight:900;color:var(--muted);box-shadow:0 10px 24px rgba(0,0,0,.05);margin-bottom:20px}.hero-title{font-size:clamp(56px,8vw,118px);letter-spacing:-5px;line-height:.88;margin-bottom:22px}.hero-text{font-size:22px;line-height:1.55;color:var(--muted);max-width:820px;margin:0 auto 28px}.hero-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}.micro{background:white;border:1px solid var(--line);border-radius:26px;padding:18px;text-align:left;box-shadow:0 12px 32px rgba(0,0,0,.06);transition:.2s}.micro:hover{transform:translateY(-4px) scale(1.01);box-shadow:0 18px 44px rgba(0,0,0,.10)}.micro span{font-size:28px}.micro strong{display:block;margin:8px 0 4px}.micro p{font-size:13px;color:var(--muted);line-height:1.45}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}.topic-pill{display:inline-flex;align-items:center;gap:8px;padding:9px 12px;border-radius:999px;background:white;border:1px solid var(--line);font-size:12px;font-weight:900;color:var(--muted);margin-bottom:14px}.slide h1{font-size:clamp(36px,4.8vw,74px);line-height:.94;letter-spacing:-2.8px;max-width:920px}.slide-sub{font-size:18px;line-height:1.55;color:var(--muted);max-width:850px;margin-top:12px}.page-num{font-size:13px;font-weight:900;color:var(--muted);background:white;border:1px solid var(--line);border-radius:999px;padding:9px 12px;white-space:nowrap}.content-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}.glass{background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.94);border-radius:30px;padding:24px;box-shadow:0 14px 40px rgba(0,0,0,.07)}.glass h2{font-size:22px;margin-bottom:12px}.glass p,.glass li{font-size:16px;line-height:1.7;color:var(--muted)}.glass ul{padding-left:22px;margin-top:8px}.sample{background:#f8f8fb;border:1px solid #ececf1;border-radius:22px;padding:16px;margin-top:14px}.sample-title{font-size:12px;text-transform:uppercase;letter-spacing:1px;font-weight:900;color:var(--muted);margin-bottom:8px}.code{font-family:"SFMono-Regular",Consolas,monospace;background:#111827;color:#f9fafb;border-radius:18px;padding:16px;line-height:1.65;white-space:pre-wrap;font-size:14px;overflow:auto}.qcard{background:white;border:1px solid #ececf0;border-radius:30px;padding:24px;box-shadow:0 16px 46px rgba(0,0,0,.08)}.qcard h2{font-size:24px;margin-bottom:12px}.prompt{font-size:18px;line-height:1.75;white-space:pre-wrap;background:#fbfbfd;border:1px solid #ececf1;border-radius:22px;padding:18px;margin-bottom:14px}.answer{width:100%;border:1px solid var(--line);border-radius:18px;padding:14px 15px;font:inherit;font-size:16px;outline:none;background:#fff;transition:.18s}.answer:focus{border-color:#8fc4ff;box-shadow:0 0 0 5px rgba(0,113,227,.10)}textarea.answer{min-height:130px;font-family:"SFMono-Regular",Consolas,monospace;line-height:1.55}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{border:1px solid var(--line);background:#fff;border-radius:18px;padding:14px;cursor:pointer;text-align:left;font-weight:800;transition:.18s}.choice:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(0,0,0,.08)}.choice.selected{border-color:var(--blue);background:#eef6ff}.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{border:1px solid var(--line);background:white;border-radius:18px;padding:13px 16px;font-size:14px;font-weight:900;cursor:pointer;transition:.18s;box-shadow:0 8px 20px rgba(0,0,0,.04)}.btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(0,0,0,.08)}.btn.primary{background:var(--ink);border-color:var(--ink);color:white}.btn.next{background:var(--blue);border-color:var(--blue);color:white}.btn.good{background:var(--green);border-color:var(--green);color:white}.feedback{display:none;margin-top:14px;border-radius:18px;padding:14px 16px;font-size:14px;line-height:1.5}.feedback.ok{display:block;background:#ecfdf3;border:1px solid #b7efc5;color:#186a32}.feedback.no{display:block;background:#fff1f0;border:1px solid #ffc6c2;color:#a32119}.feedback.hint{display:block;background:#fff8e8;border:1px solid #ffe1a3;color:#8a5200}.pv{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;border-radius:18px;border:1px solid var(--line);background:#fff;margin-top:12px}.pv th,.pv td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:12px;text-align:center;font-weight:900}.pv th:last-child,.pv td:last-child{border-right:0}.pv tr:last-child td{border-bottom:0}.pv th{background:#f5f5f7;color:#4b5563}.pv .label{text-align:left;background:#fbfbfd;color:#6b7280}.idle{grid-column:1/-1;background:white;border:1px solid #ececf0;border-radius:30px;overflow:hidden;box-shadow:0 16px 46px rgba(0,0,0,.08)}.idlebar{display:flex;align-items:center;justify-content:space-between;background:#f5f5f7;border-bottom:1px solid var(--line);padding:12px 16px;font-weight:900;color:var(--muted);font-size:13px}.dots{display:flex;gap:7px}.dotx{width:11px;height:11px;border-radius:999px;background:#ff5f57}.dotx:nth-child(2){background:#febc2e}.dotx:nth-child(3){background:#28c840}.codeinput{width:100%;min-height:240px;border:0;border-radius:0;background:#10121a;color:#f8fafc;padding:18px;font-family:"SFMono-Regular",Consolas,monospace;line-height:1.6;resize:vertical;outline:none}.output{min-height:95px;background:#080b13;color:#d1fae5;border-top:1px solid #1f2937;padding:16px;font-family:"SFMono-Regular",Consolas,monospace;white-space:pre-wrap;font-size:13px}.bottom{display:flex;align-items:center;justify-content:space-between;gap:14px}.kbd{font-size:12px;color:var(--muted)}.confetti{position:fixed;width:8px;height:12px;top:-20px;z-index:10;border-radius:3px;animation:fall 1.2s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.1}}
@media(max-width:980px){html,body{overflow:auto}.app{height:auto}.main{grid-template-columns:1fr}.rail{display:none}.stage{min-height:760px}.content-grid,.hero-cards{grid-template-columns:1fr}.progress{min-width:0;flex:1}.hero-title{font-size:58px;letter-spacing:-3px}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="orb">Y8</div><div><strong>Computing Revision Studio</strong><span>One idea per slide · hints only · saved work</span></div></div>
    <div class="progress"><span class="badge" id="score">0 / 15 correct</span><div class="track"><div class="fill" id="fill"></div></div><span class="badge" id="page">Slide 1</span></div>
  </header>
  <section class="main">
    <aside class="rail" id="rail"></aside>
    <main class="stage" id="stage"></main>
  </section>
  <footer class="bottom"><span class="kbd">Tip: use ← and → to move slides.</span><div><button class="btn" onclick="resetAll()">Reset</button></div></footer>
</div>
<script>
const KEY='y8_apple_slide_revision_v1';
const lessons=[
{kind:'cover'},
{topic:'Binary → Denary',title:'Binary is place value.',sub:'Each 1 switches a place value on. Add the switched-on values.',read:'Binary uses only 0 and 1. In an 8-bit number, the columns are 128, 64, 32, 16, 8, 4, 2, 1.',table:'8bit',sample:'Sample only:\n00001011\nSwitched on: 8 + 2 + 1\nDenary: 11',q:'Convert this binary number into denary.\n\n00110110\n\nWrite the place values you add.',type:'text',answers:['54'],hint:'Look at the 8-bit table. Add the values under the 1s only.'},
{topic:'Binary → Denary',title:'Working earns confidence.',sub:'Write the addition before the final answer.',read:'A clear method is to place the values above the bits, then add only the values under the 1s.',table:'8bit',sample:'Sample only:\n00100100\nSwitched on: 32 and 4\nWorking: 32 + 4 = 36',q:'Convert this binary number into denary.\n\n01001001\n\nWrite the addition before the answer.',type:'text',answers:['73'],hint:'Check the 64, 8 and 1 columns carefully.'},
{topic:'Denary → Binary',title:'Denary breaks into binary columns.',sub:'Try each column from left to right.',read:'Start at 128. If the value fits, write 1 and subtract it. If it does not fit, write 0. Continue to 1.',table:'8bitBlank',sample:'Sample only: 42\n128 no → 0\n64 no → 0\n32 yes → 1, remainder 10\n16 no → 0\n8 yes → 1, remainder 2\n4 no → 0\n2 yes → 1, remainder 0\n1 no → 0\nAnswer: 00101010',q:'Convert this denary number into 8-bit binary.\n\n93\n\nUse all eight place values.',type:'text',answers:['01011101'],hint:'128 is too large. 64 fits. Then continue with the remainder.'},
{topic:'Denary → Binary',title:'8-bit means eight digits.',sub:'Leading zeroes still count.',read:'When the question asks for 8-bit binary, do not remove the zeros at the front. For example, 5 becomes 00000101.',table:'8bitBlank',sample:'Sample only: 17\n16 + 1 are needed.\nPattern: 00010001\nNotice the zeros at the front.',q:'Convert this denary number into 8-bit binary.\n\n34\n\nInclude leading zeroes.',type:'text',answers:['00100010'],hint:'34 is made from 32 and 2. Then fill the other places with 0.'},
{topic:'Binary ↔ Hexadecimal',title:'Hex uses nibbles.',sub:'One hexadecimal digit equals four binary bits.',read:'A group of 4 bits is called a nibble. Convert each nibble separately.',table:'hexMap',sample:'Sample only:\n1010 0011\n1010 = A\n0011 = 3\nHex: A3',q:'Convert this binary number into hexadecimal.\n\n1110 0101\n\nSplit it into two nibbles first.',type:'text',answers:['E5'],hint:'Convert 1110, then convert 0101.'},
{topic:'Hexadecimal → Binary',title:'Each hex digit becomes 4 bits.',sub:'Do not shorten the 4-bit groups.',read:'Hexadecimal uses 0–9 and A–F. A=10, B=11, C=12, D=13, E=14, F=15.',table:'hexMap',sample:'Sample only:\nB4\nB = 1011\n4 = 0100\nBinary: 1011 0100',q:'Convert this hexadecimal number into binary.\n\n3A\n\nWrite each hex digit as exactly 4 bits.',type:'text',answers:['00111010','0011 1010'],hint:'3 is 0011. A is 1010.'},
{topic:'Python Basics',title:'print() displays output.',sub:'Text needs quotation marks.',read:'The print() function sends information to the screen. Strings must be placed inside quotation marks.',sample:'Sample only:\nprint("Welcome")\n\nOutput:\nWelcome',q:'Which line correctly displays this message?\n\nHello Year 8',type:'mcq',choices:['print(Hello Year 8)','print "Hello Year 8"','print("Hello Year 8")','display("Hello Year 8")'],answers:['print("Hello Year 8")'],hint:'Look for print, brackets, and quotation marks.'},
{topic:'Python Data Types',title:'Data types describe values.',sub:'Text, whole number, decimal, or True/False?',read:'String = text. Integer = whole number. Float = decimal number. Boolean = True or False.',sample:'Sample only:\n"Blue" → string\n12 → integer\n4.75 → float\nFalse → Boolean',q:'Look at the value below.\n\n8.5\n\nWhat is its data type?',type:'mcq',choices:['String','Integer','Float','Boolean'],answers:['Float'],hint:'A value with a decimal point is not an integer.'},
{topic:'Python Variables',title:'Variables store values.',sub:'The name is on the left.',read:'A variable is a named storage location. In Python, the value on the right is stored in the variable on the left.',sample:'Sample only:\npoints = 25\n\nVariable name: points\nValue stored: 25',q:'Look at this Python line.\n\nscore = 12\n\nWhat is the variable name?',type:'text',answers:['score'],hint:'Look at the left side of the equals sign.'},
{topic:'Python Input',title:'input() asks the user.',sub:'Use int() when a number is needed.',read:'input() receives typed data as text first. Use int() when the answer should be treated as a whole number.',sample:'Sample only:\nlevel = int(input("Enter level: "))\n\nThe input is converted into an integer.',q:'Complete the missing function name.\n\nage = ___(input("Enter age: "))\n\nWhich function converts input into a whole number?',type:'text',answers:['int'],hint:'The function name has three letters and means integer.'},
{topic:'Combined Text + Variables',title:'A comma can combine output.',sub:'print() can display text and variables together.',read:'In beginner Python, you can use commas inside print() to display more than one item.',sample:'Sample only:\nname = "Mia"\nprint("Hello", name)\n\nOutput:\nHello Mia',q:'Look at this code.\n\nname = "Ravi"\nprint("Hello", name)\n\nWhat is displayed?',type:'text',answers:['Hello Ravi','hello ravi'],hint:'The text Hello appears first. Then the value stored in name appears.'},
{topic:'Python Selection',title:'Selection chooses a path.',sub:'if checks a condition.',read:'Selection lets a program decide what to do. if, elif and else are used to create different paths.',sample:'Sample only:\nmark = 75\nif mark >= 50:\n    print("Pass")\nelse:\n    print("Review")\n\nOutput: Pass',q:'Look at this code.\n\nscore = 45\nif score >= 50:\n    print("Pass")\nelse:\n    print("Review")\n\nWhat is displayed?',type:'text',answers:['Review','review'],hint:'Check whether 45 is greater than or equal to 50.'},
{topic:'Python Selection',title:'Comparisons ask questions.',sub:'Operators compare values.',read:'Common operators include == equal to, != not equal to, > greater than, < less than, >= greater than or equal to, <= less than or equal to.',sample:'Sample only:\nage < 13\nThis asks: is age less than 13?',q:'Which operator means not equal to?',type:'mcq',choices:['==','!=','>=','<='],answers:['!='],hint:'Equal to uses two equals signs. Not equal to uses an exclamation mark.'},
{topic:'Programming Task',title:'Build a tiny input program.',sub:'Use input, a variable, and print.',read:'A small program can ask the user for a value, store it in a variable, and then display a message using that variable.',sample:'Sample pattern only:\ncolour = input("Favourite colour? ")\nprint("You chose", colour)\n\nDo not copy this exactly. Use the task details.',q:'Programming task 1\n\nWrite a Python program that:\n1. asks the user to enter their name\n2. stores it in a variable called name\n3. prints Hello followed by the name\n\nUse the IDLE-style runner to test your program.',type:'code',answers:['name','input','print'],hint:'You need three parts: variable assignment, input(), and print().'},
{topic:'Programming Task',title:'Build a tiny selection program.',sub:'Use int(input()) and if/else.',read:'Selection programs often ask for a number, convert it using int(), then use if/else to decide what message to display.',sample:'Sample pattern only:\nlevel = int(input("Level? "))\nif level > 5:\n    print("High")\nelse:\n    print("Low")\n\nUse this pattern to think, not to copy.',q:'Programming task 2\n\nWrite a Python program that:\n1. asks the user to enter their age\n2. converts the age into an integer\n3. prints Child if the age is less than 13\n4. otherwise prints Teenager\n\nUse the IDLE-style runner to test your program.',type:'code',answers:['age','int','input','if','else','Child','Teenager'],hint:'You need age = int(input(...)), then an if age < 13 condition, then else.'}
];
let state={i:0,answers:{},done:{},choices:{}};try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
function compact(s){return norm(s).replace(/\s/g,'')}
function tableHTML(t){if(t==='8bit')return `<table class="pv"><tr><th class="label">Place value</th><th>128</th><th>64</th><th>32</th><th>16</th><th>8</th><th>4</th><th>2</th><th>1</th></tr><tr><td class="label">Binary digit</td><td>0</td><td>0</td><td>1</td><td>1</td><td>0</td><td>1</td><td>1</td><td>0</td></tr></table>`;
if(t==='8bitBlank')return `<table class="pv"><tr><th class="label">Place value</th><th>128</th><th>64</th><th>32</th><th>16</th><th>8</th><th>4</th><th>2</th><th>1</th></tr><tr><td class="label">Write 1 or 0</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr></table>`;
if(t==='hexMap')return `<table class="pv"><tr><th>Hex</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th><th>F</th></tr><tr><td class="label">Denary</td><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td><td>10</td><td>11</td><td>12</td><td>13</td><td>14</td><td>15</td></tr></table>`;return ''}
function renderRail(){document.getElementById('rail').innerHTML='<div class="rail-title">Revision Slides</div>'+lessons.map((l,idx)=>`<button class="navbtn ${idx===state.i?'active':''}" onclick="go(${idx})"><span class="n-dot ${state.done[idx]?'done':''}"></span><span><strong>${idx===0?'Start':('Q'+idx+' · '+l.topic)}</strong><small>${idx===0?'Mission briefing':l.title}</small></span></button>`).join('')}
function renderTop(){let correct=Object.values(state.done).filter(Boolean).length;let total=lessons.length-1;document.getElementById('score').textContent=`${correct} / ${total} correct`;document.getElementById('fill').style.width=(correct/total*100)+'%';document.getElementById('page').textContent=`Slide ${state.i+1} of ${lessons.length}`}
function go(i){saveInput();state.i=Math.max(0,Math.min(lessons.length-1,i));save();render()}
function next(){go(state.i+1)}function prev(){go(state.i-1)}
function render(){renderTop();renderRail();let l=lessons[state.i];let stage=document.getElementById('stage');if(l.kind==='cover'){stage.innerHTML=`<section class="slide hero-slide active"><div class="hero-inner"><div class="super">✨ Year 8 · Exam warm-up</div><h1 class="hero-title">One idea. One slide. One win.</h1><p class="hero-text">Move through each hidden slide. Read the tiny lesson, look at the sample, answer the question, then check. No answers are revealed — hints guide your thinking.</p><button class="btn next" onclick="next()">Start revision →</button><div class="hero-cards"><div class="micro"><span>🧮</span><strong>Number systems</strong><p>Use place values and nibbles to convert confidently.</p></div><div class="micro"><span>🐍</span><strong>Python basics</strong><p>Practise print, input, variables and data types.</p></div><div class="micro"><span>⚡</span><strong>Selection</strong><p>Use conditions to choose different paths.</p></div></div></div></section>`;return}
stage.innerHTML=`<section class="slide active"><div class="head"><div><div class="topic-pill">${state.i<14?'🧠':'🐍'} ${l.topic}</div><h1>${l.title}</h1><p class="slide-sub">${l.sub}</p></div><div class="page-num">Q${state.i} / 15</div></div><div class="content-grid"><div class="glass"><h2>Prerequisite reading</h2><p>${l.read}</p>${l.table?tableHTML(l.table):''}<div class="sample"><div class="sample-title">Thinking sample, not the answer</div><div class="code">${escapeHTML(l.sample||'')}</div></div></div><div class="qcard"><h2>Your turn</h2><div class="prompt">${escapeHTML(l.q)}</div>${answerArea(l,state.i)}<div class="btnrow"><button class="btn primary" onclick="check(${state.i})">Check</button><button class="btn" onclick="hint(${state.i})">Hint</button><button class="btn" onclick="prev()">← Back</button><button class="btn next" onclick="next()">Next →</button></div><div class="feedback" id="fb${state.i}"></div></div>${l.type==='code'?idleHTML(state.i):''}</div></section>`;loadInput();if(l.type==='code')runPython(state.i,true)}
function escapeHTML(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function answerArea(l,i){if(l.type==='mcq')return `<div class="choices">${l.choices.map(c=>`<button class="choice ${state.choices[i]===c?'selected':''}" onclick="pick(${i},'${escapeAttr(c)}',this)">${escapeHTML(c)}</button>`).join('')}</div>`;if(l.type==='code')return `<textarea class="answer codeans" id="ans${i}" spellcheck="false" placeholder="Write your Python code here..."></textarea>`;return `<input class="answer" id="ans${i}" placeholder="Type your answer here...">`}
function escapeAttr(s){return String(s).replace(/'/g,"&#39;").replace(/"/g,'&quot;')}
function idleHTML(i){return `<div class="idle"><div class="idlebar"><div class="dots"><span class="dotx"></span><span class="dotx"></span><span class="dotx"></span></div><span>Python IDLE-style runner</span><button class="btn good" onclick="runPython(${i})">Run code</button></div><textarea class="codeinput" id="code${i}" spellcheck="false"></textarea><div class="output" id="out${i}">Output will appear here.</div></div>`}
function loadInput(){let i=state.i,l=lessons[i];if(l.type==='text'||l.type==='code'){let el=document.getElementById('ans'+i);if(el)el.value=state.answers[i]||'';let code=document.getElementById('code'+i);if(code)code.value=state.answers[i]||''}}
function saveInput(){let i=state.i,l=lessons[i];if(!l)return;let el=document.getElementById('ans'+i);if(el)state.answers[i]=el.value;let code=document.getElementById('code'+i);if(code)state.answers[i]=code.value;save()}
function pick(i,c,btn){state.choices[i]=c;save();document.querySelectorAll('.choice').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected')}
function check(i){saveInput();let l=lessons[i];let value=l.type==='mcq'?state.choices[i]:(state.answers[i]||'');let ok=false;if(l.type==='code'){let c=value;ok=l.answers.every(a=>c.includes(a))}else{ok=l.answers.some(a=>compact(value)===compact(a))}let fb=document.getElementById('fb'+i);if(ok){state.done[i]=true;save();fb.className='feedback ok';fb.textContent='Correct — nice work. Move to the next slide.';celebrate()}else{fb.className='feedback no';fb.textContent='Not yet. Use the hint and the thinking sample, then try again.'}renderTop();renderRail()}
function hint(i){let fb=document.getElementById('fb'+i);fb.className='feedback hint';fb.textContent=lessons[i].hint}
function runPython(i,silent=false){let codeEl=document.getElementById('code'+i),ans=document.getElementById('ans'+i),out=document.getElementById('out'+i);if(!codeEl||!out)return;if(ans)ans.value=codeEl.value;state.answers[i]=codeEl.value;save();let code=codeEl.value;let lines=code.split(/\n/).map(x=>x.trim()).filter(Boolean);let vars={},output=[];let inputs=['Alex','12','15'];let ip=0;function val(x){x=x.trim();if(/^['"].*['"]$/.test(x))return x.slice(1,-1);if(vars[x]!==undefined)return vars[x];if(!isNaN(Number(x)))return Number(x);return x}try{for(let n=0;n<lines.length;n++){let line=lines[n];if(line.startsWith('#'))continue;if(line.includes('=')&&!line.startsWith('if ')){let [name,expr]=line.split(/=(.+)/).map(s=>s.trim());if(expr.startsWith('int(input'))vars[name]=parseInt(inputs[ip++]||'13');else if(expr.startsWith('input'))vars[name]=inputs[ip++]||'Alex';else vars[name]=val(expr)}else if(line.startsWith('print')){let inside=line.match(/print\((.*)\)/);if(inside){let parts=inside[1].split(',').map(p=>val(p));output.push(parts.join(' '))}}else if(line.startsWith('if ')){let cond=line.replace(/^if\s+/,'').replace(/:$/,'');let truth=false;let m=cond.match(/(\w+)\s*(<=|>=|==|!=|<|>)\s*(\d+)/);if(m){let left=Number(vars[m[1]]??0),op=m[2],right=Number(m[3]);truth=op=='<'?left<right:op=='>'?left>right:op=='>='?left>=right:op=='<='?left<=right:op=='=='?left==right:left!=right}let nextLine=lines[n+1]||'';let elseIndex=lines.findIndex((x,idx)=>idx>n&&x.startsWith('else'));if(truth&&nextLine.startsWith('print')){let inside=nextLine.match(/print\((.*)\)/);if(inside)output.push(inside[1].split(',').map(p=>val(p)).join(' '))}else if(!truth&&elseIndex>=0&&lines[elseIndex+1]?.startsWith('print')){let inside=lines[elseIndex+1].match(/print\((.*)\)/);if(inside)output.push(inside[1].split(',').map(p=>val(p)).join(' '))}break}}
out.textContent=output.length?output.join('\n'):'Program ran. No output yet.'}catch(e){out.textContent='Check syntax: '+e.message}}
function celebrate(){for(let i=0;i<28;i++){let d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=["#0071e3","#34c759","#ff9f0a","#af52de","#ff3b30"][i%5];d.style.animationDelay=(Math.random()*.35)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),1500)}}
function resetAll(){localStorage.removeItem(KEY);state={i:0,answers:{},done:{},choices:{}};render()}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()});
render();
</script>
</body>
</html>
