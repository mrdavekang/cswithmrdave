<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Year 9 · Two Programs Practical Checkpoint</title><link rel="stylesheet" href="styles.css"></head>
<body><header><div><span class="eyebrow">TENBY · YEAR 9 COMPUTING</span><h1 id="heading"></h1><p id="subtitle"></p></div><label><span id="languageLabel">Language</span><select id="language"><option value="en">English</option><option value="zh">English + 中文</option><option value="ms">English + Bahasa Melayu</option></select></label></header>
<main><section class="intro"><div><strong id="purpose"></strong><p id="intro"></p></div><button id="helpButton" aria-expanded="false">Editor help</button></section>
<section id="migrationBanner" class="intro" hidden><p id="migrationNote"></p><button id="downloadEarlier"></button></section>
<section id="help" hidden><h2 id="helpTitle"></h2><ol id="helpSteps"></ol><p id="helpRuntime"></p><button id="scaffold"></button></section>
<div class="tabs" role="tablist" aria-label="Main tasks"><button id="practiceTab" role="tab" aria-selected="true" aria-controls="workpanel"></button><button id="createTab" role="tab" aria-selected="false" aria-controls="workpanel"></button></div>
<div class="build-layout" id="workpanel" role="tabpanel" aria-labelledby="practiceTab"><aside class="guide-panel" aria-label="Current task card"><div class="guide-top"><label><span id="chooseCard"></span><select id="stageSelect"></select></label><span id="stageCount"></span></div><article><h2 id="stageTitle"></h2><p id="practiceNotice" class="practice-notice"></p><dl class="edit-contract"><div><dt id="fileKey"></dt><dd><code id="stageFile"></code></dd></div><div><dt id="actionKey"></dt><dd id="stageAction"></dd></div><div><dt id="whereKey"></dt><dd id="stageWhere"></dd></div></dl><p id="stageGoal" class="goal"></p><button id="findPlace"></button><p id="focusNote" class="focus-note"></p><div id="tutorBox"><p id="tutorText" class="tutor-text"></p><div class="tutor-nav"><button id="previousExplanation"></button><button id="nextExplanation"></button></div></div><ol id="stageSteps"></ol><details id="reference"><summary id="useCode"></summary><p id="referenceNote"></p><pre class="reference-code"><code id="stageCode"></code></pre></details><p id="stageSuccess" class="success"></p></article><nav class="guide-nav"><button id="previousCard"></button><button id="nextCard" class="primary"></button></nav><p id="keepProgram" class="keep-note"></p><details id="criteriaBox" class="creation-brief" hidden><summary id="criteriaTitle"></summary><ul id="stageCriteria"></ul></details><details><summary id="learningTitle"></summary><p id="learningText"></p></details></aside>
<section class="workspace" aria-label="Current Python file"><div class="taskbar"><div><span id="fileKind" class="eyebrow"></span><h2><code id="currentFile"></code></h2></div><span id="saveState" role="status"></span></div><div class="filebar"><label><span id="fileLabel"></span><input id="filename" maxlength="80" autocomplete="off" autocorrect="off" spellcheck="false"></label></div><div class="toolbar"><div><button id="indent"></button><button id="dedent"></button><button id="undo"></button><button id="redo"></button></div><div><button id="open"></button><button id="download"></button><button id="run" class="primary"></button><button id="stop" disabled></button></div></div>
<div class="panes"><section class="codepane"><h2 id="codeTitle"></h2><div class="editor-shell"><pre id="numbers" aria-hidden="true">1</pre><div class="editor-inner"><pre id="highlight" aria-hidden="true"></pre><textarea id="editor" maxlength="20000" aria-label="Python code editor" wrap="off" autocorrect="off" autocapitalize="off" autocomplete="off" spellcheck="false" inputmode="text" translate="no" data-gramm="false"></textarea></div></div><div class="position"><span id="cursor"></span><span id="indentHint"></span></div></section><section class="consolepane"><div class="console-title"><div><h2 id="consoleTitle"></h2><span id="runSource" class="console-source"></span></div><button id="clear"></button></div><pre id="console" role="log" aria-live="polite" aria-relevant="additions text"></pre><form id="inputForm" hidden><p id="inputHint"></p><label id="inputLabel" for="answer"></label><div><input id="answer" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send"><button class="primary" id="send"></button></div></form><p id="runState" role="status"></p></section></div></section></div>
<section id="finish" class="submission-guide" hidden><h2 id="finishTitle"></h2><p id="finishChecks"></p><details><summary id="individualTitle"></summary><p id="individualText"></p></details><details open><summary id="submitTitle"></summary><p id="submitSave"></p><div class="submit-routes"><p id="submitOwn"></p><p id="submitShared"></p></div><p id="submitIPad"></p><p id="submitPaper"></p></details></section><footer><span id="footer"></span></footer></main>
<input id="fileInput" type="file" accept=".py,text/plain" hidden><dialog id="replaceDialog"><h2 id="replaceTitle"></h2><p id="replaceText"></p><div><button id="cancelReplace"></button><button id="confirmReplace"></button></div></dialog>
<script src="editor-core.js"></script><script src="lesson-data.js"></script><script src="python-runtime.js"></script><script src="app.js"></script></body></html>
