<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Worked Smart Badge flowchart</title>
  <desc id="desc">A top-to-bottom flowchart: Start, display welcome icon, input Button A pressed, display student initials, End. Ovals are used for Start and End, parallelograms for input and output, and arrows show the order.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#171717"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="5" dy="6" stdDeviation="0" flood-color="#171717" flood-opacity="1"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="#fff"/>
  <rect x="24" y="24" width="1152" height="852" rx="24" fill="#fff" stroke="#171717" stroke-width="5"/>
  <text x="60" y="78" font-family="Raleway, Arial, sans-serif" font-size="34" font-weight="800" fill="#171717">SMART BADGE — WORKED FLOWCHART</text>
  <text x="60" y="112" font-family="Raleway, Arial, sans-serif" font-size="20" fill="#555">Follow the arrows. Read the label beside each standard symbol.</text>

  <g font-family="Raleway, Arial, sans-serif" text-anchor="middle" fill="#171717">
    <ellipse cx="510" cy="175" rx="145" ry="46" fill="#fff" stroke="#171717" stroke-width="5" filter="url(#shadow)"/>
    <text x="510" y="184" font-size="30" font-weight="800">START</text>

    <line x1="510" y1="228" x2="510" y2="284" stroke="#171717" stroke-width="6" marker-end="url(#arrow)"/>

    <path d="M330 310 H690 L650 405 H290 Z" fill="#f0eafa" stroke="#171717" stroke-width="5" filter="url(#shadow)"/>
    <text x="490" y="350" font-size="25" font-weight="800">DISPLAY</text>
    <text x="490" y="382" font-size="23">welcome icon</text>

    <line x1="510" y1="415" x2="510" y2="470" stroke="#171717" stroke-width="6" marker-end="url(#arrow)"/>

    <path d="M330 495 H690 L650 590 H290 Z" fill="#e9f2fb" stroke="#171717" stroke-width="5" filter="url(#shadow)"/>
    <text x="490" y="535" font-size="25" font-weight="800">INPUT</text>
    <text x="490" y="567" font-size="23">Button A pressed</text>

    <line x1="510" y1="600" x2="510" y2="655" stroke="#171717" stroke-width="6" marker-end="url(#arrow)"/>

    <path d="M330 680 H690 L650 775 H290 Z" fill="#e8f6ee" stroke="#171717" stroke-width="5" filter="url(#shadow)"/>
    <text x="490" y="720" font-size="25" font-weight="800">DISPLAY</text>
    <text x="490" y="752" font-size="23">student initials</text>

    <line x1="510" y1="785" x2="510" y2="825" stroke="#171717" stroke-width="6" marker-end="url(#arrow)"/>
    <ellipse cx="510" cy="842" rx="145" ry="36" fill="#fff" stroke="#171717" stroke-width="5"/>
    <text x="510" y="851" font-size="28" font-weight="800">END</text>
  </g>

  <g font-family="Raleway, Arial, sans-serif" fill="#171717">
    <line x1="680" y1="175" x2="800" y2="175" stroke="#6337b5" stroke-width="4"/>
    <text x="820" y="168" font-size="22" font-weight="800">OVAL</text>
    <text x="820" y="194" font-size="18">Start or end</text>

    <line x1="680" y1="356" x2="800" y2="356" stroke="#6337b5" stroke-width="4"/>
    <text x="820" y="347" font-size="22" font-weight="800">PARALLELOGRAM</text>
    <text x="820" y="374" font-size="18">Input or output</text>

    <line x1="545" y1="447" x2="800" y2="447" stroke="#6337b5" stroke-width="4"/>
    <text x="820" y="440" font-size="22" font-weight="800">ARROW</text>
    <text x="820" y="466" font-size="18">What happens next</text>

    <rect x="770" y="610" width="340" height="135" rx="14" fill="#fff4dc" stroke="#171717" stroke-width="3"/>
    <text x="794" y="650" font-size="20" font-weight="800">READ IT ALOUD</text>
    <text x="794" y="681" font-size="18">Start → display welcome icon →</text>
    <text x="794" y="709" font-size="18">Button A input → display initials → End.</text>
  </g>
</svg>
