<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">Input, process and output</title>
  <desc id="description">A four-by-three classroom diagram showing the input, processing and output of a digital doorbell.</desc>

  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L12 6 L0 12 Z" fill="#6B2FB9"/>
    </marker>
    <style>
      .raleway { font-family: Raleway, Arial, sans-serif; }
      .black { fill: #111111; }
      .purple { fill: #6B2FB9; }
      .card { fill: #FFFFFF; stroke: #111111; stroke-width: 4; }
      .line { fill: none; stroke: #111111; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .accent { fill: none; stroke: #6B2FB9; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1200" height="900" fill="#FFFFFF"/>
  <rect x="24" y="24" width="1152" height="852" rx="18" fill="#FFFFFF" stroke="#111111" stroke-width="4"/>

  <text x="600" y="82" text-anchor="middle" class="raleway black" font-size="52" font-weight="800" letter-spacing="1">INPUT • PROCESS • OUTPUT</text>
  <text x="600" y="124" text-anchor="middle" class="raleway black" font-size="21" font-weight="600" letter-spacing="2">HOW INFORMATION MOVES THROUGH A COMPUTER SYSTEM</text>

  <rect x="416" y="150" width="368" height="46" rx="23" fill="#F4EFF9" stroke="#6B2FB9" stroke-width="3"/>
  <text x="600" y="181" text-anchor="middle" class="raleway purple" font-size="21" font-weight="800" letter-spacing="2">DIGITAL DOORBELL EXAMPLE</text>

  <!-- Input card -->
  <rect x="58" y="238" width="310" height="474" rx="22" class="card"/>
  <rect x="58" y="238" width="310" height="82" rx="20" fill="#F4EFF9" stroke="#111111" stroke-width="4"/>
  <rect x="58" y="296" width="310" height="24" fill="#F4EFF9"/>
  <circle cx="106" cy="279" r="26" fill="#6B2FB9"/>
  <text x="106" y="289" text-anchor="middle" class="raleway" font-size="27" font-weight="800" fill="#FFFFFF">I</text>
  <text x="226" y="291" text-anchor="middle" class="raleway black" font-size="34" font-weight="800">INPUT</text>

  <!-- Doorbell and finger icon -->
  <rect x="154" y="355" width="118" height="118" rx="24" fill="#F4EFF9" stroke="#111111" stroke-width="4"/>
  <circle cx="213" cy="414" r="29" fill="#FFFFFF" stroke="#111111" stroke-width="4"/>
  <circle cx="213" cy="414" r="16" fill="#6B2FB9"/>
  <path d="M121 472 C121 444 139 434 153 448 L175 470 L175 512 L153 512 L134 492 C126 485 121 480 121 472 Z" fill="#FFFFFF" stroke="#111111" stroke-width="4" stroke-linejoin="round"/>
  <path d="M166 459 L189 437" class="accent" stroke-width="5"/>
  <path d="M178 447 L192 447 M178 447 L178 433" class="accent" stroke-width="4"/>

  <text x="213" y="548" text-anchor="middle" class="raleway purple" font-size="22" font-weight="800">BUTTON PRESS</text>
  <text x="213" y="587" text-anchor="middle" class="raleway black" font-size="18">An event enters</text>
  <text x="213" y="613" text-anchor="middle" class="raleway black" font-size="18">the system.</text>
  <line x1="113" y1="643" x2="313" y2="643" stroke="#6B2FB9" stroke-width="4" stroke-linecap="round"/>
  <text x="213" y="678" text-anchor="middle" class="raleway black" font-size="17" font-weight="700">Not just “the button”</text>

  <!-- Process card -->
  <rect x="445" y="238" width="310" height="474" rx="22" class="card"/>
  <rect x="445" y="238" width="310" height="82" rx="20" fill="#F4EFF9" stroke="#111111" stroke-width="4"/>
  <rect x="445" y="296" width="310" height="24" fill="#F4EFF9"/>
  <circle cx="493" cy="279" r="26" fill="#6B2FB9"/>
  <text x="493" y="289" text-anchor="middle" class="raleway" font-size="27" font-weight="800" fill="#FFFFFF">P</text>
  <text x="624" y="291" text-anchor="middle" class="raleway black" font-size="34" font-weight="800">PROCESS</text>

  <!-- Processor icon -->
  <rect x="537" y="355" width="126" height="126" rx="16" fill="#F4EFF9" stroke="#111111" stroke-width="4"/>
  <rect x="568" y="386" width="64" height="64" rx="8" fill="#6B2FB9"/>
  <circle cx="600" cy="418" r="11" fill="#FFFFFF"/>
  <path d="M553 340 V355 M578 340 V355 M603 340 V355 M628 340 V355 M653 340 V355 M553 481 V496 M578 481 V496 M603 481 V496 M628 481 V496 M653 481 V496 M522 371 H537 M522 396 H537 M522 421 H537 M522 446 H537 M663 371 H678 M663 396 H678 M663 421 H678 M663 446 H678" class="line" stroke-width="3"/>

  <text x="600" y="540" text-anchor="middle" class="raleway purple" font-size="21" font-weight="800">DETECT THE EVENT</text>
  <text x="600" y="579" text-anchor="middle" class="raleway black" font-size="18">Follow the stored</text>
  <text x="600" y="605" text-anchor="middle" class="raleway black" font-size="18">instructions and select</text>
  <text x="600" y="631" text-anchor="middle" class="raleway black" font-size="18">the chime.</text>
  <line x1="500" y1="655" x2="700" y2="655" stroke="#6B2FB9" stroke-width="4" stroke-linecap="round"/>
  <text x="600" y="690" text-anchor="middle" class="raleway black" font-size="17" font-weight="700">This happens internally</text>

  <!-- Output card -->
  <rect x="832" y="238" width="310" height="474" rx="22" class="card"/>
  <rect x="832" y="238" width="310" height="82" rx="20" fill="#F4EFF9" stroke="#111111" stroke-width="4"/>
  <rect x="832" y="296" width="310" height="24" fill="#F4EFF9"/>
  <circle cx="880" cy="279" r="26" fill="#6B2FB9"/>
  <text x="880" y="289" text-anchor="middle" class="raleway" font-size="27" font-weight="800" fill="#FFFFFF">O</text>
  <text x="1004" y="291" text-anchor="middle" class="raleway black" font-size="34" font-weight="800">OUTPUT</text>

  <!-- Speaker icon -->
  <path d="M906 405 H943 L989 368 V460 L943 423 H906 Z" fill="#6B2FB9" stroke="#111111" stroke-width="4" stroke-linejoin="round"/>
  <path d="M1003 381 Q1030 414 1003 447 M1018 365 Q1060 414 1018 463" class="line"/>
  <circle cx="987" cy="414" r="72" fill="none" stroke="#F4EFF9" stroke-width="12"/>

  <text x="987" y="540" text-anchor="middle" class="raleway purple" font-size="22" font-weight="800">PLAY A CHIME</text>
  <text x="987" y="579" text-anchor="middle" class="raleway black" font-size="18">The system produces</text>
  <text x="987" y="605" text-anchor="middle" class="raleway black" font-size="18">a result the user</text>
  <text x="987" y="631" text-anchor="middle" class="raleway black" font-size="18">can hear.</text>
  <line x1="887" y1="655" x2="1087" y2="655" stroke="#6B2FB9" stroke-width="4" stroke-linecap="round"/>
  <text x="987" y="690" text-anchor="middle" class="raleway black" font-size="17" font-weight="700">The sound is the output</text>

  <!-- Direction arrows -->
  <path d="M379 475 H430" class="accent" marker-end="url(#arrowhead)"/>
  <path d="M766 475 H817" class="accent" marker-end="url(#arrowhead)"/>

  <!-- Footer takeaway -->
  <rect x="64" y="760" width="1072" height="82" rx="16" fill="#6B2FB9"/>
  <text x="600" y="794" text-anchor="middle" class="raleway" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="1">INPUT ENTERS  →  PROCESSING HAPPENS  →  OUTPUT LEAVES</text>
  <text x="600" y="824" text-anchor="middle" class="raleway" font-size="25" font-weight="800" fill="#FFFFFF">WHAT WOULD CHANGE FOR A SMART BADGE?</text>
</svg>
