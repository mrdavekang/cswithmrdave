<svg xmlns="http://www.w3.org/2000/svg" width="520" height="650" viewBox="0 0 520 650"><title>Read a Smart Badge greeting flowchart</title><rect width="520" height="650" fill="white"/><defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#141414"/></marker></defs><g fill="white" stroke="#141414" stroke-width="3"><ellipse cx="260" cy="47" rx="100" ry="29"/><path d="M71 129 H461 L431 226 H41Z"/><rect x="49" y="299" width="422" height="112"/><path d="M71 481 H461 L431 552 H41Z"/><ellipse cx="260" cy="614" rx="100" ry="25"/><g marker-end="url(#a)"><path d="M260 76 V120"/><path d="M260 226 V290"/><path d="M260 411 V472"/><path d="M260 552 V581"/></g></g><g font-family="Arial,sans-serif" fill="#141414" text-anchor="middle"><g font-size="27" font-weight="700"><text x="260" y="56">START</text><text x="260" y="623">END</text></g><g font-size="26"><text x="250" y="169">1. Wait until Button A</text><text x="250" y="202">is pressed</text><text x="260" y="335">2. Make greeting:</text><text x="260" y="369">join “HELLO ” and “JT”</text><text x="260" y="397" font-size="21">to create “HELLO JT”</text><text x="250" y="525">3. Display greeting</text></g><text x="345" y="265" font-size="20">next step</text></g></svg>
