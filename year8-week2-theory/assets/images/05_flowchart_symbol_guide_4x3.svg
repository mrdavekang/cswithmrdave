<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">Flowchart symbol guide</title>
  <desc id="description">A four-by-three classroom reference showing the standard symbols for start and end, process, input and output, decision, and flow arrows.</desc>

  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L12 6 L0 12 Z" fill="#6B2FB9"/>
    </marker>
    <style>
      .raleway { font-family: Raleway, Arial, sans-serif; }
      .black { fill: #111111; }
      .purple { fill: #6B2FB9; }
      .card { fill: #FFFFFF; stroke: #111111; stroke-width: 4; }
      .symbol { fill: #F4EFF9; stroke: #111111; stroke-width: 4; stroke-linejoin: round; }
      .line { fill: none; stroke: #111111; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .accent { fill: none; stroke: #6B2FB9; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1200" height="900" fill="#FFFFFF"/>
  <rect x="24" y="24" width="1152" height="852" rx="18" fill="#FFFFFF" stroke="#111111" stroke-width="4"/>

  <text x="600" y="82" text-anchor="middle" class="raleway black" font-size="52" font-weight="800" letter-spacing="1">FLOWCHART SYMBOL GUIDE</text>
  <text x="600" y="124" text-anchor="middle" class="raleway black" font-size="21" font-weight="600" letter-spacing="2">STANDARD SHAPES GIVE EACH STEP A CLEAR MEANING</text>

  <!-- Start / End card -->
  <rect x="58" y="166" width="338" height="292" rx="20" class="card"/>
  <circle cx="102" cy="208" r="23" fill="#6B2FB9"/>
  <text x="102" y="216" text-anchor="middle" class="raleway" font-size="22" font-weight="800" fill="#FFFFFF">1</text>
  <text x="228" y="219" text-anchor="middle" class="raleway black" font-size="29" font-weight="800">START / END</text>
  <rect x="123" y="264" width="208" height="78" rx="39" class="symbol"/>
  <text x="227" y="314" text-anchor="middle" class="raleway purple" font-size="23" font-weight="800">START</text>
  <text x="227" y="385" text-anchor="middle" class="raleway black" font-size="18">Shows where an</text>
  <text x="227" y="411" text-anchor="middle" class="raleway black" font-size="18">algorithm begins or finishes.</text>

  <!-- Process card -->
  <rect x="431" y="166" width="338" height="292" rx="20" class="card"/>
  <circle cx="475" cy="208" r="23" fill="#6B2FB9"/>
  <text x="475" y="216" text-anchor="middle" class="raleway" font-size="22" font-weight="800" fill="#FFFFFF">2</text>
  <text x="600" y="219" text-anchor="middle" class="raleway black" font-size="29" font-weight="800">PROCESS</text>
  <rect x="496" y="264" width="208" height="78" class="symbol"/>
  <text x="600" y="314" text-anchor="middle" class="raleway purple" font-size="21" font-weight="800">CALCULATE TOTAL</text>
  <text x="600" y="385" text-anchor="middle" class="raleway black" font-size="18">An action or operation</text>
  <text x="600" y="411" text-anchor="middle" class="raleway black" font-size="18">performed by the system.</text>

  <!-- Input / Output card -->
  <rect x="804" y="166" width="338" height="292" rx="20" class="card"/>
  <circle cx="848" cy="208" r="23" fill="#6B2FB9"/>
  <text x="848" y="216" text-anchor="middle" class="raleway" font-size="22" font-weight="800" fill="#FFFFFF">3</text>
  <text x="1000" y="219" text-anchor="middle" class="raleway black" font-size="25" font-weight="800">INPUT / OUTPUT</text>
  <path d="M893 264 H1077 L1055 342 H871 Z" class="symbol"/>
  <text x="974" y="314" text-anchor="middle" class="raleway purple" font-size="21" font-weight="800">ENTER A NAME</text>
  <text x="974" y="385" text-anchor="middle" class="raleway black" font-size="18">Data entering the system</text>
  <text x="974" y="411" text-anchor="middle" class="raleway black" font-size="18">or a result being produced.</text>

  <!-- Decision card -->
  <rect x="58" y="492" width="526" height="244" rx="20" class="card"/>
  <circle cx="102" cy="534" r="23" fill="#6B2FB9"/>
  <text x="102" y="542" text-anchor="middle" class="raleway" font-size="22" font-weight="800" fill="#FFFFFF">4</text>
  <text x="208" y="545" text-anchor="middle" class="raleway black" font-size="29" font-weight="800">DECISION</text>
  <path d="M321 525 L410 604 L321 683 L232 604 Z" class="symbol"/>
  <text x="321" y="595" text-anchor="middle" class="raleway purple" font-size="19" font-weight="800">SCORE</text>
  <text x="321" y="620" text-anchor="middle" class="raleway purple" font-size="19" font-weight="800">ABOVE 10?</text>
  <path d="M232 604 H174" class="accent" marker-end="url(#arrowhead)"/>
  <path d="M410 604 H468" class="accent" marker-end="url(#arrowhead)"/>
  <text x="190" y="585" text-anchor="middle" class="raleway black" font-size="16" font-weight="800">NO</text>
  <text x="452" y="585" text-anchor="middle" class="raleway black" font-size="16" font-weight="800">YES</text>
  <text x="490" y="642" text-anchor="middle" class="raleway black" font-size="15">A question with</text>
  <text x="490" y="666" text-anchor="middle" class="raleway black" font-size="15">different paths.</text>

  <!-- Flow arrow card -->
  <rect x="619" y="492" width="523" height="244" rx="20" class="card"/>
  <circle cx="663" cy="534" r="23" fill="#6B2FB9"/>
  <text x="663" y="542" text-anchor="middle" class="raleway" font-size="22" font-weight="800" fill="#FFFFFF">5</text>
  <text x="799" y="545" text-anchor="middle" class="raleway black" font-size="29" font-weight="800">FLOW ARROW</text>
  <path d="M700 615 H968" class="accent" marker-end="url(#arrowhead)"/>
  <circle cx="700" cy="615" r="10" fill="#6B2FB9"/>
  <text x="834" y="591" text-anchor="middle" class="raleway purple" font-size="18" font-weight="800">NEXT STEP</text>
  <text x="880" y="661" text-anchor="middle" class="raleway black" font-size="18">Shows the order and direction</text>
  <text x="880" y="687" text-anchor="middle" class="raleway black" font-size="18">of the algorithm.</text>

  <!-- Footer takeaway -->
  <rect x="64" y="770" width="1072" height="72" rx="16" fill="#6B2FB9"/>
  <text x="600" y="816" text-anchor="middle" class="raleway" font-size="29" font-weight="800" fill="#FFFFFF">READ A FLOWCHART BY FOLLOWING THE ARROWS</text>
</svg>
