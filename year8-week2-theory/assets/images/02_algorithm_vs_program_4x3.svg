<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">Algorithm versus program</title>
  <desc id="description">A four-by-three classroom diagram comparing an algorithm as a precise plan with a program as instructions a computer can run.</desc>

  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#6B2FB9"/>
    </marker>
    <style>
      .raleway { font-family: Raleway, Arial, sans-serif; }
      .mono { font-family: "Courier New", monospace; }
      .black { fill: #111111; }
      .purple { fill: #6B2FB9; }
      .outline { fill: #FFFFFF; stroke: #111111; stroke-width: 4; }
      .thin { fill: none; stroke: #111111; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1200" height="900" fill="#FFFFFF"/>
  <rect x="24" y="24" width="1152" height="852" rx="18" fill="#FFFFFF" stroke="#111111" stroke-width="4"/>

  <text x="600" y="82" text-anchor="middle" class="raleway black" font-size="54" font-weight="800" letter-spacing="1">ALGORITHM VS PROGRAM</text>
  <text x="600" y="124" text-anchor="middle" class="raleway black" font-size="22" font-weight="600" letter-spacing="3">ONE SOLUTION • TWO STAGES</text>

  <!-- Algorithm card -->
  <rect x="64" y="160" width="478" height="574" rx="22" fill="#FFFFFF" stroke="#111111" stroke-width="4"/>
  <rect x="64" y="160" width="478" height="88" rx="20" fill="#F4EFF9" stroke="#111111" stroke-width="4"/>
  <rect x="64" y="220" width="478" height="28" fill="#F4EFF9"/>
  <circle cx="112" cy="204" r="25" fill="#6B2FB9"/>
  <path d="M100 204 l8 8 l17 -20" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="303" y="216" text-anchor="middle" class="raleway black" font-size="38" font-weight="800">ALGORITHM</text>
  <text x="303" y="286" text-anchor="middle" class="raleway purple" font-size="24" font-weight="800" letter-spacing="2">A PRECISE PLAN</text>

  <!-- Paper -->
  <path d="M152 324 H422 L474 376 V620 H152 Z" class="outline"/>
  <path d="M422 324 V376 H474" fill="#F4EFF9" stroke="#111111" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="194" cy="410" r="22" fill="#6B2FB9"/>
  <text x="194" y="419" text-anchor="middle" class="raleway" font-size="25" font-weight="800" fill="#FFFFFF">1</text>
  <text x="232" y="417" class="raleway black" font-size="23" font-weight="700">ASK FOR A NAME</text>
  <line x1="232" y1="432" x2="423" y2="432" stroke="#111111" stroke-width="2"/>

  <circle cx="194" cy="482" r="22" fill="#6B2FB9"/>
  <text x="194" y="491" text-anchor="middle" class="raleway" font-size="25" font-weight="800" fill="#FFFFFF">2</text>
  <text x="232" y="489" class="raleway black" font-size="23" font-weight="700">CREATE A GREETING</text>
  <line x1="232" y1="504" x2="433" y2="504" stroke="#111111" stroke-width="2"/>

  <circle cx="194" cy="554" r="22" fill="#6B2FB9"/>
  <text x="194" y="563" text-anchor="middle" class="raleway" font-size="25" font-weight="800" fill="#FFFFFF">3</text>
  <text x="232" y="561" class="raleway black" font-size="23" font-weight="700">DISPLAY IT</text>
  <line x1="232" y1="576" x2="389" y2="576" stroke="#111111" stroke-width="2"/>

  <text x="303" y="671" text-anchor="middle" class="raleway black" font-size="19" font-weight="600">Steps • pseudocode • flowchart</text>
  <text x="303" y="703" text-anchor="middle" class="raleway black" font-size="18">The computer cannot run the plan yet.</text>

  <!-- Program card -->
  <rect x="658" y="160" width="478" height="574" rx="22" fill="#FFFFFF" stroke="#111111" stroke-width="4"/>
  <rect x="658" y="160" width="478" height="88" rx="20" fill="#F4EFF9" stroke="#111111" stroke-width="4"/>
  <rect x="658" y="220" width="478" height="28" fill="#F4EFF9"/>
  <circle cx="706" cy="204" r="25" fill="#6B2FB9"/>
  <path d="M695 190 h22 v28 h-22 z M700 196 h12 M700 202 h12 M700 208 h8" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <text x="897" y="216" text-anchor="middle" class="raleway black" font-size="38" font-weight="800">PROGRAM</text>
  <text x="897" y="286" text-anchor="middle" class="raleway purple" font-size="24" font-weight="800" letter-spacing="2">THE IMPLEMENTATION</text>

  <!-- Laptop -->
  <rect x="722" y="332" width="350" height="252" rx="18" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
  <rect x="744" y="354" width="306" height="207" rx="8" fill="#111111"/>
  <circle cx="897" cy="343" r="4" fill="#6B2FB9"/>
  <path d="M694 584 H1100 L1067 622 H727 Z" fill="#FFFFFF" stroke="#111111" stroke-width="5" stroke-linejoin="round"/>
  <line x1="824" y1="604" x2="970" y2="604" stroke="#6B2FB9" stroke-width="5" stroke-linecap="round"/>

  <text x="768" y="402" class="mono" font-size="16" fill="#FFFFFF">name = input("Name: ")</text>
  <text x="768" y="447" class="mono" font-size="16" fill="#FFFFFF">message = "Hello " + name</text>
  <text x="768" y="492" class="mono" font-size="16" fill="#FFFFFF">print(message)</text>
  <rect x="768" y="520" width="162" height="6" rx="3" fill="#6B2FB9"/>

  <text x="897" y="671" text-anchor="middle" class="raleway black" font-size="19" font-weight="600">Python • JavaScript • another language</text>
  <text x="897" y="703" text-anchor="middle" class="raleway black" font-size="18">The computer can execute these instructions.</text>

  <!-- Conversion arrow -->
  <path d="M558 438 H638" fill="none" stroke="#6B2FB9" stroke-width="8" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  <rect x="542" y="385" width="116" height="36" rx="18" fill="#FFFFFF" stroke="#6B2FB9" stroke-width="3"/>
  <text x="600" y="410" text-anchor="middle" class="raleway purple" font-size="18" font-weight="800">IMPLEMENT</text>

  <!-- Footer takeaway -->
  <rect x="64" y="766" width="1072" height="76" rx="16" fill="#6B2FB9"/>
  <text x="600" y="815" text-anchor="middle" class="raleway" font-size="30" font-weight="800" fill="#FFFFFF">PLAN THE SOLUTION  →  THEN WRITE THE CODE</text>
</svg>
