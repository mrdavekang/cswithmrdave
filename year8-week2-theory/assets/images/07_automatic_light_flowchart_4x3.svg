<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">Automatic light decision flowchart</title>
  <desc id="description">A four-by-three classroom flowchart showing how an automatic light uses a decision, Yes and No paths, and a repeat loop.</desc>

  <defs>
    <marker id="arrowhead" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L16 8 L0 16 Z" fill="#6B2FB9"/>
    </marker>
    <style>
      .raleway { font-family: Raleway, Arial, sans-serif; }
      .black { fill: #111111; }
      .purple { fill: #6B2FB9; }
      .card { fill: #FFFFFF; stroke: #111111; stroke-width: 4; }
      .shape { fill: #F4EFF9; stroke: #111111; stroke-width: 4; stroke-linejoin: round; }
      .arrow { fill: none; stroke: #6B2FB9; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowhead); }
      .path { fill: none; stroke: #6B2FB9; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #111111; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1200" height="900" fill="#FFFFFF"/>
  <rect x="24" y="24" width="1152" height="852" rx="18" fill="#FFFFFF" stroke="#111111" stroke-width="4"/>

  <text x="600" y="82" text-anchor="middle" class="raleway black" font-size="50" font-weight="800" letter-spacing="1">AUTOMATIC LIGHT FLOWCHART</text>
  <text x="600" y="124" text-anchor="middle" class="raleway black" font-size="21" font-weight="600" letter-spacing="2">A DECISION CREATES MORE THAN ONE POSSIBLE PATH</text>

  <!-- Flowchart panel -->
  <rect x="58" y="158" width="770" height="600" rx="22" class="card"/>
  <rect x="80" y="180" width="186" height="42" rx="21" fill="#6B2FB9"/>
  <text x="173" y="208" text-anchor="middle" class="raleway" font-size="16" font-weight="800" fill="#FFFFFF">FOLLOW YES OR NO</text>

  <!-- Start -->
  <rect x="310" y="184" width="266" height="58" rx="29" class="shape"/>
  <text x="443" y="222" text-anchor="middle" class="raleway purple" font-size="23" font-weight="800">START</text>
  <path d="M443 242 V263" class="arrow"/>

  <!-- Input -->
  <path d="M298 276 H588 L570 338 H280 Z" class="shape"/>
  <text x="434" y="302" text-anchor="middle" class="raleway black" font-size="18" font-weight="800">READ THE</text>
  <text x="434" y="326" text-anchor="middle" class="raleway purple" font-size="18" font-weight="800">LIGHT LEVEL</text>
  <rect x="104" y="246" width="105" height="40" rx="20" fill="#6B2FB9"/>
  <text x="156.5" y="273" text-anchor="middle" class="raleway" font-size="16" font-weight="800" fill="#FFFFFF">INPUT</text>
  <path d="M209 266 H244 V306 H280" fill="none" stroke="#6B2FB9" stroke-width="4" stroke-dasharray="7 7"/>
  <path d="M434 338 V355" class="arrow"/>

  <!-- Decision -->
  <path d="M434 360 L554 430 L434 500 L314 430 Z" class="shape"/>
  <text x="434" y="412" text-anchor="middle" class="raleway black" font-size="18" font-weight="800">LIGHT LEVEL</text>
  <text x="434" y="436" text-anchor="middle" class="raleway purple" font-size="18" font-weight="800">BELOW 30?</text>
  <text x="434" y="461" text-anchor="middle" class="raleway black" font-size="15" font-weight="700">YES OR NO</text>

  <!-- Yes path -->
  <path d="M314 430 H255 V506" class="arrow"/>
  <rect x="261" y="397" width="56" height="32" rx="16" fill="#FFFFFF" stroke="#6B2FB9" stroke-width="3"/>
  <text x="289" y="419" text-anchor="middle" class="raleway purple" font-size="15" font-weight="800">YES</text>

  <!-- No path -->
  <path d="M554 430 H645 V506" class="arrow"/>
  <rect x="559" y="397" width="49" height="32" rx="16" fill="#FFFFFF" stroke="#6B2FB9" stroke-width="3"/>
  <text x="583.5" y="419" text-anchor="middle" class="raleway purple" font-size="15" font-weight="800">NO</text>

  <!-- Yes output -->
  <path d="M160 520 H370 L354 584 H144 Z" class="shape"/>
  <circle cx="196" cy="552" r="18" fill="#6B2FB9"/>
  <path d="M196 522 V514 M196 590 V582 M166 552 H158 M234 552 H226 M175 531 L169 525 M217 573 L223 579 M175 573 L169 579 M217 531 L223 525" class="thin" stroke-width="3"/>
  <text x="276" y="546" text-anchor="middle" class="raleway black" font-size="18" font-weight="800">TURN THE LED</text>
  <text x="276" y="570" text-anchor="middle" class="raleway purple" font-size="20" font-weight="800">ON</text>

  <!-- No output -->
  <path d="M550 520 H760 L744 584 H534 Z" class="shape"/>
  <circle cx="586" cy="552" r="18" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <line x1="575" y1="541" x2="597" y2="563" stroke="#6B2FB9" stroke-width="4" stroke-linecap="round"/>
  <text x="666" y="546" text-anchor="middle" class="raleway black" font-size="18" font-weight="800">TURN THE LED</text>
  <text x="666" y="570" text-anchor="middle" class="raleway purple" font-size="20" font-weight="800">OFF</text>

  <!-- Merge and wait -->
  <path d="M255 584 V614 H434" class="path"/>
  <path d="M645 584 V614 H434" class="path"/>
  <path d="M434 614 V629" class="arrow"/>
  <rect x="328" y="642" width="212" height="54" class="shape"/>
  <text x="434" y="676" text-anchor="middle" class="raleway purple" font-size="18" font-weight="800">WAIT 1 SECOND</text>

  <!-- Repeat loop -->
  <path d="M434 696 V718 H94 V307 H280" class="arrow"/>
  <rect x="102" y="675" width="100" height="38" rx="19" fill="#FFFFFF" stroke="#6B2FB9" stroke-width="3"/>
  <text x="152" y="701" text-anchor="middle" class="raleway purple" font-size="16" font-weight="800">REPEAT</text>

  <!-- Explanation panel -->
  <rect x="858" y="158" width="284" height="600" rx="22" class="card"/>
  <rect x="858" y="158" width="284" height="98" rx="20" fill="#F4EFF9" stroke="#111111" stroke-width="4"/>
  <rect x="858" y="230" width="284" height="26" fill="#F4EFF9"/>
  <text x="1000" y="203" text-anchor="middle" class="raleway black" font-size="25" font-weight="800">HOW THE</text>
  <text x="1000" y="232" text-anchor="middle" class="raleway black" font-size="25" font-weight="800">DECISION WORKS</text>

  <path d="M1000 285 L1060 335 L1000 385 L940 335 Z" fill="#F4EFF9" stroke="#111111" stroke-width="3"/>
  <text x="1000" y="328" text-anchor="middle" class="raleway purple" font-size="15" font-weight="800">YES / NO</text>
  <text x="1000" y="349" text-anchor="middle" class="raleway purple" font-size="15" font-weight="800">QUESTION</text>

  <circle cx="903" cy="426" r="20" fill="#6B2FB9"/>
  <text x="903" y="434" text-anchor="middle" class="raleway" font-size="19" font-weight="800" fill="#FFFFFF">1</text>
  <text x="937" y="432" class="raleway black" font-size="17" font-weight="800">Read the input.</text>

  <circle cx="903" cy="486" r="20" fill="#6B2FB9"/>
  <text x="903" y="494" text-anchor="middle" class="raleway" font-size="19" font-weight="800" fill="#FFFFFF">2</text>
  <text x="937" y="492" class="raleway black" font-size="17" font-weight="800">Ask a question.</text>

  <circle cx="903" cy="546" r="20" fill="#6B2FB9"/>
  <text x="903" y="554" text-anchor="middle" class="raleway" font-size="19" font-weight="800" fill="#FFFFFF">3</text>
  <text x="937" y="538" class="raleway black" font-size="17" font-weight="800">Follow one</text>
  <text x="937" y="560" class="raleway black" font-size="17" font-weight="800">labelled path.</text>

  <circle cx="903" cy="606" r="20" fill="#6B2FB9"/>
  <text x="903" y="614" text-anchor="middle" class="raleway" font-size="19" font-weight="800" fill="#FFFFFF">4</text>
  <text x="937" y="612" class="raleway black" font-size="17" font-weight="800">Produce an output.</text>

  <circle cx="903" cy="666" r="20" fill="#6B2FB9"/>
  <text x="903" y="674" text-anchor="middle" class="raleway" font-size="19" font-weight="800" fill="#FFFFFF">5</text>
  <text x="937" y="658" class="raleway black" font-size="17" font-weight="800">Rejoin and</text>
  <text x="937" y="680" class="raleway black" font-size="17" font-weight="800">repeat.</text>

  <line x1="892" y1="710" x2="1108" y2="710" stroke="#6B2FB9" stroke-width="4" stroke-linecap="round"/>
  <text x="1000" y="738" text-anchor="middle" class="raleway purple" font-size="16" font-weight="800">A DIAMOND ASKS A QUESTION</text>

  <!-- Footer takeaway -->
  <rect x="64" y="786" width="1072" height="56" rx="16" fill="#6B2FB9"/>
  <text x="600" y="823" text-anchor="middle" class="raleway" font-size="27" font-weight="800" fill="#FFFFFF">DIFFERENT CONDITIONS CAN LEAD TO DIFFERENT OUTPUTS</text>
</svg>
