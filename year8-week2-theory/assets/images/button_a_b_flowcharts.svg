<svg xmlns="http://www.w3.org/2000/svg" width="800" height="630" viewBox="0 0 800 630"><title>Two separate button response flowcharts</title><rect width="800" height="630" fill="white"/><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#141414"/></marker></defs><g font-family="Arial,sans-serif" text-anchor="middle" fill="#141414"><text x="400" y="32" font-size="22">Startup welcome stays the same. Either button can be used next.</text><g transform="translate(15 0)"><text x="180" y="77" font-size="28" font-weight="700">BUTTON A</text><g fill="white" stroke="#141414" stroke-width="3"><ellipse cx="180" cy="127" rx="90" ry="28"/><path d="M47 201 H337 L313 291 H23Z"/><path d="M47 365 H337 L313 455 H23Z"/><ellipse cx="180" cy="547" rx="120" ry="30"/><g marker-end="url(#arrow)"><path d="M180 155 V192"/><path d="M180 291 V356"/><path d="M180 455 V508"/></g></g><text x="180" y="135" font-size="23" font-weight="700">START</text><text x="180" y="230" font-size="20" fill="#1559a5" font-weight="700">INPUT</text><text x="180" y="265" font-size="24">Button A pressed</text><text x="180" y="394" font-size="20" fill="#1559a5" font-weight="700">OUTPUT</text><text x="180" y="430" font-size="24">Display initials “JP”</text><text x="180" y="555" font-size="23" font-weight="700">END response</text></g><g transform="translate(415 0)"><text x="180" y="77" font-size="28" font-weight="700">BUTTON B</text><g fill="white" stroke="#141414" stroke-width="3"><ellipse cx="180" cy="127" rx="90" ry="28"/><path d="M47 201 H337 L313 291 H23Z"/><path d="M47 365 H337 L313 455 H23Z"/><ellipse cx="180" cy="547" rx="120" ry="30"/><g marker-end="url(#arrow)"><path d="M180 155 V192"/><path d="M180 291 V356"/><path d="M180 455 V508"/></g></g><text x="180" y="135" font-size="23" font-weight="700">START</text><text x="180" y="230" font-size="20" fill="#1559a5" font-weight="700">INPUT</text><text x="180" y="265" font-size="24">Button B pressed</text><text x="180" y="394" font-size="20" fill="#1559a5" font-weight="700">OUTPUT</text><text x="180" y="430" font-size="24">Display a smile</text><text x="180" y="555" font-size="23" font-weight="700">END response</text></g><text x="400" y="613" font-size="20">Two separate responses. No arrow connects A to B.</text></g><path d="M400 60 V575" stroke="#aaa" stroke-dasharray="6 6"/></svg>
