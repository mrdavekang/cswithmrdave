<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="t d"><title id="t">Trace an update and its output in order</title><desc id="d">Start with colours RED BLUE GREEN. Print shows RED BLUE GREEN. Replace index one with GOLD. The next print shows RED GOLD GREEN. The first printed line does not change later.</desc>
<rect width="900" height="440" rx="22" fill="#f6f3fc"/>
<g font-family="Arial,sans-serif" fill="#282238"><text x="28" y="38" font-size="21" font-weight="700">WORKED EXAMPLE · PRINT SHOWS THE VALUE AT THAT MOMENT</text>
<text x="32" y="81" font-family="monospace" font-size="26">colours = ["RED", "BLUE", "GREEN"]</text>
<g font-size="24"><rect x="28" y="110" width="844" height="83" rx="14" fill="white" stroke="#d7cce9"/><circle cx="63" cy="151" r="21" fill="#6840ab"/><text x="63" y="160" text-anchor="middle" fill="white" font-weight="700">1</text><text x="102" y="145" font-family="monospace">print(colours)</text><text x="102" y="177" font-family="monospace" fill="#24684d">['RED', 'BLUE', 'GREEN']</text>
<rect x="28" y="208" width="844" height="82" rx="14" fill="#fff8df" stroke="#d2b351"/><circle cx="63" cy="248" r="21" fill="#6840ab"/><text x="63" y="257" text-anchor="middle" fill="white" font-weight="700">2</text><text x="102" y="244" font-family="monospace">colours[1] = "GOLD"</text><text x="102" y="276" font-size="22">Only the second stored element changes.</text>
<rect x="28" y="305" width="844" height="83" rx="14" fill="white" stroke="#d7cce9"/><circle cx="63" cy="346" r="21" fill="#6840ab"/><text x="63" y="355" text-anchor="middle" fill="white" font-weight="700">3</text><text x="102" y="340" font-family="monospace">print(colours)</text><text x="102" y="372" font-family="monospace" fill="#24684d">['RED', 'GOLD', 'GREEN']</text></g>
<text x="31" y="421" font-size="21">Read top to bottom. A later update does not change an earlier printed line.</text></g></svg>
