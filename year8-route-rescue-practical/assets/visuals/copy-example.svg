<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d"><title id="t">Copy a stored value: source stays, destination changes</title><desc id="d">colours zero equals colours two. Read GREEN from index two on the right side of equals, then store GREEN at index zero on the left side. BLUE at index one and GREEN at index two stay unchanged. The final list is GREEN BLUE GREEN, not a swap.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#6840ab" stroke-width="2"/></marker></defs>
<rect width="900" height="400" rx="22" fill="#f6f3fc"/><g font-family="Arial,sans-serif" fill="#282238"><text x="28" y="39" font-size="21" font-weight="700">WORKED EXAMPLE · COPY A VALUE, DO NOT SWAP</text>
<text x="450" y="91" text-anchor="middle" font-family="monospace" font-size="35">colours[0] = colours[2]</text>
<text x="132" y="141" font-size="21" font-weight="700">2 · STORE HERE</text><text x="610" y="141" font-size="21" font-weight="700">1 · READ HERE</text><path d="M650 164Q450 213 245 164" fill="none" stroke="#6840ab" stroke-width="4" marker-end="url(#a)"/>
<g text-anchor="middle"><rect x="40" y="217" width="252" height="120" rx="15" fill="#e5f4eb" stroke="#689c83" stroke-width="2"/><rect x="324" y="217" width="252" height="120" rx="15" fill="white" stroke="#d3c8e5"/><rect x="608" y="217" width="252" height="120" rx="15" fill="white" stroke="#689c83" stroke-width="2"/>
<text x="166" y="248" font-size="21">INDEX 0</text><text x="450" y="248" font-size="21">INDEX 1</text><text x="734" y="248" font-size="21">INDEX 2</text><text x="166" y="286" font-size="30" font-weight="700" fill="#256549">GREEN</text><text x="450" y="286" font-size="30" font-weight="700" fill="#234f95">BLUE</text><text x="734" y="286" font-size="30" font-weight="700" fill="#256549">GREEN</text><text x="166" y="319" font-size="20">replaces RED</text><text x="450" y="319" font-size="20">unchanged</text><text x="734" y="319" font-size="20">source stays</text></g>
<text x="450" y="378" text-anchor="middle" font-size="23">After: ['GREEN', 'BLUE', 'GREEN'] · Still three elements.</text></g></svg>
