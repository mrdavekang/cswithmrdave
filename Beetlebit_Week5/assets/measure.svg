<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-labelledby="t d"><title id="t">Measuring fixings with a physical ruler</title><desc id="d">Not to scale. Raised-head bolt length excludes head. Stand body excludes stud. Spacer thickness measured from side.</desc><rect width="920" height="430" rx="14" fill="#f4f8fb"/><g font-family="Arial,sans-serif" fill="#162e3c"><text x="30" y="42" font-size="24" font-weight="bold">MEASURE THE PART — NOT THIS SCREEN</text><text x="30" y="72" font-size="18">Enlarged schematics · use a real millimetre ruler</text><text x="30" y="116" font-size="21" font-weight="bold">Raised-head bolt</text><rect x="45" y="145" width="40" height="90" rx="8" fill="#c5d1da" stroke="#162e3c" stroke-width="3"/><path d="M85 172h170v36H85z" fill="#dafa6b" stroke="#162e3c" stroke-width="3"/><path d="M100 172l-10 36m32-36-10 36m32-36-10 36m32-36-10 36m32-36-10 36m32-36-10 36m32-36-10 36" stroke="#162e3c" stroke-width="2"/><path d="M85 246v24m170-24v24M85 258h170" stroke="#126998" stroke-width="3"/><text x="94" y="295" font-size="19">Under head to tip</text><text x="30" y="325" font-size="18">M3: nominal thread width 3 mm</text><text x="30" y="354" font-size="18">6 mm: length, excluding head</text><text x="345" y="116" font-size="21" font-weight="bold">Stand / standoff</text><rect x="365" y="157" width="136" height="62" fill="#dafa6b" stroke="#162e3c" stroke-width="3"/><rect x="501" y="176" width="54" height="24" fill="#c5d1da" stroke="#162e3c" stroke-width="3"/><path d="M365 246v24m136-24v24M365 258h136" stroke="#126998" stroke-width="3"/><text x="360" y="295" font-size="19">Measure the body</text><text x="345" y="325" font-size="18">Exclude the threaded stud</text><text x="650" y="116" font-size="21" font-weight="bold">Spacer / washer</text><rect x="705" y="157" width="38" height="62" fill="#fff" stroke="#162e3c" stroke-width="3"/><path d="M705 246v24m38-24v24M705 258h38" stroke="#126998" stroke-width="3"/><text x="650" y="295" font-size="19">Thickness from the side</text><text x="650" y="325" font-size="18">Not the hole diameter</text><text x="30" y="401" font-size="18" font-weight="bold">Countersunk heads differ: include the head in total length. Ask if unsure.</text></g></svg>
