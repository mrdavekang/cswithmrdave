<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Year 10 Paper 1 Practice Session 3. Review Session 2, then read, check and test a score index.">
  <title>Year 10 · Paper 1 Practice Session 3</title>
  <link rel="stylesheet" href="guide.css">
  <script defer src="lesson.js"></script>
  <script defer src="readings.js"></script>
  <script defer src="guide.js"></script>
</head>
<body>
  <a class="skip" href="#step-title">Skip to the current step</a>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="#start"><span>Year 10 Computer Science</span>Paper 1 Practice · Session 3</a>
      <div class="top-tools">
        <a class="quiet-link" href="resources/Session_3_EAD.docx" download>Download Word EAD</a>
        <details id="goals"><summary>Learning goals</summary><div id="goal-panel"></div></details>
      </div>
    </div>
  </header>
  <div class="layout">
    <aside aria-label="Lesson route">
      <details id="route" open><summary>Lesson route</summary><nav id="chapters" aria-label="Lesson stages"></nav></details>
    </aside>
    <main id="main">
      <div class="step-meta"><p id="stage"></p><p id="progress"></p></div>
      <div class="timeline" aria-hidden="true"><span id="track"></span></div>
      <article aria-labelledby="step-title">
        <p class="workfile" id="workfile" hidden></p>
        <h1 id="step-title" tabindex="-1"></h1>
        <section id="ead-box" aria-labelledby="ead-heading"></section>
        <section id="reading-first" class="reading-first" aria-label="Read first" hidden></section>
        <section class="action-panel" aria-labelledby="action-heading">
          <h2 id="action-heading">Your step</h2>
          <p id="action"></p>
          <div id="visual"></div>
          <div id="extra"></div>
        </section>
      </article>
      <nav class="pagination" aria-label="Step navigation">
        <a class="back" id="previous">← Back</a>
        <a class="next" id="next">Next step →</a>
      </nav>
      <p class="endnote">Your work stays in the Word EAD. Save it in Word.</p>
      <noscript><p>Enable JavaScript to use the step-by-step guide. You can still <a href="resources/Session_3_EAD.docx" download>download the Word EAD</a>.</p></noscript>
    </main>
  </div>
</body>
</html>
