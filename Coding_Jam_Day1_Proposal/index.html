<div id="site" class="only-screen"><noscript><main class="shell"><h1>Find a problem worth solving.</h1><p>Find out what gets in someone’s way, then pitch one useful interaction your team can realistically build.</p><p>Enable JavaScript to use the lesson stages and save your notes.</p></main></noscript></div>

<script>window.codingJam={"lesson":{"day":1,"key":"Coding_Jam_Day1_Proposal","theme":"cobalt","label":"Investigate and pitch","headline":"Find a problem worth solving.","summary":"Find out what gets in someone’s way, then pitch one useful interaction your team can realistically build.","wagba":"Getting better at using evidence to decide what is worth building.","challenge":"Can you describe exactly what your user will be able to do by minute 60?","deliverable":"A two-minute pitch and one proposal per team","sections":[{"id":"read-first-and-do-now","title":"Read first and Do Now","minutes":"0–8 min","intro":"The real Coding Jam gives you a problem and constraint on the day, with a twist later. Today is a rehearsal. Use a school-approved platform in teams of 2–3.","blocks":[{"type":"frames","title":"Before you choose a solution","cards":[["What you know","You will build and demonstrate a small working digital prototype."],["What you find out later","The actual problem, constraint and twist come from the organisers. The two-hour build plan here is rehearsal timing."]]},{"type":"callout","title":"Do Now","body":"Think of two moments when a student, teacher or parent struggles to do something specific. Name the task before suggesting a solution.","tone":""},{"type":"fields","columns":3,"fields":[{"type":"text","id":"team","label":"Team name","hint":"Use a team label. You don’t need to enter names.","lines":1},{"type":"text","id":"project","label":"Project name","hint":"Keep it short. You can change it later.","lines":1},{"type":"select","id":"teamSize","label":"Team size","hint":"Each group needs 2 or 3 people.","choices":["2","3"]}]},{"type":"area","id":"initialIdeas","label":"Two moments to investigate","hint":"For example: a parent has to scan several paragraphs to find a deadline.","lines":3},{"type":"frames","title":"What type of learning are we doing?","cards":[["Knowledge","Recall the Jam rules and recognise what is still unknown."],["Skills","Find a useful example and sketch an interaction."],["Understanding","Explain why your chosen tool and feature fit this user."]]},{"type":"fold","title":"Joining from off site?","body":"If you’re able, contribute one observation or a rough sketch. You don’t need a live call. Ask your team which moment they chose."}]},{"id":"main-task-1-follow-the-user","title":"Main task 1: Follow the user","minutes":"8–20 min","intro":"Ask about the last time it happened, or walk through the current process with a sample. Record what you saw or heard before choosing an app.","blocks":[{"type":"frames","title":"What happens now?","cards":[["01 · The task","What is this person trying to get done?"],["02 · The sticking point","At what step do they hesitate or need help?"],["03 · The workaround","What do they do now instead?"]]},{"type":"fields","columns":3,"fields":[{"type":"area","id":"user","label":"The user and their task","hint":"Be specific without identifying the person.","lines":3},{"type":"area","id":"friction","label":"Where they get stuck","hint":"Describe the moment, not a general complaint.","lines":3},{"type":"area","id":"workaround","label":"What they do instead","hint":"What did they try or who did they ask?","lines":3}]},{"type":"select","id":"source","label":"How do we know?","hint":"Choose the strongest evidence you actually have.","choices":["Observed it","Someone told us","Still an assumption"]},{"type":"area","id":"observation","label":"One piece of evidence","hint":"Use fictional or anonymous details. If it’s an assumption, note what you could check.","lines":3},{"type":"area","id":"noApp","label":"A simpler option","hint":"Would a clearer notice, checklist or existing tool solve this equally well?","lines":3},{"type":"prompt","title":"Optional AI: compare ideas","text":"We are a team of [2 or 3]. Our user is [student, teacher or parent]. They are trying to [task]. We noticed [observation or assumption]. Suggest two small digital ideas and one way to improve the process without an app. For each, say what the user would do differently. Do not invent feedback or decide for us."},{"type":"callout","title":"Your judgement matters","body":"Optional for this rehearsal: use a school-approved AI tool and fictional details only. Never paste names or private school information. The event has its own AI rules; check them separately. AI can help form a question or sketch, but it cannot tell you what a real user experienced.","tone":"coral"}]},{"id":"research-and-choose-a-platform","title":"Research and choose a platform","minutes":"20–35 min","intro":"Look at one existing solution and two possible platforms. Inspect the relevant part of each project; you don’t need to finish any tutorial.","blocks":[{"type":"resources"},{"type":"fields","columns":2,"fields":[{"type":"area","id":"platformA","label":"Option A","hint":"Name the platform and example. Note the feature you could borrow and the equipment needed.","lines":3},{"type":"area","id":"platformB","label":"Option B","hint":"Repeat for a second platform. Try opening it on the device you will use.","lines":3}]},{"type":"select","id":"platform","label":"Our platform","hint":"Choose what your group can use confidently.","choices":["Scratch","Python","MIT App Inventor","HTML, CSS and JavaScript","MakeCode for micro:bit","Other school-approved platform"]},{"type":"area","id":"platformReason","label":"Why this one?","hint":"We noticed ___. We could borrow ___. We’d leave out ___ because ___.","lines":3},{"type":"area","id":"skills","label":"Team skills and responsibilities","hint":"Each person: I can already ___. I’ll take responsibility for ___. I’ll practise ___ and show it by ___.","lines":3}]},{"id":"main-task-2-sketch-and-scope","title":"Main task 2: Sketch and scope","minutes":"35–48 min","intro":"Sketch the first action and the result. A labelled paper sketch or an AI-assisted concept are both fine. Explain how your sketch fits the chosen platform.","blocks":[{"type":"storyboard"},{"type":"fields","columns":2,"fields":[{"type":"area","id":"input","label":"What the user does","hint":"What do they enter, select or press?","lines":3},{"type":"area","id":"output","label":"What the program outputs","hint":"What useful result do they see, hear or get?","lines":3}]},{"type":"area","id":"invalid","label":"If an input is missing or invalid","hint":"What could the prototype show so the user can try again?","lines":2},{"type":"prompt","title":"Optional AI: sketch two frames","text":"Create a rough two-frame storyboard for [project] on [platform]. Frame 1 shows the user [action]. Frame 2 shows [useful result]. Use fictional details and short labels. Match the platform, such as a Python console or a micro:bit display. Mark the first feature and how the prototype should respond to a missing or invalid input. Do not write code."},{"type":"timeline"},{"type":"fields","columns":2,"fields":[{"type":"area","id":"core","label":"Must work by minute 60","hint":"A user can ___. The program will ___.","lines":3},{"type":"area","id":"cut","label":"Cut first if we are behind","hint":"What optional feature can go while the core still works?","lines":3}]},{"type":"area","id":"expected","label":"One test and the expected result","hint":"When the tester does ___, we expect to see ___.","lines":3},{"type":"prompt","title":"Optional AI: check scope","text":"We know [skills]. We have [devices and tools] and two hours. Our sketch shows [features]. Help us choose one feature to get working by minute 60, one test and one thing to cut first. Flag needs that we haven’t listed. Use fictional data. We’ll decide what to keep."}]},{"id":"pitch-and-learning-pitstop","title":"Pitch and Learning Pitstop","minutes":"48–60 min","intro":"Explain the problem, walk through your sketch, justify your platform and describe what you can show at the end. Everyone speaks. Update one part after feedback.","blocks":[{"type":"callout","title":"Pitch check","body":"What did you find out about the user that changed your plan? If a clearer notice would do the job, say so.","tone":""},{"type":"area","id":"pitchChange","label":"One change after feedback","hint":"What did someone ask or notice? What will you change?","lines":3},{"type":"frames","title":"Pick your current phase","cards":[["New Learning","I’m getting the hang of separating a problem from an idea."],["Consolidating","I’ve used a platform I know to plan a clearer interaction."],["Treading Water","I can already sketch an interaction. I’ll test an assumption."],["Drowning","I’m stuck choosing a problem or tool. I’ll ask for a specific example."]]},{"type":"select","id":"phase","label":"My learning phase","hint":"Pick the one that matches what happened today.","choices":["New Learning","Consolidating","Treading Water","Drowning"]},{"type":"fields","columns":2,"fields":[{"type":"area","id":"evidence","label":"Evidence from today","hint":"Point to something you did, saw or changed.","lines":3},{"type":"area","id":"nextStep","label":"One next action","hint":"Name a specific action you can take before the next session.","lines":3}]},{"type":"callout","title":"Finish with a handover","body":"Save your backup. Bring it, your sketch and your working pitch notes to Day 2. Submit one team copy in Teams if your teacher asks.","tone":""}]}]},"resources":[["Scratch","Pong","https://www.scratchfoundation.org/learn/learning-library/pong-game","See how an action triggers feedback and changes the score. Try adapting it for a recycling practice game."],["Python","Rock, Paper, Scissors","https://projects.raspberrypi.org/en/projects/rock-paper-scissors","Notice how input and selection produce different results. Try a menu that shows a student their first catch-up task."],["App Inventor","Talk to Me","https://appinventor.mit.edu/explore/sites/all/files/hourofcode/TalkToMePart1.pdf","See how a button reads text aloud. Consider whether spoken instructions would actually help your user."],["Web","Adding interactivity","https://developer.mozilla.org/en-US/docs/Learn_web_development/Getting_started/Your_first_website/Adding_interactivity","See how a click changes what is displayed. Try adding and resolving one fictional request in a teacher help queue."],["micro:bit","Sound Meter","https://www.microbit.org/projects/make-it-code-it/sound-meter/","See how a sound level becomes a display. Test with a simulator or suitable hardware. Do not record audio."],["Existing tool","Teams assignments","https://support.microsoft.com/en-au/education/assignments/view-and-navigate-your-assignments-student","Check what Teams already shows before proposing a new catch-up tool."]],"twists":[],"timeline":[["0–10","Scope the problem"],["10–25","Prove an interaction"],["25–60","Build the core"],["60–90","Test and fix"],["90–110","Adapt or simplify"],["110–120","Save and rehearse"]]};
(() => {
  'use strict';
  const { lesson,resources,twists,timeline } = window.codingJam;
  const title=`Coding Jam Day ${lesson.day}: ${lesson.label}`;
  const key=`cswithmrdave:coding-jam:day-${lesson.day}:v1`;
  const MAX=3200, BACKUP_MAX=150000;
  const esc=(x)=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const stageFields=s=>s.blocks.flatMap(b=>b.type==='fields'?b.fields:('id' in b?[b]:[]));
  const fields=lesson.sections.flatMap(stageFields);
  const definitions=new Map(fields.map(d=>[d.id,d]));
  const phaseText=lesson.sections.map(s=>s.id);
  const blank=()=>({answers:Object.create(null),done:[],current:phaseText[0],twist:0,carryFrom:0});
  let storage=true;
  const validText=(d,value)=>typeof value==='string' ? (d.choices ? (d.choices.includes(value)?value:'') : value.slice(0,d.type==='text'?130:MAX)) : '';
  function clean(x){
    const out=blank();
    if(!x||typeof x!=='object')return out;
    for(const [id,d] of definitions){const val=validText(d,x.answers?.[id]);if(val)out.answers[id]=val;}
    if(Array.isArray(x.done))out.done=phaseText.filter(v=>x.done.includes(v));
    if(phaseText.includes(x.current))out.current=x.current;
    if(lesson.day===3&&Number.isInteger(x.twist)&&x.twist>=0&&x.twist<=twists.length)out.twist=x.twist;
    if(lesson.day>1&&x.carryFrom===lesson.day-1)out.carryFrom=x.carryFrom;
    return out;
  }
  let state=blank();
  try{const saved=localStorage.getItem(key);if(saved)state=clean(JSON.parse(saved));}catch{storage=false;}
  const $=(id)=>document.getElementById(id);
  const introText=`Your responses stay on this device. Save a backup to move them to a different device or to another day.`;
  const stateText=()=>storage?'Progress saves in this browser.':'Browser saving is unavailable. Use Save backup.';
  function persist(){
    try{localStorage.setItem(key,JSON.stringify(state));storage=true;}catch{storage=false;}
    if($('device-status'))$('device-status').textContent=stateText();
  }
  function note(message,error=false){
    const n=$('notice');n.dataset.error=String(error);n.textContent=message;
  }
  function frameGrid(label,cards){
    return `<div><h3>${esc(label)}</h3><div class="frame-grid" style="--cols:${cards.length===2||cards.length===4?2:3}">${cards.map(([t,d])=>`<div class="frame"><strong>${esc(t)}</strong><p>${esc(d)}</p></div>`).join('')}</div></div>`;
  }
  function editField(d){
    const id=`answer-${d.id}`, a=`id="${id}" data-field="${esc(d.id)}" ${d.hint?`aria-describedby="${id}-hint"`:''}`;
    return `<div class="field"><label for="${id}">${esc(d.label)}</label>${d.hint?`<small id="${id}-hint" class="hint">${esc(d.hint)}</small>`:''}${d.type==='select'?`<select ${a}><option value="">Choose one</option>${d.choices.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}</select>`:d.type==='text'?`<input ${a} type="text" maxlength="130" autocomplete="off">`:`<textarea ${a} rows="${d.lines}" maxlength="${MAX}"></textarea>`}</div>`;
  }
  const sampleCode=`notice = input("Choose 1 for the library notice: ")
if notice == "1":
    print("Action: Return your book")
    print("Deadline: Friday")
else:
    print("That choice isn't available. Try 1.")`;
  function renderBlock(b){
    switch(b.type){
    case 'text':case 'area':case 'select':return editField(b);
    case 'fields':return `<div class="field-grid" style="--cols:${b.columns}">${b.fields.map(editField).join('')}</div>`;
    case 'frames':return frameGrid(b.title,b.cards);
    case 'callout':return `<aside class="callout ${b.tone==='coral'?'coral':''}"><h3>${esc(b.title)}</h3><p>${esc(b.body)}</p></aside>`;
    case 'list':return `<div><h3>${esc(b.title)}</h3><ul class="check-list">${b.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
    case 'fold':return `<details class="fold"><summary>${esc(b.title)}</summary><p>${esc(b.body)}</p></details>`;
    case 'prompt':return `<details class="fold"><summary>${esc(b.title)}</summary><p class="prompt-text">${esc(b.text)}</p><button type="button" class="btn prompt-copy" data-copy>Copy prompt</button></details>`;
    case 'resources':return `<div class="resource-grid" aria-label="Project research examples">${resources.map(([tool,name,url,d])=>`<article class="resource"><span class="chip">${esc(tool)}</span><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(name)}</a><p>${esc(d)}</p></article>`).join('')}</div>`;
    case 'storyboard':return `<figure class="story-visual" style="margin:0"><h3>Worked sketch: finding a deadline</h3><div class="frame-grid" style="--cols:2"><div class="frame"><strong>What the user does</strong><div class="mock"><b>Choose a notice</b><span class="selected">Library notice</span><span>Trip notice</span></div></div><div class="frame"><strong>What the user gets back</strong><div class="mock"><b>Library notice</b><p><b>Action:</b> Return your book<br><b>Deadline:</b> Friday</p></div></div></div><figcaption class="hint">Fictional example. A short notice might be enough. Test before deciding you need an app.</figcaption></figure>`;
    case 'timeline':return `<div><h3>Two-hour rehearsal timeline</h3><div class="flowline">${timeline.map(([t,what],i)=>`<div class="${i===2?'checkpoint':''}"><b>${esc(t)} min</b>${esc(what)}</div>`).join('')}</div></div>`;
    case 'codeExample':return `<details class="fold"><summary>A short Python example: input, rule and output</summary><p>Use this as a pattern, not your finished program. Predict the result for <code>1</code> and <code>x</code>, then try both in your IDE.</p><pre class="code-window"><code>${esc(sampleCode)}</code></pre><button type="button" class="btn prompt-copy" data-copy>Copy Python example</button></details>`;
    case 'carry':return `<div class="transfer-box"><h3>Bring your Day ${lesson.day-1} notes</h3><p>Import your previous backup to fill in only blank fields. No file? Carry on and enter the key points yourself.</p><div class="transfer-actions"><button type="button" class="btn" data-import>Import Day ${lesson.day-1} notes</button></div><p id="carry-status" class="notice" role="status"></p></div>`;
    case 'twist':return `<div class="field twist-pick"><label for="twist-select">Choose a practice card</label><small class="hint">Use the card your teacher chooses, or enter their custom twist below.</small><select id="twist-select"><option value="0">Choose a card</option>${twists.map(([t],i)=>`<option value="${i+1}">${esc(t)}</option>`).join('')}</select><button type="button" class="btn primary" data-reveal style="margin-top:.55rem">Reveal card</button><div id="twist-result" class="twist-card" hidden tabindex="-1"></div><button type="button" class="btn" id="use-twist" data-use-twist style="margin-top:.55rem" hidden>Use this card in our notes</button></div>`;
    default:return '';
    }
  }
  $('site').innerHTML=`
 <a class="skip" href="#main-content">Skip to lesson</a>
 <header class="topbar"><div class="shell"><div class="brand"><span class="brand-mark" aria-hidden="true">&lt;/&gt;</span><div>Coding Jam Lab<small>Year 11 · Day ${lesson.day}</small></div></div><div class="actions"><button type="button" class="btn" data-import>Import notes</button><button type="button" class="btn" data-export>Save backup</button><button type="button" class="btn primary" data-print>Save as PDF / Print</button></div></div></header>
 <section class="hero"><div class="shell hero-grid"><div><div class="badge"><b>DAY ${lesson.day} / 3</b>${esc(lesson.label)}</div><h1>${esc(lesson.headline)}</h1><p class="lede">${esc(lesson.summary)}</p><div class="hero-meta"><span><strong>60 minutes</strong> of rehearsal</span><span><strong>Teams of 2–3</strong></span></div></div><aside class="mission" aria-label="Lesson goals"><dl><div><dt>WAGBA</dt><dd>${esc(lesson.wagba)}</dd></div><div><dt>Challenge</dt><dd>${esc(lesson.challenge)}</dd></div><div><dt>By the end</dt><dd>${esc(lesson.deliverable)}</dd></div></dl></aside></div></section>
 <main class="shell layout" id="main-content"><aside class="rail"><h2>Lesson path</h2><div class="meter"><p id="meter-label"></p><progress id="meter" max="${lesson.sections.length}" value="0" aria-labelledby="meter-label"></progress></div><nav aria-label="Lesson stages">${lesson.sections.map((s,i)=>`<button type="button" class="stage-nav" data-stage="${esc(s.id)}"><span class="step-number" aria-hidden="true">${i+1}</span><span><strong>${esc(s.title)}</strong><small>${esc(s.minutes)}</small></span></button>`).join('')}</nav><p class="device-note" id="device-status"></p><p class="notice" id="notice" role="status"></p></aside><article class="workspace" id="work"></article></main>
 <footer class="shell bottom-note">${esc(introText)} No server collects your responses.</footer>
 <input type="file" accept=".json,application/json" id="backup-input" hidden>
 `;

  function reflect(){
    $('meter-label').textContent=`${state.done.length} of ${lesson.sections.length} stages done`;
    $('meter').value=state.done.length;
    for(const n of document.querySelectorAll('[data-stage]')){
      const selected=n.dataset.stage===state.current,done=state.done.includes(n.dataset.stage);
      n.setAttribute('aria-current',selected?'step':'false');n.dataset.complete=String(done);
      const i=phaseText.indexOf(n.dataset.stage);n.querySelector('.step-number').textContent=done?'✓':String(i+1);
      n.setAttribute('aria-label',`${lesson.sections[i].title}, ${lesson.sections[i].minutes}${done?', done':''}`);
    }
    $('device-status').textContent=stateText();
    if($('carry-status'))$('carry-status').textContent=state.carryFrom?`Day ${state.carryFrom} notes were brought into this lesson.`:'';
  }
  function fillInputs(){
    for(const n of $('work').querySelectorAll('[data-field]'))n.value=state.answers[n.dataset.field]||'';
    if($('twist-select'))$('twist-select').value=String(state.twist);
  }
  function showTwist(focus=false){
    const n=$('twist-result'), use=$('use-twist');if(!n||!use)return;
    const v=twists[state.twist-1]; n.hidden=!v;use.hidden=!v;
    if(v){n.innerHTML=`<strong>${esc(v[0])}</strong><p>${esc(v[1])}</p>`;if(focus)n.focus();}
    else n.textContent='';
  }
  function showStage(to,{focus=false,hash=true}={}){
    const i=phaseText.indexOf(to);if(i<0)return;
    state.current=to;
    const s=lesson.sections[i], end=i===lesson.sections.length-1;
    $('work').innerHTML=`<div class="stage-head"><p class="eyebrow">Stage ${i+1} of ${lesson.sections.length} · ${esc(s.minutes)}</p><h2 id="stage-heading" tabindex="-1">${esc(s.title)}</h2><p>${esc(s.intro)}</p></div><div class="stage-content">${s.blocks.map(renderBlock).join('')}</div><div class="stage-footer"><label class="done-label"><input type="checkbox" id="done-stage" ${state.done.includes(to)?'checked':''}> Mark this stage done</label><div class="foot-actions"><button type="button" class="btn" data-move="prev" ${i?'':'disabled'}>Previous stage</button>${end?'<button type="button" class="btn primary" data-export>Save team backup</button>':'<button type="button" class="btn primary" data-move="next">Next stage</button>'}</div></div>`;
    fillInputs();showTwist();reflect();persist();
    if(hash&&window.location.hash!==`#${to}`){try{history.replaceState(null,'',`#${to}`);}catch{window.location.hash=to;}}
    if(focus){$('stage-heading').focus({preventScroll:true});$('work').scrollIntoView({block:'start'});}
  }
  function exportBackup(){
    const payload={app:'coding-jam-lab',version:1,day:lesson.day,state};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const tag=(state.answers.team||'team').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,35)||'team';
    const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`coding-jam-day-${lesson.day}-${tag}.json`;
    document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1200);
    note(`Day ${lesson.day} backup created. Keep it with your project files.`);
  }
  function importText(str){
    const data=JSON.parse(str);
    if(!data||data.app!=='coding-jam-lab'||data.version!==1||![1,2,3].includes(data.day)||!data.state?.answers||typeof data.state.answers!=='object'||Array.isArray(data.state.answers))throw Error('Choose a Coding Jam Lab JSON backup.');
    if(data.day!==lesson.day&&data.day!==lesson.day-1)throw Error(`This app accepts Day ${lesson.day} backups${lesson.day>1?` or notes from Day ${lesson.day-1}`:''}.`);
    const before=state, incoming=data.state, a=incoming.answers;
    if(data.day===lesson.day){
      const src=clean(incoming);
      for(const [id,val] of Object.entries(src.answers))if(!before.answers[id]?.trim())state.answers[id]=val;
      state.done=phaseText.filter(s=>state.done.includes(s)||src.done.includes(s));
      if(!state.twist)state.twist=src.twist;
      if(!state.carryFrom)state.carryFrom=src.carryFrom;
      note(`Day ${lesson.day} notes restored into blank fields. Your current answers were kept.`);
    }else{
      const proposed={team:a.team,project:a.project,teamSize:a.teamSize,core:a.core};
      if(lesson.day===2)Object.assign(proposed,{platform:a.platform,input:a.input,output:a.output,invalid:a.invalid,expected:a.expected});
      if(lesson.day===3){
        const lines=[a.retest,a.observed,a.normalTest].filter(s=>typeof s==='string'&&s.trim()).slice(0,2);
        if(lines.length)proposed.baseline=lines.join('\n');
      }
      for(const [id,val] of Object.entries(proposed))if(!state.answers[id]?.trim()){
        const d=definitions.get(id);if(d){const norm=validText(d,val);if(norm)state.answers[id]=norm;}
      }
      state.carryFrom=data.day;
      note(`Day ${data.day} notes copied into blank fields. Your current answers were kept.`);
    }
    showStage(state.current,{hash:false});
  }
  function printPlan(){
    const selected=lesson.sections.map(s=>({title:s.title,items:stageFields(s).map(d=>[d.label,state.answers[d.id]]).filter(([,v])=>v?.trim())})).filter(s=>s.items.length);
    $('paper').innerHTML=`<h1>${esc(title)}</h1><p class="print-detail">${esc(lesson.wagba)}</p>${selected.length?selected.map(s=>`<h2>${esc(s.title)}</h2>${s.items.map(([label,v])=>`<div class="print-box"><strong>${esc(label)}</strong><p>${esc(v)}</p></div>`).join('')}`).join(''):'<p class="print-empty">You haven’t entered any notes yet.</p>'}`;
  }
  async function copyCode(btn){
    const value=btn.closest('details').querySelector('.prompt-text,.code-window code')?.textContent;
    if(!value)return;
    let copied=false;
    try{if(navigator.clipboard){await navigator.clipboard.writeText(value);copied=true;}}catch{}
    if(!copied){const b=document.createElement('textarea');b.value=value;b.style.position='fixed';b.style.opacity='0';document.body.append(b);b.select();try{copied=document.execCommand('copy');}catch{}b.remove();btn.focus();}
    const label=btn.textContent;btn.textContent=copied?'Copied':'Select and copy the text';if(copied)btn.dataset.copied='';
    setTimeout(()=>{if(btn.isConnected){btn.textContent=label;delete btn.dataset.copied;}},1800);
  }
  document.addEventListener('input',e=>{
    const id=e.target.dataset.field;if(!definitions.has(id))return;
    state.answers[id]=validText(definitions.get(id),e.target.value);persist();
  });
  document.addEventListener('change',e=>{
    if(e.target.id==='done-stage'){
      if(e.target.checked&&!state.done.includes(state.current))state.done.push(state.current);
      if(!e.target.checked)state.done=state.done.filter(v=>v!==state.current);
      persist();reflect();
    }
    if(e.target.tagName==='SELECT'&&definitions.has(e.target.dataset.field)){
      const id=e.target.dataset.field;state.answers[id]=validText(definitions.get(id),e.target.value);persist();
    }
  });
  document.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    const data=b.dataset;
    if(data.stage){showStage(data.stage,{focus:true});return;}
    if(data.move){showStage(phaseText[phaseText.indexOf(state.current)+(data.move==='prev'?-1:1)],{focus:true});return;}
    if('export' in data){exportBackup();return;}
    if('import' in data){$('backup-input').click();return;}
    if('print' in data){printPlan();window.print();return;}
    if('copy' in data){copyCode(b);return;}
    if('reveal' in data){state.twist=Number($('twist-select').value)||0;showTwist(true);persist();if(!state.twist)note('Choose a practice card first.',true);return;}
    if('useTwist' in data){const v=twists[state.twist-1], n=$('answer-twist');if(v&&!n.value.trim()){n.value=v[1];state.answers.twist=v[1];persist();n.focus();}else if(v){note('Your team already has a written twist. Your text was kept.');n.focus();}}
  });
  $('backup-input').addEventListener('change',async e=>{
    const f=e.target.files?.[0];e.target.value='';if(!f)return;
    try{if(f.size>BACKUP_MAX)throw Error('That file is too large to be a Coding Jam backup.');importText(await f.text());}
    catch(err){note(err instanceof SyntaxError?'That isn’t a readable Coding Jam backup.':err.message,true);}
  });
  window.addEventListener('beforeprint',printPlan);
  window.addEventListener('hashchange',()=>{const h=window.location.hash.slice(1);if(phaseText.includes(h)&&h!==state.current)showStage(h,{focus:true,hash:false});});
  const h=window.location.hash.slice(1);showStage(phaseText.includes(h)?h:state.current,{hash:false});
})();

</script>
</body></html>
