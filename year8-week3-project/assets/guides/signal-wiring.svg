<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">Connect the Grove red LED to P2</title><desc id="desc">With power off, seat the microbit in its Grove shield. Use a keyed four-wire Grove cable from the socket labelled P2 to the Grove red LED module. Ask the teacher to check before powering on.</desc><rect width="1000" height="430" fill="white"/><g font-family="Arial,sans-serif" fill="#192b24"><text x="30" y="38" font-size="26" font-weight="bold">POWER OFF → CONNECT → TEACHER CHECK → POWER ON</text><rect x="35" y="75" width="395" height="275" rx="18" fill="#e9f3ed" stroke="#246342" stroke-width="3"/><text x="57" y="104" font-size="22" font-weight="bold">GROVE SHIELD FOR micro:bit</text><rect x="75" y="125" width="245" height="136" rx="15" fill="#1d2532"/><text x="97" y="149" fill="white" font-size="18">micro:bit · LED face</text><g fill="#ff5656"><circle cx="167" cy="183" r="6"/><circle cx="197" cy="183" r="6"/><circle cx="227" cy="183" r="6"/><circle cx="197" cy="213" r="6"/></g><rect x="99" y="248" width="199" height="15" fill="#d6b44e"/><text x="57" y="302" font-size="20">Seat fully in the edge socket</text><rect x="354" y="189" width="64" height="55" rx="4" fill="white" stroke="#222" stroke-width="3"/><text x="366" y="222" font-size="24" font-weight="bold">P2</text><path d="M418 216 C500 216 521 180 630 180" fill="none" stroke="#242b30" stroke-width="17"/><path d="M420 216 C501 216 521 180 630 180" fill="none" stroke="#ebd368" stroke-width="4"/><rect x="620" y="159" width="50" height="42" rx="5" fill="#eee" stroke="#333" stroke-width="3"/><rect x="670" y="102" width="274" height="183" rx="12" fill="#cce5d6" stroke="#245e41" stroke-width="3"/><path d="M782 170 a28 28 0 0 1 56 0 v39 h-56z" fill="#e44343" stroke="#292929" stroke-width="3"/><path d="M795 210v27m30-27v27" stroke="#555" stroke-width="5"/><text x="700" y="134" font-size="23" font-weight="bold">GROVE RED LED</text><text x="691" y="265" font-size="18">Module, not a bare loose LED</text><text x="474" y="253" font-size="18">4-wire Grove cable</text><text x="455" y="281" font-size="17">Push the keyed plastic plugs.</text><text x="455" y="307" font-size="17">Do not force or pull the wires.</text><text x="30" y="386" font-size="20">Follow the printed P2 label. This is a connection diagram, not the exact socket layout.</text><text x="30" y="416" font-size="18">Use teacher-approved power. No crocodile clips. No Grove software extension is needed.</text></g></svg>
