<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380"><rect width="1000" height="380" rx="15" fill="#f4f7f2"/><g font-family="Arial,sans-serif" fill="#183124"><text x="24" y="37" font-size="25" font-weight="bold">PLUG IN THE PLASTIC CONNECTOR — NOT INDIVIDUAL WIRES</text><g transform="translate(25 67)"><text y="15" font-size="20" font-weight="bold">1. Disconnect power</text><rect y="52" width="260" height="80" rx="12" fill="#dce7df"/><text x="130" y="102" font-size="28" text-anchor="middle">USB + battery OFF</text><text y="175" font-size="17">Ask your teacher to seat the board.</text><text y="201" font-size="17">Never fit modules while powered.</text></g><g transform="translate(350 67)"><text y="15" font-size="20" font-weight="bold">2. Match the ridge</text><rect x="11" y="62" width="95" height="72" rx="6" fill="white" stroke="#263e31" stroke-width="3"/><path d="M36 62v-12h45v12" fill="white" stroke="#263e31" stroke-width="3"/><path d="M-20 80H8M-20 94H8M-20 109H8M-20 123H8" stroke="#976522" stroke-width="5"/><path d="M120 94h47m-12-10 13 10-13 10" fill="none" stroke="#08724e" stroke-width="5"/><rect x="180" y="53" width="79" height="92" fill="#d1ded6" stroke="#263e31" stroke-width="3"/><path d="M196 122V73h14V61h24v12h10v49z" fill="#293c32"/><text y="175" font-size="17">Push straight using the plastic end.</text><text y="201" font-size="17">If it resists, stop. Do not force it.</text></g><g transform="translate(695 67)"><text y="15" font-size="20" font-weight="bold">3. Connect both ends</text><rect y="58" width="103" height="77" rx="8" fill="#0e6f78"/><text x="51" y="103" text-anchor="middle" fill="white" font-size="17">MODULE</text><path d="M103 95h50" stroke="#b13333" stroke-width="8"/><rect x="155" y="58" width="109" height="77" rx="8" fill="#35493c"/><text x="209" y="103" text-anchor="middle" fill="white" font-size="17">SHIELD</text><text y="175" font-size="17">Check the labelled socket number.</text><text y="201" font-size="17">Teacher approves, then power on.</text></g><text x="24" y="326" font-size="15" fill="#56695c">Illustration of a keyed connection. Your connector’s ridge may differ: match the physical plug and socket.</text><text x="24" y="353" font-size="15" fill="#56695c">Unplug by holding the plastic housing, not the wires.</text></g></svg>
