t x="800" y="130" font-size="19" fill="#58635e" font-weight="400">5</text><text x="797" y="180" font-size="28" fill="#153d38" font-weight="700">31</text></g><g opacity="1"><rect x="900" y="143" width="90" height="55" rx="6" fill="#e0f0e4" stroke="#008b45" stroke-width="3"/><text x="930" y="130" font-size="19" fill="#58635e" font-weight="400">6</text><text x="927" y="180" font-size="28" fill="#153d38" font-weight="700">42</text></g><text x="35" y="270" font-size="29" fill="#153d38" font-weight="700">LINEAR: 5, 9, 13, 18, 24, 31, 42</text><text x="35" y="319" font-size="24" fill="#1a1a1a" font-weight="400">7 item checks. Found at index 6.</text><text x="35" y="407" font-size="29" fill="#153d38" font-weight="700">BINARY: 18, 31, 42</text><text x="35" y="456" font-size="24" fill="#1a1a1a" font-weight="400">3 item checks. Found at the same original index 6.</text><text x="35" y="542" font-size="25" fill="#008b45" font-weight="700">For this target, binary uses fewer item checks.</text><text x="35" y="594" font-size="23" fill="#1a1a1a" font-weight="400">Not always: target 5 takes linear 1 check, binary 3 checks.</text></g></svg>
