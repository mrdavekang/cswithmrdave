<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img"><title>Read the linear-search instructions</title><rect width="1100" height="650" fill="#fff"/><g font-family="Arial,sans-serif"><text x="35" y="52" font-size="32" fill="#153d38" font-weight="700">Read the linear-search instructions</text><text x="35" y="92" font-size="21" fill="#1a1a1a" font-weight="400">Supplied teaching pseudocode. Numbered lines help you follow the pointer.</text><text x="35" y="135" font-size="21" fill="#1a1a1a" font-weight="400">01   position ← 0</text><text x="35" y="169" font-size="21" fill="#1a1a1a" font-weight="400">02   found ← False</text><text x="35" y="203" font-size="21" fill="#1a1a1a" font-weight="400">03   WHILE position &lt; LEN(items) AND found = False</text><text x="35" y="237" font-size="21" fill="#1a1a1a" font-weight="400">04       IF items[position] = target THEN</text><text x="35" y="271" font-size="21" fill="#1a1a1a" font-weight="400">05           found ← True</text><text x="35" y="305" font-size="21" fill="#1a1a1a" font-weight="400">06       ELSE</text><text x="35" y="339" font-size="21" fill="#008b45" font-weight="700">07           position ← position + 1</text><text x="35" y="373" font-size="21" fill="#1a1a1a" font-weight="400">08       ENDIF</text><text x="35" y="407" font-size="21" fill="#1a1a1a" font-weight="400">09   ENDWHILE</text><text x="35" y="441" font-size="21" fill="#1a1a1a" font-weight="400">10   OUTPUT found</text><text x="35" y="510" font-size="24" fill="#153d38" font-weight="700">When index 1 stores 9 and target is 13:</text><text x="35" y="553" font-size="24" fill="#1a1a1a" font-weight="400">9 does not equal 13. Line 7 advances position to 2.</text><text x="35" y="601" font-size="22" fill="#1a1a1a" font-weight="400">← stores a value.      = compares values.      LEN counts items.</text></g></svg>
