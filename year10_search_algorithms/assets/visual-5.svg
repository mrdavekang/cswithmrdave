<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img"><title>Not found: target 20</title><rect width="1100" height="650" fill="#fff"/><g font-family="Arial,sans-serif"><text x="35" y="52" font-size="32" fill="#153d38" font-weight="700">Not found: target 20</text><text x="35" y="105" font-size="22" fill="#008b45" font-weight="700">LINEAR SEARCH</text><text x="35" y="155" font-size="29" fill="#153d38" font-weight="700">5, 9, 13, 18, 24, 31, 42</text><text x="35" y="200" font-size="23" fill="#1a1a1a" font-weight="400">All 7 values checked. No match. OUTPUT found gives False.</text><text x="35" y="285" font-size="22" fill="#008b45" font-weight="700">BINARY SEARCH — SORTED DATA</text><text x="35" y="335" font-size="25" fill="#1a1a1a" font-weight="400">18: target larger → low becomes 4</text><text x="35" y="383" font-size="25" fill="#1a1a1a" font-weight="400">31: target smaller → high becomes 4</text><text x="35" y="431" font-size="25" fill="#1a1a1a" font-weight="400">24: target smaller → high becomes 3</text><text x="35" y="495" font-size="24" fill="#153d38" font-weight="700">Now low = 4 and high = 3. No possible positions remain.</text><text x="35" y="551" font-size="23" fill="#1a1a1a" font-weight="400">OUTPUT found gives False. The original list is unchanged.</text><text x="35" y="607" font-size="22" fill="#1a1a1a" font-weight="400">One failed comparison is not enough to conclude “not found”.</text></g></svg>
