<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img"><title>Midpoint index is not midpoint value</title><rect width="1100" height="650" fill="#fff"/><g font-family="Arial,sans-serif"><text x="35" y="52" font-size="32" fill="#153d38" font-weight="700">Midpoint index is not midpoint value</text><text x="35" y="145" font-size="18" fill="#58635e" font-weight="400">Index</text><text x="35" y="195" font-size="18" fill="#58635e" font-weight="400">Value</text><g opacity="1"><rect x="120" y="158" width="90" height="55" rx="6" fill="#fff" stroke="#d7ded8" stroke-width="1"/><text x="150" y="145" font-size="19" fill="#58635e" font-weight="400">0</text><text x="147" y="195" font-size="28" fill="#153d38" font-weight="700">5</text></g><g opacity="1"><rect x="250" y="158" width="90" height="55" rx="6" fill="#fff" stroke="#d7ded8" stroke-width="1"/><text x="280" y="145" font-size="19" fill="#58635e" font-weight="400">1</text><text x="277" y="195" font-size="28" fill="#153d38" font-weight="700">9</text></g><g opacity="1"><rect x="380" y="158" width="90" height="55" rx="6" fill="#fff" stroke="#d7ded8" stroke-width="1"/><text x="410" y="145" font-size="19" fill="#58635e" font-weight="400">2</text><text x="407" y="195" font-size="28" fill="#153d38" font-weight="700">13</text></g><g opacity="1"><rect x="510" y="158" width="90" height="55" rx="6" fill="#e0f0e4" stroke="#008b45" stroke-width="3"/><text x="540" y="145" font-size="19" fill="#58635e" font-weight="400">3</text><text x="537" y="195" font-size="28" fill="#153d38" font-weight="700">18</text></g><g opacity="1"><rect x="640" y="158" width="90" height="55" rx="6" fill="#fff" stroke="#d7ded8" stroke-width="1"/><text x="670" y="145" font-size="19" fill="#58635e" font-weight="400">4</text><text x="667" y="195" font-size="28" fill="#153d38" font-weight="700">24</text></g><g opacity="1"><rect x="770" y="158" width="90" height="55" rx="6" fill="#fff" stroke="#d7ded8" stroke-width="1"/><text x="800" y="145" font-size="19" fill="#58635e" font-weight="400">5</text><text x="797" y="195" font-size="28" fill="#153d38" font-weight="700">31</text></g><g opacity="1"><rect x="900" y="158" width="90" height="55" rx="6" fill="#fff" stroke="#d7ded8" stroke-width="1"/><text x="930" y="145" font-size="19" fill="#58635e" font-weight="400">6</text><text x="927" y="195" font-size="28" fill="#153d38" font-weight="700">42</text></g><text x="35" y="285" font-size="28" fill="#153d38" font-weight="700">low = 0     high = 6</text><text x="35" y="343" font-size="29" fill="#008b45" font-weight="700">mid ← (0 + 6) DIV 2 = 3</text><text x="35" y="402" font-size="29" fill="#153d38" font-weight="700">items[mid] = items[3] = 18</text><text x="35" y="465" font-size="27" fill="#153d38" font-weight="700">Compare target 31 with VALUE 18 — not index 3.</text><text x="35" y="525" font-size="27" fill="#1a1a1a" font-weight="400">31 &gt; 18, so low ← mid + 1 = 4.</text><text x="35" y="592" font-size="22" fill="#1a1a1a" font-weight="400">Python midpoint: (low + high) // 2. Use the lower middle index.</text></g></svg>
