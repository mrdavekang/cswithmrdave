<script>
(function (root) {
  'use strict';
  const ref = /^[A-Z][1-9]\d*$/;
  const blank = x => x == null || String(x).trim() === '';
  const numeric = x => /^[-+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(String(x).trim());
  function evaluate(cells, address, overrides = {}) {
    const path = new Set(), cache = new Map();
    const fail = message => { throw new Error(message); };
    const read = a => {
      if (cache.has(a)) return cache.get(a);
      if (path.has(a)) fail('This formula refers back to ' + a + '. Use a different cell.');
      if (!ref.test(a) || +a.slice(1) > 12 || a[0] > 'H') fail(a + ' is outside this worksheet.');
      const v = String(Object.hasOwn(overrides, a) ? overrides[a] : cells[a] ?? '').trim();
      if (!v.startsWith('=')) return blank(v) ? null : numeric(v) ? Number(v) : v;
      path.add(a);
      const answer = parse(v.slice(1));
      path.delete(a);
      cache.set(a, answer);
      return answer;
    };
    const number = v => {
      if (v === null) return 0;
      if (typeof v !== 'number') fail('A cell in this calculation contains words. Check the cell references.');
      return v;
    };
    function parse(source) {
      const s = source.toUpperCase().replace(/[−–]/g, '-').replace(/×/g, '*').replace(/÷/g, '/');
      if (s.length > 256) fail('Keep this formula under 256 characters.');
      const tokens = [];
      let rest = s.trimStart();
      while (rest.length) {
        const token = rest.match(/^(?:[A-Z][1-9]\d*|[A-Z]+|\d+(?:\.\d*)?|\.\d+|[+*/(),:\-])/);
        if (!token) fail('Use numbers, cell names, +, -, *, /, brackets or SUM.');
        tokens.push(token[0]);
        rest = rest.slice(token[0].length).trimStart();
      }
      let i = 0;
      const peek = () => tokens[i];
      const take = t => peek() === t && (++i, true);
      const need = t => { if (!take(t)) fail('Expected ' + t + '. Check the formula bar.'); };
      function atom() {
        if (take('+')) return atom();
        if (take('-')) return -atom();
        if (take('(')) { const n = expression(); need(')'); return n; }
        if (take('SUM')) {
          need('(');
          let total = 0;
          do {
            if (ref.test(peek() || '') && tokens[i + 1] === ':') {
              const start = tokens[i++]; i++;
              const end = tokens[i++];
              if (!ref.test(end || '') || end[0] > 'H' || start[0] > 'H' ||
                  Math.max(+start.slice(1), +end.slice(1)) > 12) fail('Use a range on this sheet, for example B2:B4.');
              for (let c = Math.min(start.charCodeAt(0), end.charCodeAt(0)); c <= Math.max(start.charCodeAt(0), end.charCodeAt(0)); c++) {
                for (let r = Math.min(+start.slice(1), +end.slice(1)); r <= Math.max(+start.slice(1), +end.slice(1)); r++) {
                  const v = read(String.fromCharCode(c) + r);
                  if (typeof v === 'number') total += v;
                }
              }
            } else if (ref.test(peek() || '') && [',', ')'].includes(tokens[i + 1])) {
              const v = read(tokens[i++]); if (typeof v === 'number') total += v;
            } else total += expression();
          } while (take(','));
          need(')');
          return total;
        }
        const token = tokens[i++];
        if (ref.test(token || '')) return number(read(token));
        if (numeric(token)) return Number(token);
        fail('Enter a number or cell reference here. Example: =B2*C2');
      }
      function product() {
        let n = atom();
        for (;;) {
          if (take('*')) n *= atom();
          else if (take('/')) {
            const d = atom();
            if (d === 0) fail('You cannot divide by zero. Check the number you are dividing by.');
            n /= d;
          } else return n;
        }
      }
      function expression() {
        let n = product();
        for (;;) {
          if (take('+')) n += product();
          else if (take('-')) n -= product();
          else return n;
        }
      }
      const n = expression();
      if (i !== tokens.length) fail('There is extra text or a missing operator. Check the formula bar.');
      if (!Number.isFinite(n)) fail('This calculation is too large.');
      return n;
    }
    try { return { value: read(address) }; }
    catch (e) { return { error: e.message }; }
  }
  const shift = (value, delta) => /^\s*=/.test(value) ? value.replace(/\b([A-H])([1-9]\d*)\b/gi, (_, c, r) => c + (+r + delta)) : value;
  const api = { evaluate, shift, numeric };
  if (typeof module !== 'undefined') module.exports = api;
  else root.SheetEngine = api;
})(globalThis);

function closeFormulaBrackets(raw){

}

  draw();return {cells,template,commit,active:()=>active,select:setSelection,write(a,v){remember();cells[a]=v;draw();save()}};
}
function sheetHTML(){return '<section class="sheetbox" id="sheet" aria-label="Spreadsheet workspace"><div class="tools"><button data-tool="undo" aria-label="Undo">↶</button><button data-tool="edit">'+bi('Edit cell','编辑单元格')+'</button><button data-tool="bold" title="Bold"><b>B</b></button><button data-tool="size" title="Toggle larger text">A+</button><button data-tool="border" title="Borders">▦</button><button data-tool="center" title="Centre align">≡</button><button data-tool="sum" title="AutoSum">Σ SUM</button><button data-tool="reset">'+bi('Reset sheet','重设表格')+'</button></div><div class="formula"><output aria-label="Selected address"></output><b aria-hidden="true">fx</b><input aria-label="Formula bar" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"><button data-apply>'+bi('Apply','应用')+'</button></div><div class="tools">'+['=','+','-','*','/',':',')'].map(x=>'<button data-symbol="'+x+'">'+x+'</button>').join('')+'</div><div class="sheet-scroll"><table class="grid" aria-label="Spreadsheet cells"></table></div><div class="sheetnote">'+bi('Tap a cell, then Edit cell or use the formula bar. Drag across cells to select; drag the small green square to copy a formula. Keyboard: arrows, Shift + arrows, Enter.','点选单元格后用编辑按钮或公式栏。拖动选择范围；拖动绿色小方块复制公式。也可用方向键、Shift + 方向键和 Enter。')+'</div></section>'}
const PV=n=>Array.from({length:n},(_,i)=>2**(n-1-i));
function bitsHTML(bits,interactive=false){const values=PV(bits.length);return '<div class="bits" style="--n:'+bits.length+'">'+[...bits].map((bit,i)=>'<div><b>'+values[i]+'</b>'+(interactive?'<button data-bit="'+i+'" aria-label="Place '+values[i]+', bit '+bit+'" aria-pressed="'+(bit==='1')+'">'+bit+'</button>':'<span>'+bit+'</span>')+'</div>').join('')+'</div>'}
function pixelsHTML(bits,interactive=false){return '<div class="pixels">'+[...bits].map((b,i)=>interactive?'<button class="pixel '+(b==='1'?'on':'')+'" data-pixel="'+i+'" aria-pressed="'+(b==='1')+'" aria-label="Row '+(Math.floor(i/4)+1)+', column '+(i%4+1)+'"></button>':'<span class="pixel '+(b==='1'?'on':'')+'" role="img" aria-label="'+(b==='1'?'Filled':'White')+'"></span>').join('')+'</div>'}
function prompt(q){return q.p|| (q.type==='encode'?T('Set the bits to make '+q.n+'.','设置二进制位，使总值等于 '+q.n+'。'):T('What denary number do these bits represent?','这些二进制位表示哪个十进制数？'))}
const compare=(a,b)=>typeof a==='number'&&typeof b==='number'&&Math.abs(a-b)<1e-8;
function formulaOK(q,view){
  const raw=String(view.cells[q.cell]??'').trim();
  if(!raw.startsWith('='))return T('Put a formula beginning with = in '+q.cell+'. A typed total will not update.','在 '+q.cell+' 输入以 = 开头的公式。手输结果不能自动更新。');
  const live=SheetEngine.evaluate(view.cells,q.cell);
  if(live.error)return T(live.error,'检查运算符、括号、引用地址和除数。请查看公式栏。');
  if(q.f.includes('SUM(')&&!/\bSUM\s*\(/i.test(raw))return T('Use SUM for this step. Check the first and last cells in the range.','此题请使用 SUM，并检查范围的首尾单元格。');
  const ideal={...view.template,[q.cell]:q.f};
  if(state.stage===4||state.stage===6&&state.idx[6]===8)Object.assign(ideal,{D2:'=B2*C2',D3:'=B3*C3',D4:'=SUM(D2:D3)',D7:'=B5+B6',[q.cell]:q.f});
  const overrides=[{},Object.fromEntries(Object.keys(ideal).filter(a=>typeof ideal[a]==='number').map((a,i)=>[a,i+9])),Object.fromEntries(Object.keys(ideal).filter(a=>typeof ideal[a]==='number').map((a,i)=>[a,2*i+13]))];
  const refCells=Object.keys(ideal).filter(a=>typeof ideal[a]==='number');
  for(let i=0;i<refCells.length;i++)overrides.push({[refCells[i]]:Number(ideal[refCells[i]])+5+i});
  const student={...ideal,[q.cell]:raw};
  if(overrides.some(o=>!compare(SheetEngine.evaluate(student,q.cell,o).value,SheetEngine.evaluate(ideal,q.cell,o).value)))return T('Check the cell references and operation in '+q.cell+'. The formula must work when the numbers change.','检查 '+q.cell+' 的地址和运算符。修改输入后，公式仍需正确。');
  if(state.stage===4&&['D4','D8'].includes(q.cell)&&(!compare(live.value,SheetEngine.evaluate(ideal,q.cell,Object.fromEntries(refCells.map(a=>[a,Number(view.cells[a])]))).value)))return T('This formula has the right structure. Check the earlier cost or funding cells it depends on.','公式结构正确。请检查它依赖的前面费用或资金单元格。');
  return null;
}

    [T('Knowledge — remember','知识：记住'),T('I can read a cell address.','我能读出单元格地址。'),T('I can recognise the four operators.','我能识别四种运算符。'),T('I can recognise a SUM range.','我能识别 SUM 的范围。')],

function visuals(){
  return '<div class="cards"><article class="panel"><h2>'+bi('1 · Write a formula','1 · 写公式')+'</h2><p>'+bi('Select E2. The cell shows the result. The formula bar shows =C2*D2. = starts the calculation; C2 is the quantity, * means multiply, and D2 is the price.','选中 E2。单元格显示结果，公式栏显示 =C2*D2。= 开始计算，C2 是数量，* 表示乘，D2 是单价。')+'</p></article><article class="panel"><h2>'+bi('2 · Select a range','2 · 选范围')+'</h2><p>'+bi('Drag from E2 to E3. Look for E2:E3 in the address box. Select E4 to see how SUM uses this range.','从 E2 拖到 E3。查看地址框里的 E2:E3。点 E4，看看 SUM 怎样引用这个范围。')+'</p></article><article class="panel"><h2>'+bi('3 · Predict, change, compare','3 · 预测、修改、对比')+'</h2><p>'+bi('Predict the cost of three notebooks. Set C2 to 3. Compare E2 with F2: which one changes?','预测三本笔记本的价格。将 C2 改为 3。比较 E2 与 F2：哪一个会变？')+'</p><button id="demoChange">'+bi('Set quantity to 3','把数量改为 3')+'</button></article></div><details class="panel" id="represent"><summary>'+bi('Worked examples: 4 bits, 8 bits and pixels','四位、八位和像素示例')+'</summary><div class="cards"><article class="visual"><h2>4 bits · 四位</h2>'+bitsHTML('0101')+'<p>'+bi('Add the columns with a 1: 4 + 1 = 5.','相加值为 1 的列：4 + 1 = 5。')+'</p></article><article class="visual"><h2>8 bits · 八位</h2>'+bitsHTML('00010001')+'<p>'+bi('The same rule works: 16 + 1 = 17. Keep the leading zeros.','规则相同：16 + 1 = 17。保留开头的零。')+'</p></article><article class="visual"><h2>'+bi('Check a pixel row','核对像素行')+'</h2>'+pixelsHTML('0011')+'<p>'+bi('Point to each square in order. White, white, filled, filled gives 0011.','依次指向每个方格：白、白、填色、填色，得到 0011。')+'</p></article></div></details>';
}
function render(){
  const s=state.stage,i=state.idx[s]||0,bank=banks[s],q=bank?.[i],id=s+':'+i,info=sheetInfo(s,i);
  const n=q?.width||q?.bits?.length;
  const rec=q?(state.records[id]||={}):{};
  document.body.classList.toggle('bilingual',state.zh);$('#lang').setAttribute('aria-pressed',state.zh);
  $('#nav').innerHTML=stages.map((x,j)=>'<button data-stage="'+j+'" '+(j===s?'aria-current="step"':'')+'>'+bi(x,stageZh[j])+'</button>').join('');
  const count=bank?.filter((_,j)=>state.records[s+':'+j]?.status==='done').length||0;
  let content='';
  if(q){
    const pix=q.type==='make'?16:q.code?.replace(/ /g,'').length;
    rec.bits??=q.type==='encode'?'0'.repeat(n):undefined;rec.pixels??=pix?'0'.repeat(pix):undefined;
    content='<div class="action"><div class="eyebrow">'+bi('What you need to do','你需要完成的任务')+'</div><h2>'+B(prompt(q))+'</h2></div>';
    if(q.type==='encode'||q.bits)content+='<div class="visual" id="bits">'+bitsHTML(rec.bits||q.bits,q.type==='encode')+'</div>';
    if(q.pixels||pix)content+='<p>'+B(rule)+'</p>'+(q.code?'<p><code>'+escapeHTML(q.code)+'</code></p>':'')+'<div class="visual" id="pixels">'+pixelsHTML(rec.pixels||q.pixels,!!pix)+'</div>';
    if(q.opt)content+='<div class="choices">'+q.opt.map((o,j)=>'<button data-choice="'+j+'" aria-pressed="'+(rec.answer===j)+'">'+escapeHTML(o)+'</button>').join('')+'</div>';
    else if((q.answer!=null&&!['encode','draw'].includes(q.type))||q.write||q.type==='make')content+='<label>'+bi(q.write?'Your short response':q.type==='make'?'Your four rows':'Your answer',q.write?'简短作答':q.type==='make'?'你的四行编码':'你的答案')+(q.type==='make'||q.write?'<textarea id="response" class="answer">'+escapeHTML(rec.answer)+'</textarea>':'<input id="response" class="answer" autocomplete="off" value="'+escapeHTML(rec.answer)+'">')+'</label>';
    if(n||q.pixels||pix)content+='<details class="hint"><summary>'+bi('Space for working','草稿区')+'</summary><label>'+bi('Write your sums or rows here, or work on paper.','在这里写算式或每行编码，也可在纸上计算。')+'<textarea class="answer" id="working">'+escapeHTML(rec.working)+'</textarea></label></details>';
    const hint=q.hint||(q.f?T(q.f.includes('SUM(')?'Use =SUM( and a range such as E2:E3, then close the bracket.':'Start with =. Read the two cell references in the question and choose the operator.','从 = 开始。看题目中的单元格地址，选择运算符或 SUM。'):n?T('Add the place values above the 1s, or choose the values that add to your target.','相加 1 上方的位值，或选择能加成目标的位值。'):T('Read the instruction again and check the named cells or the picture key.','重读任务，检查指定单元格或图片规则。'));
    content+='<details class="hint"><summary>'+bi('Show a hint','查看提示')+'</summary><p>'+B(hint)+'</p></details><button class="primary" id="check">'+bi('Check my work','检查我的答案')+'</button><div class="feedback" id="feedback" aria-live="polite"></div>';
  }else if(s===2){content='<div class="action"><h2>'+bi('Watch the sheet work, then try it','观察表格怎样工作，然后试一试')+'</h2><p>'+bi('The notebook model below is an example. Your event budget uses different cells and values.','下面的笔记本表格是示例。你的活动预算使用不同的单元格和值。')+'</p></div>'}
  else content=pageIntro(s);
  if(s===4)content='<p>'+bi('Games afternoon: make a budget that still works when you change what you buy.','游戏下午：制作一份更改采购内容后仍能自动更新的预算。')+'</p>'+content;
  if(s===3||s===4)content='<p><small>'+bi('★ Core task · Try it, check it, then move on.','★ 核心任务：先尝试并检查，再继续。')+'</small></p>'+content;
  if(s===9)content='<p>'+bi('Finish the lesson with this 15-question review. Your teacher will share any game links separately.','用这 15 道题完成复习。老师会另行分享游戏链接。')+'</p>'+content;
  root.innerHTML='<section class="panel"><img class="char" src="../year7-revision-practice/assets/characters/illustration-9.png" alt=""><div class="eyebrow">'+bi('Revision studio','复习工作室')+'</div><h1 tabindex="-1">'+bi(stages[s],stageZh[s])+'</h1>'+
  (bank?'<p>'+bi('Task '+(i+1)+' of '+bank.length+' · '+count+' checked off','第 '+(i+1)+' 题，共 '+bank.length+' 题；已核对 '+count+' 题')+'</p><div class="progress" aria-hidden="true"><i style="width:'+(count/bank.length*100)+'%"></i></div><div class="steps" aria-label="Choose a task">'+bank.map((_,j)=>{let k=state.records[s+':'+j]?.status;return '<button data-task="'+j+'" class="'+(k||'')+'" '+(i===j?'aria-current="step"':'')+'>'+((s===3&&core1.includes(j)||s===4&&core2.includes(j))?'★':'')+(j+1)+(k==='done'?' ✓':k==='tried'?' ·':'')+'</button>'}).join('')+'</div>':'')+'</section>'+
  (info?'<div class="work"><article class="panel">'+(s===3?'<div class="eyebrow">'+miniNames[Math.floor(i/5)]+'</div>':'')+content+'</article>'+sheetHTML()+'</div>':'<article class="panel">'+content+'</article>')+
  (s===2?visuals():'')+
  '<div class="foot"><button id="prev" '+(!s&&!i?'disabled':'')+'>'+bi('← Back','返回')+'</button>'+(q&&i+1<bank.length?'<button id="next">'+bi('Next task →','下一题')+'</button>':'')+(s<9?'<button class="primary" id="advance">'+bi(stages[s+1]+' →',stageZh[s+1])+'</button>':'<button id="advance">'+bi('Return to lesson','返回课程')+'</button>')+'</div>';
  sheetView=info?mountSheet(info,(a)=>{transient.selection=a}):null;
  for(const btn of document.querySelectorAll('[data-stage]'))btn.onclick=()=>go(+btn.dataset.stage);
  for(const btn of root.querySelectorAll('[data-task]'))btn.onclick=()=>go(s,+btn.dataset.task);
  $('#prev').onclick=()=>i?go(s,i-1):go(Math.max(s-1,0));
  if($('#next'))$('#next').onclick=()=>go(s,i+1);
  $('#advance').onclick=()=>go(s<9?s+1:0);
  for(const el of root.querySelectorAll('[data-ref]'))el.onchange=()=>{state.reflect[el.dataset.ref]=el.value;save()};
  if($('#reflectText'))$('#reflectText').oninput=e=>{state.reflect.note=e.target.value;save()};
  if($('#demoChange'))$('#demoChange').onclick=()=>{sheetView.write('C2',3);sheetView.select('E2');const a=display(SheetEngine.evaluate(sheetView.cells,'E2').value)||'—',b=display(SheetEngine.evaluate(sheetView.cells,'F2').value)||'—';$('#demoChange').insertAdjacentHTML('afterend','<p role="status">'+bi('Compare the cells: E2 shows '+a+'; F2 shows '+b+'.','比较单元格：E2 显示 '+a+'；F2 显示 '+b+'。')+'</p>');$('#demoChange').disabled=true};
  if(!q)return;
  const setMsg=(m,k)=>{const f=$('#feedback');f.innerHTML=B(m);f.className='feedback '+k};
  if(rec.status)setMsg(rec.message||T('Saved on this device.','已存到本机。'),rec.status==='done'?'good':'retry');
  if($('#response'))$('#response').oninput=e=>{rec.answer=e.target.value;save()};
  if($('#working'))$('#working').oninput=e=>{rec.working=e.target.value;save()};
  for(const b of root.querySelectorAll('[data-choice]'))b.onclick=()=>{rec.answer=+b.dataset.choice;root.querySelectorAll('[data-choice]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));save()};
  if($('#bits'))$('#bits').onclick=e=>{const a=e.target.closest('[data-bit]');if(!a)return;let j=+a.dataset.bit;rec.bits=[...rec.bits].map((v,k)=>k===j?(v==='1'?'0':'1'):v).join('');a.textContent=rec.bits[j];a.setAttribute('aria-pressed',rec.bits[j]==='1');a.setAttribute('aria-label','Place '+PV(n)[j]+', bit '+rec.bits[j]);save()};
  if($('#pixels'))$('#pixels').onclick=e=>{const a=e.target.closest('[data-pixel]');if(!a)return;let j=+a.dataset.pixel;rec.pixels=[...rec.pixels].map((v,k)=>k===j?(v==='1'?'0':'1'):v).join('');a.classList.toggle('on',rec.pixels[j]==='1');a.setAttribute('aria-pressed',rec.pixels[j]==='1');save()};
  $('#check').onclick=()=>{
    sheetView?.commit();let error=null;
    if(q.f)error=formulaOK(q,sheetView);
    if(!error&&q.select&&sheetView.active()!==q.select)error=T('Select the requested cell on the grid before checking.','请先在表格中选定题目要求的单元格。');
    for(const edit of [q.edit,q.edit2])if(!error&&edit&&String(sheetView.cells[edit[0]])!==String(edit[1]))error=T('Change '+edit[0]+' to '+edit[1]+' and apply the edit first.','请先把 '+edit[0]+' 改为 '+edit[1]+' 并应用。');
    const norm=x=>String(x??'').trim().toUpperCase().replace(/\s+/g,' ');
    const answer=q.type==='encode'?rec.bits:q.type==='draw'?rec.pixels:rec.answer;
    if(!error&&q.type==='make'&&(!/^(?:[01]{4}\s+){3}[01]{4}$/.test(String(answer||'').trim())||String(answer).replace(/\s/g,'')!==rec.pixels))error=T('Write four groups of four bits, with a space or new line between groups. Compare each row with your picture.','写四组四位编码，组间用空格或换行，再逐行核对。');
    if(!error&&q.write&&!norm(answer))error=T('Add a short response before checking.','请先写下简短答案。');
    if(!error&&q.answer!=null&&(typeof q.answer==='number'?answer!==q.answer:norm(answer)!==norm(q.answer)))error=q.why?T(q.why,'再试一次：对照提示检查你的选择。'):q.type==='draw'?T('Compare each square to its bit. Start at the left of the first row.','逐格对照比特，从第一行左边开始。'):T('Not quite. Check the instruction and use the hint. You can try again or continue.','还不对。请看提示；你可以重试或继续。');
    rec.attempts=(rec.attempts||0)+1;rec.status=error?'tried':'done';
    rec.message=error||(q.write?T('Response saved for review.','已保存作答，待核对。'):T('That works. Your progress is saved on this device.','正确。进度已保存到本机。'));
    save();const b=root.querySelector('[data-task="'+i+'"]');if(b){b.classList.remove('done','tried');b.classList.add(rec.status);b.textContent=b.textContent.replace(/ [✓·]$/,'')+(error?' ·':' ✓')}
    const total=bank.filter((_,j)=>state.records[s+':'+j]?.status==='done').length;
    root.querySelector('.progress i').style.width=total/bank.length*100+'%';
    root.querySelector('.progress').previousElementSibling.innerHTML=bi('Task '+(i+1)+' of '+bank.length+' · '+total+' checked off','第 '+(i+1)+' 题，共 '+bank.length+' 题；已核对 '+total+' 题');
    setMsg(rec.message,error?'retry':'good');
  };
}
$('#lang').onclick=()=>{sheetView?.commit();state.zh=!state.zh;save();render()};
$('#theme').onchange=e=>{state.theme=validTheme(e.target.value);applyTheme();save()};
