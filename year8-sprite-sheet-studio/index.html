<body><header class="top"><a class="brand" href="./">▦ Sprite Sheet Studio</a><span>Year 8 · Week 11 Practical</span><label><input type="checkbox" id="zh"> 中文 support</label><span id="saveStatus" role="status"></span></header>
<nav aria-label="Lesson stages" id="steps"></nav><main id="main"></main>
<template id="intro"><article class="card"><span class="kicker">01 · MISSION</span><h1>Same hero. New expression.</h1><p class="lead">Yesterday your character could stand still. Today it can react. Make a face for the moment your character spots a clue, finds a prize or hears a strange noise.</p>
<div id="opening"></div><div class="concept"><b>WAGBA</b> We are getting better at creating consistent sprite frames and using a program to play them in order.<br><b>Knowledge:</b> sprite, frame, layer, sprite sheet, costume, loop and delay.<br><b>Skills:</b> duplicate and edit frames, export a sheet and animate the frames.<br><b>Understanding:</b> explain how frame order, alignment and delay change what a player sees.</div><p class="zh" lang="zh-Hans">今天让角色动起来。保留身体，改变表情，再用程序按顺序播放画格。</p>
<form id="entry"><label>Full name <input name="pupil" maxlength="80" required></label><label>Class <input name="group" value="8T" maxlength="12" required></label><button class="primary">Start / continue →</button></form></article></template>
<template id="learn"><article class="card"><span class="kicker">02 · DO NOW / TYPES OF LEARNING</span><h1>Layer, frame or sheet?</h1><div id="explainer"></div>
<div class="concept"><p><b>Layer:</b> one editable part of a picture, like the eyes over the body.</p><p><b>Frame (board):</b> one complete picture shown at one moment. It can have several layers.</p><p><b>Sprite sheet:</b> one PNG that packs several frames into a grid. It is still an image: code decides when to show each frame.</p><p><b>Costume:</b> Scratch’s name for one look of a sprite. For today, upload each frame as a separate costume.</p></div><p class="zh" lang="zh-Hans">图层 = 图片的一部分；画格 = 一个时刻的完整图片；精灵图表 = 把多张画格放进一张图；造型 = Scratch 中角色的一种外观。</p>
<p><b>Quick check:</b> You change two eye pixels but keep the body. What are you editing?</p><div class="actions" id="check"><button data-check="yes">A layer within one frame</button><button data-check="no">The entire sprite sheet</button></div><p id="feedback" role="status"></p><p><b>Types of Learning:</b> Name a frame and a layer (knowledge). Point to what you will edit (skill). Explain why the body should stay in place (understanding). If one is hard, watch the teacher’s first duplicate before drawing.</p><button class="primary next" data-go="2">Open Main Task 1 →</button></article></template>
<template id="draw"><article class="card"><span class="kicker">03 · MAIN TASK 1 / 20 MINUTES</span><h1>Make three expression frames</h1><p><b>Choose your starting character.</b> An editable JSON keeps the layers. A PNG is flattened, so add details on the Face layer. Absent last lesson? Use the sample or draw directly here. No paper catch-up.</p>
<div class="actions"><label class="button">Import yesterday’s JSON or this lesson’s backup <input id="json" type="file" accept=".json,application/json" hidden></label><label class="button">Import 16 × 16 PNG <input id="png" type="file" accept="image/png" hidden></label><button id="sample">Use Garden Guide sample</button></div>
<p class="instruction"><b>1.</b> Name your first frame <b>Calm</b>. <b>2.</b> Select <b>Duplicate frame</b>. Rename the copy <b>Surprised</b> and change its eyes or mouth on Face. <b>3.</b> Duplicate again and make <b>Happy</b>. Keep the body in the same place. Three distinct frames are the target; four or five are a stretch.</p><p class="zh" lang="zh-Hans">导入昨天的角色，或用示例。不用画纸稿。复制画格，只改 Face（脸）图层。做出三种不同表情，身体位置不变。</p>
<div id="editor"></div>
<section class="timeline" aria-label="Animation frames"><div class="actions"><b>Animation boards</b><button id="dup">＋ Duplicate frame</button><button id="left">Move earlier</button><button id="right">Move later</button><button id="remove">Remove selected</button></div><div id="frames"></div><div class="actions"><label>Selected frame name <input id="frameName" maxlength="30"></label><label>Seconds per frame <input type="number" id="delay" min=".1" max="2" step=".1"></label><button id="play" class="primary">▶ Play preview</button></div><div id="preview"></div><p id="drawStatus" role="status"></p></section><button class="primary next" data-go="3">Open Main Task 2 →</button></article></template>
<template id="code"><article class="card"><span class="kicker">04 · MAIN TASK 2 / 17 MINUTES</span><h1>Animate one sprite, not three</h1><p>Download the sheet as your evidence. For Scratch, use the <b>separate PNG costumes</b>. For Python, use the <b>sheet and the starter script</b>. Choose just one route.</p><div class="actions"><button id="sheet" class="primary">Download sprite sheet PNG</button><button id="backup">Download editable backup</button></div><div id="sheetPreview"></div>
<div class="routes"><section><h2>A · Scratch (recommended)</h2><ol><li>Download the individual frames below. Open the <a href="https://scratch.mit.edu/projects/editor/" target="_blank" rel="noopener noreferrer">Scratch editor</a>.</li><li>Choose one sprite. In its <b>Costumes</b> tab, open the add-costume menu and select <b>Upload Costume</b>. Upload the frames to that same sprite in order. Remove its original costume.</li><li>Open <b>Code</b>. Build this stack. Set the first costume to your first frame and use a delay of about 0.4 seconds. Click the green flag.</li><li>Observe two loops. Save the project as an <b>.sb3</b> using <b>File → Save to your computer</b>.</li></ol><div id="costumes" class="actions"></div><div class="block-stack" aria-label="Scratch block sequence"><div class="events">when green flag clicked</div><div class="looks">switch costume to [first frame ▾]</div><div class="control">forever<div class="control wait">wait (0.4) seconds</div><div class="looks">next costume</div></div></div><small>Block diagram, not a screenshot. Events is yellow, Looks is purple, Control is orange.</small></section>
<section><h2>B · Python (challenge route)</h2><p>Use a laptop with Python 3 and Tkinter already available. Run <code>python -m tkinter</code> to check; if it does not open a window, choose Scratch. No new install is needed for the Scratch route.</p><ol><li>Save <b>sprite_sheet.png</b> and <b>animate.py</b> together.</li><li>Open the script in IDLE, choose <b>Run → Run Module</b> and watch the preview.</li><li>Change <code>DELAY_MS</code> and predict how it changes the animation. Run again. Then try changing the order in <code>ORDER</code>.</li><li>Save your edited <b>.py</b> file with the sheet as evidence.</li></ol><button id="python">Download animate.py</button><pre><code>frame = (frame + 1) % len(ORDER)
window.after(DELAY_MS, tick)</code></pre><p><code>after</code> schedules the next frame without freezing the window.</p></section></div>
<p class="zh" lang="zh-Hans">任选一条路线。Scratch：把每一张画格 PNG 上传为同一个角色的造型，用循环和等待播放。Python：把 PNG 图表和脚本放在同一个文件夹。</p><label>Test note: “I used ___. I changed ___ from ___ to ___. I saw ___.”<textarea id="testNote" maxlength="1000"></textarea></label><button class="primary next" data-go="4">Open Pit Stop & Go Further →</button></article></template>
<template id="reflect"><article class="card"><span class="kicker">05 · LEARNING PIT STOP / GO FURTHER</span><h1>What changed on screen?</h1><p>Show one board with layers (knowledge), play your animation (skill), and explain why it doesn’t jump (understanding).</p><label>Where are you now? <select id="phase"><option value="">Choose one</option><option>New learning</option><option>Consolidating</option><option>Treading water</option><option>Drowning / need a demo</option></select></label><label>My evidence or next step <textarea id="reflectNote" maxlength="1000" placeholder="I can ___ because ___. Next I will ___." ></textarea></label>
<h2>Go Further</h2><ol><li><b>Timing director:</b> hold Surprise for longer than the other expressions. Compare both versions. Scratch: use explicit costume switches and separate waits. Python: choose a delay from a list inside <code>tick()</code>.</li><li><b>Game reaction:</b> add one or two boards. In Scratch, use a key press to trigger a brief reaction (stop your looping script first, so the two scripts don’t fight). Python: give a key its own callback to toggle the animation.</li><li><b>Art challenge:</b> try the same frames on a dark background. Improve one colour or edge without moving the body.</li></ol><button class="primary next" data-go="5">Open Plenary & submission →</button></article></template>
<template id="finish"><article class="card"><span class="kicker">06 · PLENARY / SUBMIT</span><h1>Show the sheet and show it moving</h1><ol><li>Point to one layer, one frame and the whole sheet. How are they different?</li><li>What happens if the delay is halved?</li><li>Check your body stays in the same position for two loops.</li></ol><label>Exit answer <textarea id="exitNote" maxlength="1000"></textarea></label><div class="actions"><button id="finalSheet">Download sheet PNG</button><button id="finalBackup">Download editable backup</button><button id="evidence">Download evidence note</button></div><p>In <b>Year 8T Computer Science → Classwork → Week 11 Practical – Sprite Sheet Studio</b>, open <b>02. Submit Your Sprite Sheet and Animation</b>. Attach your sheet, your evidence note and your Scratch <b>.sb3</b> or edited Python <b>.py</b>. Select <b>Turn in</b>. Keep the JSON for future editing.</p><button class="primary next" data-go="6">Start the 30-correct review →</button></article></template>
<template id="review"><article class="card"><span class="kicker">07 · RETRIEVAL PRACTICE</span><h1>Expression arcade</h1><p>15 questions, repeated in shuffled rounds. Aim for <b>30 correct answers</b>. Errors do not take away points; read the feedback and keep going.</p><div id="external"></div><div id="quiz"></div></article></template>
<noscript>This studio needs JavaScript to draw, save and preview frames.</noscript></body></html>
