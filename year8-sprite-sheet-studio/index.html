<template id="intro"><article class="card"><span class="kicker">01 · MISSION</span><h1>Same hero. New expression.</h1><p class="lead">Yesterday your character could stand still. Today it can react. Make a face for the moment your character spots a clue, finds a prize or hears a strange noise.</p>
<div id="opening"></div><div class="concept"><b>WAGBA</b> We are getting better at creating consistent sprite frames and using a program to play them in order.<br><b>Knowledge:</b> sprite, frame, layer, sprite sheet, costume, loop and delay.<br><b>Skills:</b> duplicate and edit frames, export a sheet and animate the frames.<br><b>Understanding:</b> explain how frame order, alignment and delay change what a player sees.</div><p class="zh" lang="zh-Hans">今天让角色动起来。保留身体，改变表情，再用程序按顺序播放画格。</p>
<form id="entry"><label>Full name <input name="pupil" maxlength="80" required></label><label>Class <input name="group" value="8T" maxlength="12" required></label><button class="primary">Start / continue →</button></form></article></template>
<template id="before"><article class="card"><span class="kicker">BEFORE DO NOW</span><h1>Three ways to get better today</h1><p>Everyone uses all three types of learning. You don’t need to rate yourself before you’ve tried anything.</p><div class="learning-grid">
<section><h2>K · Knowledge</h2><p><b>Remember</b> what a layer, a frame and a sprite sheet are. Point to one of each in the starter.</p></section>
<section><h2>S · Skills</h2><p><b>Practise</b> duplicating a frame, changing only its face and playing it back. Change one thing at a time.</p></section>
<section><h2>U · Understanding</h2><p><b>Explain</b> why an aligned body or a longer pause helps the player read the expression.</p></section></div><p class="zh" lang="zh-Hans">知识：记住图层、画格和精灵图表的区别。技能：复制画格、修改表情并播放。理解：解释对齐或延长停顿为什么能帮助玩家看清表情。</p><button class="primary next" data-go="learn">Start Do Now →</button></article></template>
<template id="learn"><article class="card"><span class="kicker">DO NOW</span><h1>Layer, frame or sheet?</h1><div id="explainer"></div>
<div class="concept"><p><b>Layer:</b> one editable part of a picture, like the eyes over the body.</p><p><b>Frame (board):</b> one complete picture shown at one moment. It can have several layers.</p><p><b>Sprite sheet:</b> one PNG that packs several frames into a grid. It is still an image: code decides when to show each frame.</p><p><b>Costume:</b> Scratch’s name for one look of a sprite. For today, upload each frame as a separate costume.</p></div><p class="zh" lang="zh-Hans">图层 = 图片的一部分；画格 = 一个时刻的完整图片；精灵图表 = 把多张画格放进一张图；造型 = Scratch 中角色的一种外观。</p>
<section class="concept"><h2>1 · Think, pair, share</h2><p>Look at the three Garden Guide frames above. Think for 20 seconds, then compare ideas with a partner.</p><ol><li><b>Read the expression:</b> Which frame looks most surprised? Point to one pixel detail that makes you think so.</li><li><b>Plan a fourth frame:</b> Garden Guide hears a noise and looks worried. What would you change on the Face layer, and what would you keep the same so players recognise the character?</li></ol>
<p class="zh" lang="zh-Hans">和同伴讨论：哪张画格最像惊讶？指一个像素细节。如果要做出担心的表情，你会改变脸上的什么？什么会保持不变？</p>
<label for="starterNote">Optional: save one idea from your discussion</label><textarea id="starterNote" maxlength="350" placeholder="I would change ___ but keep ___ because ___."></textarea></section>
<h2>2 · Four quick checks</h2><p>Choose one answer per question. Read the feedback and try again if needed. You can go on when all four are correct.</p><div id="starterChecks" class="learning-grid do-now-grid"></div><p id="starterProgress" role="status"></p><button class="primary next" data-go="types">Types of Learning →</button></article></template>
<template id="types"><article class="card"><span class="kicker">TYPES OF LEARNING · AFTER DO NOW</span><h1>What help will you use next?</h1>
<div class="learning-grid"><section><h2>K · Knowledge</h2><p><b>Remember</b> how a layer differs from a whole frame.</p></section><section><h2>S · Skills</h2><p><b>Practise</b> making a copy of a board and changing the face.</p></section><section><h2>U · Understanding</h2><p><b>Explain</b> why an aligned body makes the expression easier to see.</p></section></div>
<section id="starterEvidence" class="concept"></section>
<p>Use your Do Now answer to pick a starting strategy. A correct answer shows you recognised the idea; it does not yet show you can do it in the editor.</p><p class="zh" lang="zh-Hans">先看自己的热身答案，再选择下一步。不计分，也不用评价还没练习过的技能。</p>
<fieldset id="learningChoices"><legend>Choose one way to start</legend></fieldset><div id="learningNext" class="concept" role="status"></div>
<button class="primary next" data-go="history">Open the arcade archive →</button></article></template>
<template id="model1"><article class="card"><span class="kicker">BEFORE MAIN TASK 1 · READ, LOOK, DISCUSS</span><h1>Change the expression, not the character</h1><p>Imagine Garden Guide spots a clue. We want players to notice its surprise, not think it teleported. <b>Duplicate the whole frame</b> to keep the body in the same place. Then edit only the <b>Face layer on the copy</b>. Each frame keeps its own layers, so changing the copy does not change Calm.</p><div id="modelFrames"></div><div class="concept"><b>Worked example:</b> Calm → duplicate → open the mouth on Face → Surprised. The body and leaf stay on the same squares. You can keep your own character and choose different expressions.</div><p class="zh" lang="zh-Hans">先复制整个画格，再只改副本的 Face（脸）图层。比较三张图：身体和叶子的位置没有改变。</p><div id="frameDiscussion"></div><button class="primary next" data-go="draw">Main Task 1: make my frames →</button></article></template>
<template id="draw"><article class="card"><span class="kicker">MAIN TASK 1B · YOUR OWN ANIMATION</span><h1>Draw and animate your own sprite</h1>
<p>The Garden Guide stays in the practice task. Start with the blank board below or import a sprite <b>you made in theory</b>. Your JSON keeps the layers. If you import a flattened 16 × 16 PNG, add new expression details on Face. No paper catch-up needed.</p>
<div class="actions"><label class="button">Import my theory JSON or studio backup <input id="json" type="file" accept=".json,application/json" hidden></label><label class="button">Import my 16 × 16 PNG <input id="png" type="file" accept="image/png" hidden></label><button id="blank">Start a blank project</button></div>
<p class="instruction"><b>1 · Make a character.</b> Pick a job, such as space mechanic or cave explorer. On <b>Body</b>, draw a simple outline and one recognisable detail. On <b>Face</b>, draw its first expression.<br><b>2 · Give it a reaction.</b> Imagine it spots something unexpected. Duplicate the first board, edit the eyes or mouth on the copy, and name it. Duplicate once more for a third distinct expression of your choice.<br><b>3 · Check it moves.</b> Play the three boards in order. Keep the body in place so only the expression changes. Watch a full cycle before moving on.</p>
<p class="zh" lang="zh-Hans">示例只用于练习。用空白画格画自己的角色，或导入你在理论课做的作品。在 Body 图层画身体，在 Face 图层画脸。复制画格，做出三种表情。身体位置不变，播放一整轮。</p>
<div id="editor"></div>
<section class="timeline" aria-label="Animation frames"><div class="actions"><b>Animation boards</b><button id="dup">＋ Duplicate frame</button><button id="left">Move earlier</button><button id="right">Move later</button><button id="remove">Remove selected</button></div><div id="frames"></div><div class="actions"><label>Selected frame name <input id="frameName" maxlength="30"></label><label>Seconds per frame <input type="number" id="delay" min=".1" max="2" step=".1"></label><button id="play" class="primary">▶ Play preview</button></div><div id="preview"></div><p id="drawStatus" role="status"></p></section><button class="primary next" data-go="model2">See how code plays the frames →</button></article></template>
<template id="model2"><article class="card"><span class="kicker">BEFORE MAIN TASK 2 · PREDICT, PLAY, EXPLAIN</span><h1>One character. Three pictures. One loop.</h1><p>The <b>sprite sheet stores</b> the pictures; the <b>program plays</b> them. Scratch switches costumes on one sprite. The Python starter shows one frame, then schedules the next. Both repeat the same idea: <b>show → wait → move to the next frame</b>.</p><div id="loopFrames"></div><details><summary>See the Scratch or Python syntax</summary><div class="routes"><section><h2>Scratch model</h2><div class="block-stack"><div class="events">when green flag clicked</div><div class="looks">switch costume to [Calm ▾]</div><div class="control">forever<div class="control wait">wait (0.4) seconds</div><div class="looks">next costume</div></div></div><p>Wait and next costume both belong <b>inside</b> the loop.</p></section><section><h2>Python starter setting</h2><pre><code>DELAY_MS = 400
ORDER = [0, 1, 2]</code></pre><p>400 milliseconds is 0.4 seconds. Each number is a frame index. The downloaded starter reads these settings.</p></section></div></details><div id="speedDiscussion"></div><div class="concept"><div class="actions"><button id="slowModel">Play example · 0.8 s per frame</button><button id="fastModel">Play example · 0.4 s per frame</button><button id="stopModel">Stop example</button></div><div id="loopPreview"></div></div><p class="zh" lang="zh-Hans">精灵图表只保存图片，程序决定播放顺序和速度。先预测，再比较两种速度。每次都按 Calm → Surprised → Happy 播放。</p><button class="primary next" data-go="code">Main Task 2: animate my frames →</button></article></template>
<template id="code"></template>
<template id="reflect"><article class="card"><span class="kicker">LEARNING PIT STOP · AFTER MAIN TASK 2</span><h1>What can you show now?</h1>
<div class="actions pit-tabs" aria-label="Reflection steps"><button id="pitShowWork" aria-pressed="true">1 · Look at your work</button><button id="pitShowPhase" aria-pressed="false">2 · How did it feel?</button></div>
<section id="pitWork"><h2>Your animation evidence</h2><div id="pitEvidence"></div>
<label for="pitCompare" id="pitPrompt">What changed between your two tests, and what stayed the same?</label><p id="pitStem" class="subtle"></p>
<p class="zh" lang="zh-Hans">先看证据。两次测试中，什么变了？什么没变？如果没有完成两次测试，说出你能展示什么，以及下一步要测什么。</p><textarea id="pitCompare" maxlength="500"></textarea>
<button id="pitContinue" class="primary">Continue to how it felt →</button><p id="pitWorkHint" role="status"></p></section>
<section id="pitFeel" hidden><h2>Which learning phase fits?</h2><p>Choose a phase based on your experience, not your score or speed. You can remember the facts and still need help with the tools.</p><p class="zh" lang="zh-Hans">选择符合你体验的阶段，不按分数或速度。可以用中文或关键词解释。</p>
<fieldset id="phaseOptions"><legend>Choose your learning phase</legend></fieldset><p id="nextAdvice" class="concept" role="status"></p>
<label for="reflectNote">Why does that phase fit? Point to one thing you did or need help with.</label><p><b>Sentence starter:</b> “At first I ___. Now I can ___ / I still need help with ___.” Short labels or “explained to my teacher” are fine.</p><textarea id="reflectNote" maxlength="1000"></textarea><button class="primary next" data-go="extend">Go Further →</button></section></article></template>
<template id="extend"><article class="card"><span class="kicker">GO FURTHER</span><h1>Make a reaction the player can read</h1><p>If you have time, choose a challenge. Save an editable backup before you change your work. Compare both versions before deciding which is better. If you finish one, try another.</p><p class="zh" lang="zh-Hans">先备份，再选一项挑战。比较修改前后的效果，写几个关键词说明你的决定。</p><div id="extensions"></div><button class="primary next" data-go="plenary">Plenary →</button></article></template>
<template id="plenary"><article class="card"><span class="kicker">PLENARY</span><h1>Show the sheet and show it moving</h1><ol><li>Point to one layer, one frame and the whole sheet. How are they different?</li><li>What happens if the delay is halved?</li><li>Check your body stays in the same position for two loops.</li></ol><label>Exit answer <textarea id="exitNote" maxlength="1000"></textarea></label><button class="primary next" data-go="finish">Save & submit →</button></article></template>
<template id="finish"><article class="card"><span class="kicker">SAVE & SUBMIT</span><h1>Send your evidence</h1><div class="actions"><button class="primary" id="evidencePDF">Save evidence as PDF</button><button id="finalSheet">Download sheet PNG</button><button id="finalBackup">Download editable backup</button><button id="evidence">Download evidence note</button></div><p><b>PDF:</b> Select <b>Save evidence as PDF</b>. In the print window, choose <b>Save as PDF</b> as the destination (or the system’s PDF option), then save.</p><p class="zh" lang="zh-Hans">点击 Save evidence as PDF，在打印窗口选择另存为 PDF。提交时，也附上 PNG 和 Scratch 或 Python 文件。</p><p>In <b>Year 8T Computer Science → Classwork → Week 11 Practical – Sprite Sheet Studio</b>, open <b>02. Submit Your Sprite Sheet and Animation</b>. Attach your evidence PDF (or text evidence note), your sheet PNG and your Scratch <b>.sb3</b> or edited Python <b>.py</b>. Select <b>Turn in</b>. Keep the JSON for future editing.</p><button class="primary next" data-go="review">Start the 30-correct review →</button></article></template>
<template id="review"><article class="card"><span class="kicker">RETRIEVAL PRACTICE</span><h1>Expression arcade</h1><p>Choose <b>one</b> route. All use the same 15 questions and aim for <b>30 correct answers</b> through repeat practice. If you use a game link, attach a screenshot of your 30-correct result in Teams with your evidence note. If a link is unavailable, use the studio quiz below.</p><div class="actions"><a class="button" target="_blank" rel="noopener noreferrer" href="https://www.gimkit.com/join/6aeb0b26a6fcdc2e1735a06c">Play Gimkit · Fishtopia</a><a class="button" target="_blank" rel="noopener noreferrer" href="https://play.blooket.com/play?hwId=6aeb0bcb0647ecff871fe1b7">Play Blooket homework</a></div><h2>Or practise in the studio</h2><p>Errors do not take away points. Read the feedback and keep going.</p><div id="quiz"></div></article></template>
