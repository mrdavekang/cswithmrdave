<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Everyone gets a turn</title><desc id="desc">Start with four unique player names. Example draws select Luna, Nova, Orbit and Pixel in that order. Remove each selected name from the waiting pool before the next draw. The pool shrinks from 4 to 3 to 2 to 1 to 0. Stop when empty.</desc><defs><marker id="arrow-096b70" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#096b70" stroke-width="1.8"/></marker><marker id="arrow-6746ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#6746ab" stroke-width="1.8"/></marker><marker id="arrow-ad6507" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#ad6507" stroke-width="1.8"/></marker><marker id="arrow-ad3443" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#ad3443" stroke-width="1.8"/></marker><marker id="arrow-23619c" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#23619c" stroke-width="1.8"/></marker></defs><rect width="1600" height="1000" fill="white"/><text xml:space="preserve" style="white-space:pre" x="56" y="54" font-size="23" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#096b70">GAME CLUB  /  PYTHON LISTS</text><text xml:space="preserve" style="white-space:pre" x="56" y="126" font-size="54" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#182e37">Everyone gets a turn</text><text xml:space="preserve" style="white-space:pre" x="56" y="174" font-size="27" font-family="Raleway, Arial, sans-serif" font-weight="500" text-anchor="start" fill="#50636c">Extension: choose without repeating a player. Example draw order shown.</text><rect x="56" y="220" width="358.5" height="162" rx="18" fill="#ffffff" stroke="#c8d5d9" stroke-width="2"/><g transform="translate(235.25,266) scale(0.7)"><rect x="-30" y="-30" width="60" height="65" rx="20" fill="#23619c" stroke="none" stroke-width="2"/><rect x="-23" y="-15" width="46" height="25" rx="11" fill="#dff3ff" stroke="none" stroke-width="2"/><path d="M-17,-8 Q-5,-16 9,-10" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M-18,29 L-18,43 M18,29 L18,43" stroke="#23619c" stroke-width="15" stroke-linecap="round"/></g><text xml:space="preserve" style="white-space:pre" x="235.25" y="320" font-size="34" font-family="Raleway, Arial, sans-serif" font-weight="750" text-anchor="middle" fill="#182e37">Nova</text><text xml:space="preserve" style="white-space:pre" x="235.25" y="364" font-size="26" font-family="Raleway, Arial, sans-serif" font-weight="700" text-anchor="middle" fill="#50636c">index 0</text><rect x="432.5" y="220" width="358.5" height="162" rx="18" fill="#ffffff" stroke="#c8d5d9" stroke-width="2"/><g transform="translate(611.75,266) scale(0.7)"><rect x="-30" y="-30" width="60" height="65" rx="20" fill="#6746ab" stroke="none" stroke-width="2"/><rect x="-23" y="-15" width="46" height="25" rx="11" fill="#dff3ff" stroke="none" stroke-width="2"/><path d="M-17,-8 Q-5,-16 9,-10" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M-18,29 L-18,43 M18,29 L18,43" stroke="#6746ab" stroke-width="15" stroke-linecap="round"/></g><text xml:space="preserve" style="white-space:pre" x="611.75" y="320" font-size="34" font-family="Raleway, Arial, sans-serif" font-weight="750" text-anchor="middle" fill="#182e37">Luna</text><text xml:space="preserve" style="white-space:pre" x="611.75" y="364" font-size="26" font-family="Raleway, Arial, sans-serif" font-weight="700" text-anchor="middle" fill="#50636c">index 1</text><rect x="809" y="220" width="358.5" height="162" rx="18" fill="#ffffff" stroke="#c8d5d9" stroke-width="2"/><g transform="translate(988.25,266) scale(0.7)"><rect x="-30" y="-30" width="60" height="65" rx="20" fill="#ad6507" stroke="none" stroke-width="2"/><rect x="-23" y="-15" width="46" height="25" rx="11" fill="#dff3ff" stroke="none" stroke-width="2"/><path d="M-17,-8 Q-5,-16 9,-10" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M-18,29 L-18,43 M18,29 L18,43" stroke="#ad6507" stroke-width="15" stroke-linecap="round"/></g><text xml:space="preserve" style="white-space:pre" x="988.25" y="320" font-size="34" font-family="Raleway, Arial, sans-serif" font-weight="750" text-anchor="middle" fill="#182e37">Pixel</text><text xml:space="preserve" style="white-space:pre" x="988.25" y="364" font-size="26" font-family="Raleway, Arial, sans-serif" font-weight="700" text-anchor="middle" fill="#50636c">index 2</text><rect x="1185.5" y="220" width="358.5" height="162" rx="18" fill="#ffffff" stroke="#c8d5d9" stroke-width="2"/><g transform="translate(1364.75,266) scale(0.7)"><rect x="-30" y="-30" width="60" height="65" rx="20" fill="#096b70" stroke="none" stroke-width="2"/><rect x="-23" y="-15" width="46" height="25" rx="11" fill="#dff3ff" stroke="none" stroke-width="2"/><path d="M-17,-8 Q-5,-16 9,-10" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M-18,29 L-18,43 M18,29 L18,43" stroke="#096b70" stroke-width="15" stroke-linecap="round"/></g><text xml:space="preserve" style="white-space:pre" x="1364.75" y="320" font-size="34" font-family="Raleway, Arial, sans-serif" font-weight="750" text-anchor="middle" fill="#182e37">Orbit</text><text xml:space="preserve" style="white-space:pre" x="1364.75" y="364" font-size="26" font-family="Raleway, Arial, sans-serif" font-weight="700" text-anchor="middle" fill="#50636c">index 3</text><text xml:space="preserve" style="white-space:pre" x="56" y="429" font-size="21" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#50636c">EXAMPLE TURN</text><text xml:space="preserve" style="white-space:pre" x="446" y="429" font-size="21" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#50636c">CHOSEN PLAYER</text><text xml:space="preserve" style="white-space:pre" x="836" y="429" font-size="21" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#50636c">STILL WAITING AFTER THIS TURN</text><rect x="56" y="454" width="1488" height="72" rx="12" fill="#f3f6f7" stroke="none" stroke-width="2"/><text xml:space="preserve" style="white-space:pre" x="82" y="500" font-size="30" font-family="Raleway, Arial, sans-serif" font-weight="750" text-anchor="start" fill="#182e37">Round 1</text><g transform="translate(454,486) scale(0.48)"><rect x="-30" y="-30" width="60" height="65" rx="20" fill="#6746ab" stroke="none" stroke-width="2"/><rect x="-23" y="-15" width="46" height="25" rx="11" fill="#dff3ff" stroke="none" stroke-width="2"/><path d="M-17,-8 Q-5,-16 9,-10" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M-18,29 L-18,43 M18,29 L18,43" stroke="#6746ab" stroke-width="15" stroke-linecap="round"/></g><text xml:space="preserve" style="white-space:pre" x="499" y="500" font-size="30" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#6746ab">Luna</text><text xml:space="preserve" style="white-space:pre" x="836" y="500" font-size="29" font-family="Raleway, Arial, sans-serif" font-weight="700" text-anchor="start" fill="#182e37">Nova   |   Pixel   |   Orbit</text><rect x="56" y="541" width="1488" height="72" rx="12" fill="#f3f6f7" stroke="none" stroke-width="2"/><text xml:space="preserve" style="white-space:pre" x="82" y="587" font-size="30" font-family="Raleway, Arial, sans-serif" font-weight="750" text-anchor="start" fill="#182e37">Round 2</text><g transform="translate(454,573) scale(0.48)"><rect x="-30" y="-30" width="60" height="65" rx="20" fill="#23619c" stroke="none" stroke-width="2"/><rect x="-23" y="-15" width="46" height="25" rx="11" fill="#dff3ff" stroke="none" stroke-width="2"/><path d="M-17,-8 Q-5,-16 9,-10" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M-18,29 L-18,43 M18,29 L18,43" stroke="#23619c" stroke-width="15" stroke-linecap="round"/></g><text xml:space="preserve" style="white-space:pre" x="499" y="587" font-size="30" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#23619c">Nova</text><text xml:space="preserve" style="white-space:pre" x="836" y="587" font-size="29" font-family="Raleway, Arial, sans-serif" font-weight="700" text-anchor="start" fill="#182e37">Pixel   |   Orbit</text><rect x="56" y="628" width="1488" height="72" rx="12" fill="#f3f6f7" stroke="none" stroke-width="2"/><text xml:space="preserve" style="white-space:pre" x="82" y="674" font-size="30" font-family="Raleway, Arial, sans-serif" font-weight="750" text-anchor="start" fill="#182e37">Round 3</text><g transform="translate(454,660) scale(0.48)"><rect x="-30" y="-30" width="60" height="65" rx="20" fill="#096b70" stroke="none" stroke-width="2"/><rect x="-23" y="-15" width="46" height="25" rx="11" fill="#dff3ff" stroke="none" stroke-width="2"/><path d="M-17,-8 Q-5,-16 9,-10" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M-18,29 L-18,43 M18,29 L18,43" stroke="#096b70" stroke-width="15" stroke-linecap="round"/></g><text xml:space="preserve" style="white-space:pre" x="499" y="674" font-size="30" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#096b70">Orbit</text><text xml:space="preserve" style="white-space:pre" x="836" y="674" font-size="29" font-family="Raleway, Arial, sans-serif" font-weight="700" text-anchor="start" fill="#182e37">Pixel</text><rect x="56" y="715" width="1488" height="72" rx="12" fill="#e7f4f1" stroke="none" stroke-width="2"/><text xml:space="preserve" style="white-space:pre" x="82" y="761" font-size="30" font-family="Raleway, Arial, sans-serif" font-weight="750" text-anchor="start" fill="#182e37">Round 4</text><g transform="translate(454,747) scale(0.48)"><rect x="-30" y="-30" width="60" height="65" rx="20" fill="#ad6507" stroke="none" stroke-width="2"/><rect x="-23" y="-15" width="46" height="25" rx="11" fill="#dff3ff" stroke="none" stroke-width="2"/><path d="M-17,-8 Q-5,-16 9,-10" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M-18,29 L-18,43 M18,29 L18,43" stroke="#ad6507" stroke-width="15" stroke-linecap="round"/></g><text xml:space="preserve" style="white-space:pre" x="499" y="761" font-size="30" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#ad6507">Pixel</text><text xml:space="preserve" style="white-space:pre" x="836" y="761" font-size="29" font-family="Raleway, Arial, sans-serif" font-weight="700" text-anchor="start" fill="#096b70">[]  No players left</text><text xml:space="preserve" style="white-space:pre" x="56" y="844" font-size="31" font-family="Raleway, Arial, sans-serif" font-weight="750" text-anchor="start" fill="#182e37">After each choice, remove that player from the waiting list.</text><rect x="56" y="890" width="1488" height="64" rx="14" fill="#e7f4f1" stroke="none" stroke-width="2"/><text xml:space="preserve" style="white-space:pre" x="80" y="932" font-size="27" font-family="Raleway, Arial, sans-serif" font-weight="700" text-anchor="start" fill="#096b70">Each name is unique. Stop when the waiting list is empty; do not choose from [].</text></svg>