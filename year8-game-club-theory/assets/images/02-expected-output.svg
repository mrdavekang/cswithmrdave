<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">What are we building?</title><desc id="desc">The console displays Players ready: 4, Nova, Luna, Pixel, Orbit, then Captain: Luna. The captain name is one possible random result, not a required fixed answer.</desc><defs><marker id="arrow-096b70" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#096b70" stroke-width="1.8"/></marker><marker id="arrow-6746ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#6746ab" stroke-width="1.8"/></marker><marker id="arrow-ad6507" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#ad6507" stroke-width="1.8"/></marker><marker id="arrow-ad3443" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#ad3443" stroke-width="1.8"/></marker><marker id="arrow-23619c" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#23619c" stroke-width="1.8"/></marker></defs><rect width="1600" height="1000" fill="white"/><text xml:space="preserve" style="white-space:pre" x="56" y="54" font-size="23" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#096b70">GAME CLUB  /  PYTHON LISTS</text><text xml:space="preserve" style="white-space:pre" x="56" y="126" font-size="54" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#182e37">What are we building?</text><text xml:space="preserve" style="white-space:pre" x="56" y="174" font-size="27" font-family="Raleway, Arial, sans-serif" font-weight="500" text-anchor="start" fill="#50636c">A player roster and a random captain selector.</text><rect x="56" y="236" width="850" height="565" rx="22" fill="#182e37" stroke="none" stroke-width="2"/><text xml:space="preserve" style="white-space:pre" x="86" y="280" font-size="21" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#bfe9e5">CONSOLE  /  EXPECTED OUTPUT</text><text xml:space="preserve" style="white-space:pre" x="88" y="344" font-size="39" font-family="Menlo, DejaVu Sans Mono, monospace" font-weight="600" text-anchor="start" fill="#ffffff">Players ready: 4</text><text xml:space="preserve" style="white-space:pre" x="88" y="404" font-size="39" font-family="Menlo, DejaVu Sans Mono, monospace" font-weight="600" text-anchor="start" fill="#ffffff">Nova</text><text xml:space="preserve" style="white-space:pre" x="88" y="464" font-size="39" font-family="Menlo, DejaVu Sans Mono, monospace" font-weight="600" text-anchor="start" fill="#ffffff">Luna</text><text xml:space="preserve" style="white-space:pre" x="88" y="524" font-size="39" font-family="Menlo, DejaVu Sans Mono, monospace" font-weight="600" text-anchor="start" fill="#ffffff">Pixel</text><text xml:space="preserve" style="white-space:pre" x="88" y="584" font-size="39" font-family="Menlo, DejaVu Sans Mono, monospace" font-weight="600" text-anchor="start" fill="#ffffff">Orbit</text><rect x="74" y="606" width="814" height="53" rx="9" fill="#2d4b53" stroke="none" stroke-width="2"/><text xml:space="preserve" style="white-space:pre" x="88" y="644" font-size="39" font-family="Menlo, DejaVu Sans Mono, monospace" font-weight="600" text-anchor="start" fill="#ffffff">Captain: Luna</text><circle cx="958" cy="308" r="23" fill="#096b70"/><text xml:space="preserve" style="white-space:pre" x="958" y="317" font-size="27" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="middle" fill="#ffffff">1</text><text xml:space="preserve" style="white-space:pre" x="998" y="318" font-size="31" font-family="Raleway, Arial, sans-serif" font-weight="750" text-anchor="start" fill="#182e37">Count the current players</text><text xml:space="preserve" style="white-space:pre" x="998" y="363" font-size="27" font-family="Raleway, Arial, sans-serif" font-weight="500" text-anchor="start" fill="#50636c">The count matches the list length.</text><circle cx="958" cy="450" r="23" fill="#096b70"/><text xml:space="preserve" style="white-space:pre" x="958" y="459" font-size="27" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="middle" fill="#ffffff">2</text><text xml:space="preserve" style="white-space:pre" x="998" y="460" font-size="31" font-family="Raleway, Arial, sans-serif" font-weight="750" text-anchor="start" fill="#182e37">Print one name per line</text><text xml:space="preserve" style="white-space:pre" x="998" y="505" font-size="27" font-family="Raleway, Arial, sans-serif" font-weight="500" text-anchor="start" fill="#50636c">Keep the same order as the list.</text><circle cx="958" cy="626" r="23" fill="#6746ab"/><text xml:space="preserve" style="white-space:pre" x="958" y="635" font-size="27" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="middle" fill="#ffffff">3</text><text xml:space="preserve" style="white-space:pre" x="998" y="636" font-size="31" font-family="Raleway, Arial, sans-serif" font-weight="750" text-anchor="start" fill="#182e37">Choose a listed player</text><text xml:space="preserve" style="white-space:pre" x="998" y="682" font-size="27" font-family="Raleway, Arial, sans-serif" font-weight="500" text-anchor="start" fill="#50636c">Luna is one possible captain.</text><text xml:space="preserve" style="white-space:pre" x="998" y="721" font-size="27" font-family="Raleway, Arial, sans-serif" font-weight="500" text-anchor="start" fill="#50636c">Another listed player is valid too.</text><rect x="56" y="890" width="1488" height="64" rx="14" fill="#e7f4f1" stroke="none" stroke-width="2"/><text xml:space="preserve" style="white-space:pre" x="80" y="932" font-size="27" font-family="Raleway, Arial, sans-serif" font-weight="700" text-anchor="start" fill="#096b70">The roster output is fixed for this list. The captain can change between runs.</text></svg>