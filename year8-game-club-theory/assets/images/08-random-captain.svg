<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Random does not mean a fixed answer</title><desc id="desc">Random choice selects an element from a non-empty players list. Nova Luna Pixel and Orbit are valid. Example runs choose Luna, Luna and Nova, showing that consecutive repeats are possible.</desc><defs><marker id="arrow-096b70" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#096b70" stroke-width="1.8"/></marker><marker id="arrow-6746ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#6746ab" stroke-width="1.8"/></marker><marker id="arrow-ad6507" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#ad6507" stroke-width="1.8"/></marker><marker id="arrow-ad3443" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#ad3443" stroke-width="1.8"/></marker><marker id="arrow-23619c" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#23619c" stroke-width="1.8"/></marker></defs><rect width="1600" height="1000" fill="white"/><text xml:space="preserve" style="white-space:pre" x="56" y="54" font-size="23" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#096b70">GAME CLUB  /  PYTHON LISTS</text><text xml:space="preserve" style="white-space:pre" x="56" y="126" font-size="54" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#182e37">Random does not mean a fixed answer</text><text xml:space="preserve" style="white-space:pre" x="56" y="174" font-size="27" font-family="Raleway, Arial, sans-serif" font-weight="500" text-anchor="start" fill="#50636c">Choose from the current roster, not from a made-up index range.</text><rect x="56" y="228" width="358.5" height="186" rx="18" fill="#ffffff" stroke="#c8d5d9" stroke-width="2"/><g transform="translate(235.25,286) scale(0.7)"><rect x="-30" y="-30" width="60" height="65" rx="20" fill="#23619c" stroke="none" stroke-width="2"/><rect x="-23" y="-15" width="46" height="25" rx="11" fill="#dff3ff" stroke="none" stroke-width="2"/><path d="M-17,-8 Q-5,-16 9,-10" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M-18,29 L-18,43 M18,29 L18,43" stroke="#23619c" stroke-width="15" stroke-linecap="round"/></g><text xml:space="preserve" style="white-space:pre" x="235.25" y="348" font-size="34" font-family="Raleway, Arial, sans-serif" font-weight="750" text-anchor="middle" fill="#182e37">Nova</text><text xml:space="preserve" style="white-space:pre" x="235.25" y="396" font-size="26" font-family="Raleway, Arial, sans-serif" font-weight="700" text-anchor="middle" fill="#50636c">index 0</text><rect x="432.5" y="228" width="358.5" height="186" rx="18" fill="#ffffff" stroke="#c8d5d9" stroke-width="2"/><g transform="translate(611.75,286) scale(0.7)"><rect x="-30" y="-30" width="60" height="65" rx="20" fill="#6746ab" stroke="none" stroke-width="2"/><rect x="-23" y="-15" width="46" height="25" rx="11" fill="#dff3ff" stroke="none" stroke-width="2"/><path d="M-17,-8 Q-5,-16 9,-10" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M-18,29 L-18,43 M18,29 L18,43" stroke="#6746ab" stroke-width="15" stroke-linecap="round"/></g><text xml:space="preserve" style="white-space:pre" x="611.75" y="348" font-size="34" font-family="Raleway, Arial, sans-serif" font-weight="750" text-anchor="middle" fill="#182e37">Luna</text><text xml:space="preserve" style="white-space:pre" x="611.75" y="396" font-size="26" font-family="Raleway, Arial, sans-serif" font-weight="700" text-anchor="middle" fill="#50636c">index 1</text><rect x="809" y="228" width="358.5" height="186" rx="18" fill="#ffffff" stroke="#c8d5d9" stroke-width="2"/><g transform="translate(988.25,286) scale(0.7)"><rect x="-30" y="-30" width="60" height="65" rx="20" fill="#ad6507" stroke="none" stroke-width="2"/><rect x="-23" y="-15" width="46" height="25" rx="11" fill="#dff3ff" stroke="none" stroke-width="2"/><path d="M-17,-8 Q-5,-16 9,-10" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M-18,29 L-18,43 M18,29 L18,43" stroke="#ad6507" stroke-width="15" stroke-linecap="round"/></g><text xml:space="preserve" style="white-space:pre" x="988.25" y="348" font-size="34" font-family="Raleway, Arial, sans-serif" font-weight="750" text-anchor="middle" fill="#182e37">Pixel</text><text xml:space="preserve" style="white-space:pre" x="988.25" y="396" font-size="26" font-family="Raleway, Arial, sans-serif" font-weight="700" text-anchor="middle" fill="#50636c">index 2</text><rect x="1185.5" y="228" width="358.5" height="186" rx="18" fill="#ffffff" stroke="#c8d5d9" stroke-width="2"/><g transform="translate(1364.75,286) scale(0.7)"><rect x="-30" y="-30" width="60" height="65" rx="20" fill="#096b70" stroke="none" stroke-width="2"/><rect x="-23" y="-15" width="46" height="25" rx="11" fill="#dff3ff" stroke="none" stroke-width="2"/><path d="M-17,-8 Q-5,-16 9,-10" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M-18,29 L-18,43 M18,29 L18,43" stroke="#096b70" stroke-width="15" stroke-linecap="round"/></g><text xml:space="preserve" style="white-space:pre" x="1364.75" y="348" font-size="34" font-family="Raleway, Arial, sans-serif" font-weight="750" text-anchor="middle" fill="#182e37">Orbit</text><text xml:space="preserve" style="white-space:pre" x="1364.75" y="396" font-size="26" font-family="Raleway, Arial, sans-serif" font-weight="700" text-anchor="middle" fill="#50636c">index 3</text><rect x="56" y="458" width="850" height="236" rx="20" fill="#f3f6f7" stroke="#c8d5d9" stroke-width="2"/><text xml:space="preserve" style="white-space:pre" x="82" y="497" font-size="21" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#50636c">CHOOSE ONE ELEMENT FROM A NON-EMPTY LIST</text><text xml:space="preserve" style="white-space:pre" x="82" y="551" font-size="27" font-family="Menlo, DejaVu Sans Mono, monospace" font-weight="500" text-anchor="start" fill="#182e37">import random</text><text xml:space="preserve" style="white-space:pre" x="82" y="593" font-size="27" font-family="Menlo, DejaVu Sans Mono, monospace" font-weight="500" text-anchor="start" fill="#182e37">players = [&quot;Nova&quot;, &quot;Luna&quot;, &quot;Pixel&quot;, &quot;Orbit&quot;]</text><text xml:space="preserve" style="white-space:pre" x="82" y="635" font-size="27" font-family="Menlo, DejaVu Sans Mono, monospace" font-weight="500" text-anchor="start" fill="#182e37">captain = random.choice(players)</text><text xml:space="preserve" style="white-space:pre" x="82" y="677" font-size="27" font-family="Menlo, DejaVu Sans Mono, monospace" font-weight="500" text-anchor="start" fill="#182e37">print(&quot;Captain:&quot;, captain)</text><rect x="960" y="458" width="584" height="216" rx="20" fill="#e7f4f1" stroke="none" stroke-width="2"/><text xml:space="preserve" style="white-space:pre" x="990" y="505" font-size="31" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#096b70">Any listed player is valid</text><text xml:space="preserve" style="white-space:pre" x="990" y="552" font-size="28" font-family="Raleway, Arial, sans-serif" font-weight="500" text-anchor="start" fill="#182e37">Nova, Luna, Pixel or Orbit.</text><text xml:space="preserve" style="white-space:pre" x="990" y="596" font-size="28" font-family="Raleway, Arial, sans-serif" font-weight="500" text-anchor="start" fill="#182e37">Not a name outside this roster.</text><text xml:space="preserve" style="white-space:pre" x="56" y="737" font-size="30" font-family="Raleway, Arial, sans-serif" font-weight="750" text-anchor="start" fill="#182e37">Three possible runs</text><rect x="56" y="764" width="476" height="92" rx="14" fill="#f3f6f7" stroke="none" stroke-width="2"/><text xml:space="preserve" style="white-space:pre" x="80" y="800" font-size="20" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#50636c">RUN 1</text><text xml:space="preserve" style="white-space:pre" x="80" y="836" font-size="29" font-family="Menlo, DejaVu Sans Mono, monospace" font-weight="650" text-anchor="start" fill="#182e37">Captain: Luna</text><rect x="562" y="764" width="476" height="92" rx="14" fill="#f0ebf8" stroke="none" stroke-width="2"/><text xml:space="preserve" style="white-space:pre" x="586" y="800" font-size="20" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#50636c">RUN 2</text><text xml:space="preserve" style="white-space:pre" x="586" y="836" font-size="29" font-family="Menlo, DejaVu Sans Mono, monospace" font-weight="650" text-anchor="start" fill="#182e37">Captain: Luna</text><rect x="1068" y="764" width="476" height="92" rx="14" fill="#f3f6f7" stroke="none" stroke-width="2"/><text xml:space="preserve" style="white-space:pre" x="1092" y="800" font-size="20" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#50636c">RUN 3</text><text xml:space="preserve" style="white-space:pre" x="1092" y="836" font-size="29" font-family="Menlo, DejaVu Sans Mono, monospace" font-weight="650" text-anchor="start" fill="#182e37">Captain: Nova</text><rect x="56" y="890" width="1488" height="64" rx="14" fill="#e7f4f1" stroke="none" stroke-width="2"/><text xml:space="preserve" style="white-space:pre" x="80" y="932" font-size="27" font-family="Raleway, Arial, sans-serif" font-weight="700" text-anchor="start" fill="#096b70">A repeat can happen. Random selection does not promise everyone a turn.</text></svg>