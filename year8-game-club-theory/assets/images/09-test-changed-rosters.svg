<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Will it work with a different roster?</title><desc id="desc">Test A contains Ash, length 1. Test B contains Nova Luna Pixel, length 3. Test C contains Nova Luna Pixel Orbit Comet, length 5. The same program must print each current player in order, show the correct count and choose a captain from that list.</desc><defs><marker id="arrow-096b70" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#096b70" stroke-width="1.8"/></marker><marker id="arrow-6746ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#6746ab" stroke-width="1.8"/></marker><marker id="arrow-ad6507" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#ad6507" stroke-width="1.8"/></marker><marker id="arrow-ad3443" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#ad3443" stroke-width="1.8"/></marker><marker id="arrow-23619c" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#23619c" stroke-width="1.8"/></marker></defs><rect width="1600" height="1000" fill="white"/><text xml:space="preserve" style="white-space:pre" x="56" y="54" font-size="23" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#096b70">GAME CLUB  /  PYTHON LISTS</text><text xml:space="preserve" style="white-space:pre" x="56" y="126" font-size="54" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#182e37">Will it work with a different roster?</text><text xml:space="preserve" style="white-space:pre" x="56" y="174" font-size="27" font-family="Raleway, Arial, sans-serif" font-weight="500" text-anchor="start" fill="#50636c">Test one player, three players and five players.</text><rect x="56" y="226" width="476" height="612" rx="20" fill="#ffffff" stroke="#c8d5d9" stroke-width="2"/><text xml:space="preserve" style="white-space:pre" x="81" y="274" font-size="23" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#096b70">ROSTER A</text><text xml:space="preserve" style="white-space:pre" x="81" y="322" font-size="37" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#182e37">1 player</text><text xml:space="preserve" style="white-space:pre" x="81" y="368" font-size="20" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#50636c">CURRENT LIST</text><text xml:space="preserve" style="white-space:pre" x="81" y="410" font-size="28" font-family="Menlo, DejaVu Sans Mono, monospace" font-weight="600" text-anchor="start" fill="#182e37">0: Ash</text><rect x="76" y="640" width="436" height="170" rx="14" fill="#e7f4f1" stroke="none" stroke-width="2"/><text xml:space="preserve" style="white-space:pre" x="96" y="679" font-size="20" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#096b70">WHAT MUST BE TRUE?</text><text xml:space="preserve" style="white-space:pre" x="96" y="724" font-size="25" font-family="Raleway, Arial, sans-serif" font-weight="600" text-anchor="start" fill="#182e37">1 names print, in list order.</text><text xml:space="preserve" style="white-space:pre" x="96" y="761" font-size="25" font-family="Raleway, Arial, sans-serif" font-weight="600" text-anchor="start" fill="#182e37">Count shown: 1.</text><text xml:space="preserve" style="white-space:pre" x="96" y="798" font-size="25" font-family="Raleway, Arial, sans-serif" font-weight="600" text-anchor="start" fill="#182e37">Captain belongs to this list.</text><rect x="562" y="226" width="476" height="612" rx="20" fill="#ffffff" stroke="#c8d5d9" stroke-width