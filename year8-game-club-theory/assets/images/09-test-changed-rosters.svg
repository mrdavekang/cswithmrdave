al, sans-serif" font-weight="800" text-anchor="start" fill="#096b70">WHAT MUST BE TRUE?</text><text xml:space="preserve" style="white-space:pre" x="1108" y="724" font-size="25" font-family="Raleway, Arial, sans-serif" font-weight="600" text-anchor="start" fill="#182e37">5 names print, in list order.</text><text xml:space="preserve" style="white-space:pre" x="1108" y="761" font-size="25" font-family="Raleway, Arial, sans-serif" font-weight="600" text-anchor="start" fill="#182e37">Count shown: 5.</text><text xml:space="preserve" style="white-space:pre" x="1108" y="798" font-size="25" font-family="Raleway, Arial, sans-serif" font-weight="600" text-anchor="start" fill="#182e37">Captain belongs to this list.</text><rect x="56" y="890" width="1488" height="64" rx="14" fill="#e7f4f1" stroke="none" stroke-width="2"/><text xml:space="preserve" style="white-space:pre" x="80" y="932" font-size="27" font-family="Raleway, Arial, sans-serif" font-weight="700" text-anchor="start" fill="#096b70">Use the same program for all three rosters. Do not hard-code the names or list length.</text></svg>