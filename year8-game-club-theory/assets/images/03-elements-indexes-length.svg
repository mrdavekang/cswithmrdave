<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Position is not the same as index</title><desc id="desc">Nova is first at index 0, Echo second at index 1, Pixel third at index 2. The list has length 3 and last valid index 2.</desc><defs><marker id="arrow-096b70" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#096b70" stroke-width="1.8"/></marker><marker id="arrow-6746ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#6746ab" stroke-width="1.8"/></marker><marker id="arrow-ad6507" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#ad6507" stroke-width="1.8"/></marker><marker id="arrow-ad3443" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#ad3443" stroke-width="1.8"/></marker><marker id="arrow-23619c" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#23619c" stroke-width="1.8"/></marker></defs><rect width="1600" height="1000" fill="white"/><text xml:space="preserve" style="white-space:pre" x="56" y="54" font-size="23" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#096b70">GAME CLUB  /  PYTHON LISTS</text><text xml:space="preserve" style="white-space:pre" x="56" y="126" font-size="54" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#182e37">Position is not the same as index</text><text xml:space="preserve" style="white-space:pre" x="56" y="174" font-size="27" font-family="Raleway, Arial, sans-serif" font-weight="500" text-anchor="start" fill="#50636c">Read the names in order. Python indexes start at 0.</text><rect x="56" y="218" width="1488" height="135" rx="20" fill="#f3f6f7" stroke="#c8d5d9" stroke-width="2"/><text xml:space="preserve" style="white-space:pre" x="82" y="257" font-size="21" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#50636c">STARTING LIST</text><text xml:space="preserve" style="white-space:pre" x="82" y="311" font-size="34" font-family="Menlo, DejaVu Sans Mono, monospace" font-weight="500" text-anchor="start" fill="#182e37">players = [&quot;Nova&quot;, &quot;Echo&quot;, &quot;Pixel&quot;]</text><rect x="56" y="406" width="484" height="235" rx="18" fill="#ffffff" stroke="#c8d5d9" stroke-width="2"/><text xml:space="preserve" style="white-space:pre" x="298" y="436" font-size="21" font-family="Raleway, Arial, sans-serif" font-weight="700" text-anchor="middle" fill="#50636c">FIRST</text><g transform="translate(298,486) scale(0.7)"><rect x="-30" y="-30" width="60" height="65" rx="20" fill="#23619c" stroke="none" stroke-width="2"/><rect x="-23" y="-15" width="46" height="25" rx="11" fill="#dff3ff" stroke="none" stroke-width="2"/><path d="M-17,-8 Q-5,-16 9,-10" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M-18,29 L-18,43 M18,29 L18,43" stroke="#23619c" stroke-width="15" stroke-linecap="round"/></g><text xml:space="preserve" style="white-space:pre" x="298" y="549" font-size="34" font-family="Raleway, Arial, sans-serif" font-weight="750" text-anchor="middle" fill="#182e37">Nova</text><text xml:space="preserve" style="white-space:pre" x="298" y="623" font-size="26" font-family="Raleway, Arial, sans-serif" font-weight="700" text-anchor="middle" fill="#50636c">index 0</text><rect x="558" y="406" width="484" height="235" rx="18" fill="#ffffff" stroke="#c8d5d9" stroke-width="2"/><text xml:space="preserve" style="white-space:pre" x="800" y="436" font-size="21" font-family="Raleway, Arial, sans-serif" font-weight="700" text-anchor="middle" fill="#50636c">SECOND</text><g transform="translate(800,486) scale(0.7)"><rect x="-30" y="-30" width="60" height="65" rx="20" fill="#6746ab" stroke="none" stroke-width="2"/><rect x="-23" y="-15" width="46" height="25" rx="11" fill="#dff3ff" stroke="none" stroke-width="2"/><path d="M-17,-8 Q-5,-16 9,-10" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M-18,29 L-18,43 M18,29 L18,43" stroke="#6746ab" stroke-width="15" stroke-linecap="round"/></g><text xml:space="preserve" style="white-space:pre" x="800" y="549" font-size="34" font-family="Raleway, Arial, sans-serif" font-weight="750" text-anchor="middle" fill="#182e37">Echo</text><text xml:space="preserve" style="white-space:pre" x="800" y="623" font-size="26" font-family="Raleway, Arial, sans-serif" font-weight="700" text-anchor="middle" fill="#50636c">index 1</text><rect x="1060" y="406" width="484" height="235" rx="18" fill="#ffffff" stroke="#c8d5d9" stroke-width="2"/><text xml:space="preserve" style="white-space:pre" x="1302" y="436" font-size="21" font-family="Raleway, Arial, sans-serif" font-weight="700" text-anchor="middle" fill="#50636c">THIRD</text><g transform="translate(1302,486) scale(0.7)"><rect x="-30" y="-30" width="60" height="65" rx="20" fill="#ad6507" stroke="none" stroke-width="2"/><rect x="-23" y="-15" width="46" height="25" rx="11" fill="#dff3ff" stroke="none" stroke-width="2"/><path d="M-17,-8 Q-5,-16 9,-10" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M-18,29 L-18,43 M18,29 L18,43" stroke="#ad6507" stroke-width="15" stroke-linecap="round"/></g><text xml:space="preserve" style="white-space:pre" x="1302" y="549" font-size="34" font-family="Raleway, Arial, sans-serif" font-weight="750" text-anchor="middle" fill="#182e37">Pixel</text><text xml:space="preserve" style="white-space:pre" x="1302" y="623" font-size="26" font-family="Raleway, Arial, sans-serif" font-weight="700" text-anchor="middle" fill="#50636c">index 2</text><rect x="56" y="700" width="720" height="128" rx="20" fill="#e7f4f1" stroke="none" stroke-width="2"/><text xml:space="preserve" style="white-space:pre" x="88" y="747" font-size="22" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#096b70">LENGTH</text><text xml:space="preserve" style="white-space:pre" x="88" y="800" font-size="42" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#182e37">3 elements</text><rect x="804" y="700" width="740" height="128" rx="20" fill="#f0ebf8" stroke="none" stroke-width="2"/><text xml:space="preserve" style="white-space:pre" x="836" y="747" font-size="22" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#6746ab">LAST VALID INDEX</text><text xml:space="preserve" style="white-space:pre" x="836" y="800" font-size="42" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#182e37">2 = length - 1</text><rect x="56" y="890" width="1488" height="64" rx="14" fill="#e7f4f1" stroke="none" stroke-width="2"/><text xml:space="preserve" style="white-space:pre" x="80" y="932" font-size="27" font-family="Raleway, Arial, sans-serif" font-weight="700" text-anchor="start" fill="#096b70">The third player is Pixel. Read Pixel with players[2], not players[3].</text></svg>