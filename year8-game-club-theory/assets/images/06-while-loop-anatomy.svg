<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Four jobs inside a list-reading loop</title><desc id="desc">The counter starts at 0. While position is less than the length, print players at that position and increment the counter by 1. At position 4, 4 less than 4 is false, so stop.</desc><defs><marker id="arrow-096b70" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#096b70" stroke-width="1.8"/></marker><marker id="arrow-6746ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#6746ab" stroke-width="1.8"/></marker><marker id="arrow-ad6507" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#ad6507" stroke-width="1.8"/></marker><marker id="arrow-ad3443" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#ad3443" stroke-width="1.8"/></marker><marker id="arrow-23619c" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#23619c" stroke-width="1.8"/></marker></defs><rect width="1600" height="1000" fill="white"/><text xml:space="preserve" style="white-space:pre" x="56" y="54" font-size="23" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#096b70">GAME CLUB  /  PYTHON LISTS</text><text xml:space="preserve" style="white-space:pre" x="56" y="126" font-size="54" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#182e37">Four jobs inside a list-reading loop</text><text xml:space="preserve" style="white-space:pre" x="56" y="174" font-size="27" font-family="Raleway, Arial, sans-serif" font-weight="500" text-anchor="start" fill="#50636c">Start. Check. Read. Move. Then check again.</text><rect x="56" y="246" width="940" height="370" rx="20" fill="#f3f6f7" stroke="#c8d5d9" stroke-width="2"/><text xml:space="preserve" style="white-space:pre" x="82" y="285" font-size="21" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#50636c">STANDARD PYTHON  /  WORKED EXAMPLE</text><text xml:space="preserve" style="white-space:pre" x="82" y="339" font-size="31" font-family="Menlo, DejaVu Sans Mono, monospace" font-weight="500" text-anchor="start" fill="#182e37">players = [&quot;Nova&quot;, &quot;Luna&quot;, &quot;Pixel&quot;, &quot;Orbit&quot;]</text><text xml:space="preserve" style="white-space:pre" x="82" y="385.5" font-size="31" font-family="Menlo, DejaVu Sans Mono, monospace" font-weight="500" text-anchor="start" fill="#182e37">position = 0</text><text xml:space="preserve" style="white-space:pre" x="82" y="432" font-size="31" font-family="Menlo, DejaVu Sans Mono, monospace" font-weight="500" text-anchor="start" fill="#182e37">while position &lt; len(players):</text><text xml:space="preserve" style="white-space:pre" x="82" y="478.5" font-size="31" font-family="Menlo, DejaVu Sans Mono, monospace" font-weight="500" text-anchor="start" fill="#182e37">    print(players[position])</text><text xml:space="preserve" style="white-space:pre" x="82" y="525" font-size="31" font-family="Menlo, DejaVu Sans Mono, monospace" font-weight="500" text-anchor="start" fill="#182e37">    position = position + 1</text><circle cx="1044" cy="377" r="23" fill="#096b70"/><text xml:space="preserve" style="white-space:pre" x="1044" y="386" font-size="27" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="middle" fill="#ffffff">1</text><text xml:space="preserve" style="white-space:pre" x="1083" y="385" font-size="28" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#096b70">START at index 0</text><circle cx="1044" cy="424" r="23" fill="#096b70"/><text xml:space="preserve" style="white-space:pre" x="1044" y="433" font-size="27" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="middle" fill="#ffffff">2</text><text xml:space="preserve" style="white-space:pre" x="1083" y="432" font-size="28" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#096b70">CHECK: still inside?</text><circle cx="1044" cy="471" r="23" fill="#096b70"/><text xml:space="preserve" style="white-space:pre" x="1044" y="480" font-size="27" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="middle" fill="#ffffff">3</text><text xml:space="preserve" style="white-space:pre" x="1083" y="479" font-size="28" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#096b70">READ one element</text><circle cx="1044" cy="517" r="23" fill="#096b70"/><text xml:space="preserve" style="white-space:pre" x="1044" y="526" font-size="27" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="middle" fill="#ffffff">4</text><text xml:space="preserve" style="white-space:pre" x="1083" y="525" font-size="28" font-family="Raleway, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#096b70">MOVE: add 1</text><path d="M990,546 H1010 V432 H990" fill="none" stroke="#6746ab" stroke-width="4" marker-end="url(#arrow-6746ab)"/><text xml:space="preserve" style="white-space:pre" x="56" y="681" font-size="33" font-family="Raleway, Arial, sans-serif" font-weight="750" text-anchor="start" fill="#182e37">The four valid indexes are 0, 1, 2 and 3.</text><rect x="56" y="725" width="1488" height="112" rx="20" fill="#f0ebf8" stroke="none" stroke-width="2"/><text xml:space="preserve" style="white-space:pre" x="84" y="771" font-size="34" font-family="Raleway, Arial, sans-serif" font-weight="750" text-anchor="start" fill="#6746ab">At position = 4, the condition 4 &lt; 4 is false.</text><text xml:space="preserve" style="white-space:pre" x="84" y="814" font-size="29" font-family="Raleway, Arial, sans-serif" font-weight="600" text-anchor="start" fill="#182e37">The loop stops before trying to read players[4].</text><rect x="56" y="890" width="1488" height="64" rx="14" fill="#e7f4f1" stroke="none" stroke-width="2"/><text xml:space="preserve" style="white-space:pre" x="80" y="932" font-size="27" font-family="Raleway, Arial, sans-serif" font-weight="700" text-anchor="start" fill="#096b70">The counter does not change itself. The update line moves it to the next index.</text></svg>